<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">

  <title>Dell G15 Movies</title>
  <meta name="description" content="Dell G15 Movies — Stream movies and series live across hosted Windows devices.">
  <meta name="author" content="Sanchar Koirala">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Dell G15 Movies">
  <meta name="theme-color" content="#e3e8ef" id="metaThemeColor">

  <link rel="icon" type="image/png" sizes="32x32" href="favicon.png">
  <link rel="apple-touch-icon" href="favicon.png">

  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.15/dist/hls.min.js"></script>

  <style>
    /* ============================================================
       THEME 1 (LIGHT): SOFT COOL GREY, STEEL BLUE & NAVY BLUE
       ============================================================ */
    :root[data-theme="light"] {
      --bg: #e3e8ef;
      --surface: #ebf0f6;
      --surface-alt: #f4f7fc;
      --neu-out: 7px 7px 15px #c1cad6, -7px -7px 15px #ffffff;
      --neu-out-sm: 4px 4px 9px #c1cad6, -4px -4px 9px #ffffff;
      --neu-in: inset 4px 4px 8px #c1cad6, inset -4px -4px 8px #ffffff;
      --stroke: rgba(255, 255, 255, 0.74);
      --divider: rgba(16, 35, 60, 0.08);
      --text: #10233c;
      --text-2: #445a74;
      --text-muted: #6c8099;
      --steel: #2f6394;
      --steel-bright: #3d79b0;
      --steel-soft: rgba(47, 99, 148, 0.12);
      --navy: #142b47;
      --navy-soft: rgba(20, 43, 71, 0.09);
      --brand-grad: linear-gradient(135deg, #2f6394 0%, #10233c 100%);
      --brand-shadow: 0 6px 16px rgba(16, 35, 60, 0.24);
      --green: #169c5b;
      --amber: #d97706;
    }

    /* ============================================================
       THEME 2 (DARK): DEEP NAVY, MIDNIGHT SLATE & LUMINOUS STEEL BLUE
       ============================================================ */
    :root[data-theme="dark"] {
      --bg: #0c1320;
      --surface: #121c2e;
      --surface-alt: #18253d;
      --neu-out: 7px 7px 16px #060a12, -6px -6px 14px #1a2842;
      --neu-out-sm: 4px 4px 10px #060a12, -4px -4px 10px #1a2842;
      --neu-in: inset 4px 4px 9px #060a12, inset -4px -4px 9px #1a2842;
      --stroke: rgba(139, 188, 232, 0.08);
      --divider: rgba(139, 188, 232, 0.09);
      --text: #edf2f8;
      --text-2: #9db2cc;
      --text-muted: #69809c;
      --steel: #5b9bd5;
      --steel-bright: #75b0e6;
      --steel-soft: rgba(91, 155, 213, 0.16);
      --navy: #8bbce8;
      --navy-soft: rgba(139, 188, 232, 0.12);
      --brand-grad: linear-gradient(135deg, #5b9bd5 0%, #244b78 100%);
      --brand-shadow: 0 6px 18px rgba(6, 10, 18, 0.55);
      --green: #2ecc80;
      --amber: #f59e0b;
    }

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100dvh;
      height: var(--app-height, 100dvh);
      max-height: 100dvh;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
      font-size: 14px;
      overflow: hidden;
      overscroll-behavior: none;
      touch-action: manipulation;
    }

    body {
      display: flex;
      flex-direction: column;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px);
      padding-left: env(safe-area-inset-left, 0px);
      padding-right: env(safe-area-inset-right, 0px);
      transition: background 0.2s ease, color 0.2s ease;
    }

    .mono {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      letter-spacing: -0.2px;
    }

    /* ============================================================
       TACTILE MICRO-INDICATORS (SIGNAL BARS & TELEMETRY PILLS)
       ============================================================ */
    .sig-bars {
      display: inline-flex;
      align-items: flex-end;
      gap: 2px;
      height: 11px;
      flex-shrink: 0;
    }
    .sig-bars i {
      width: 2.5px;
      border-radius: 1.5px;
      background: var(--divider);
      display: block;
    }
    .sig-bars i:nth-child(1) { height: 4px; }
    .sig-bars i:nth-child(2) { height: 7.5px; }
    .sig-bars i:nth-child(3) { height: 11px; }
    .sig-bars.s3 i { background: var(--green); }
    .sig-bars.s2 i:nth-child(1),
    .sig-bars.s2 i:nth-child(2) { background: var(--steel); }
    .sig-bars.s1 i:nth-child(1) { background: var(--amber); }

    .telemetry-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 2px 8px;
      border-radius: 8px;
      background: var(--navy-soft);
      color: var(--text-2);
      font-size: 11px;
      font-weight: 700;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 7px var(--green);
      display: inline-block;
      flex-shrink: 0;
    }
    .status-dot.off {
      background: var(--text-muted);
      box-shadow: none;
    }

    /* ============================================================
       ONE UI + iOS FILES TOP BAR
       ============================================================ */
    .top-bar {
      padding: 12px 18px 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-shrink: 0;
      z-index: 20;
    }

    .brand-box {
      display: flex;
      align-items: center;
      gap: 11px;
      cursor: pointer;
      flex-shrink: 0;
    }

    .squircle-logo {
      width: 40px;
      height: 40px;
      border-radius: 14px;
      background: var(--brand-grad);
      box-shadow: var(--brand-shadow);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      flex-shrink: 0;
    }

    .brand-meta {
      display: flex;
      flex-direction: column;
    }

    .brand-title {
      font-size: 16.5px;
      font-weight: 800;
      letter-spacing: -0.2px;
      color: var(--text);
      line-height: 1.15;
    }

    .telemetry-strip {
      margin-top: 3px;
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      font-weight: 700;
      color: var(--text-2);
    }

    .top-controls {
      display: flex;
      align-items: center;
      gap: 8px;
      flex: 1;
      justify-content: flex-end;
      min-width: 0;
    }

    .search-well {
      width: 100%;
      max-width: 250px;
      height: 38px;
      border-radius: 19px;
      background: var(--surface);
      box-shadow: var(--neu-in);
      border: 1px solid var(--stroke);
      padding: 0 14px;
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--text-2);
    }
    .search-well:focus-within { border-color: var(--steel); }
    .search-well input {
      width: 100%;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text);
      font-size: 13px;
      font-weight: 500;
      font-family: inherit;
    }
    .search-well input::placeholder { color: var(--text-muted); }

    .morph-btn {
      height: 38px;
      padding: 0 13px;
      border-radius: 19px;
      background: var(--surface);
      box-shadow: var(--neu-out-sm);
      border: 1px solid var(--stroke);
      color: var(--text);
      font-size: 12px;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      cursor: pointer;
      flex-shrink: 0;
      transition: transform 0.12s ease, box-shadow 0.12s ease, color 0.12s ease;
    }
    .morph-btn:hover { color: var(--steel); }
    .morph-btn:active {
      transform: scale(0.96);
      box-shadow: var(--neu-in);
    }
    .morph-btn.icon-sq {
      width: 38px;
      padding: 0;
      border-radius: 14px;
    }
    .morph-btn.accent {
      background: var(--brand-grad);
      color: #ffffff;
      border-color: transparent;
      box-shadow: var(--brand-shadow);
    }
    .morph-btn.party-live {
      border-color: var(--green);
      color: var(--green);
    }

    /* ============================================================
       ONE UI / iOS FILES FILTER RIBBON
       ============================================================ */
    .filter-bar {
      padding: 4px 18px 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
      flex-shrink: 0;
    }

    .segmented-group {
      display: inline-flex;
      align-items: center;
      padding: 3px;
      border-radius: 16px;
      background: var(--surface);
      box-shadow: var(--neu-in);
      border: 1px solid var(--stroke);
      gap: 3px;
    }

    .seg-tab {
      height: 30px;
      padding: 0 13px;
      border-radius: 13px;
      font-size: 12px;
      font-weight: 700;
      color: var(--text-2);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: 0.15s ease;
    }
    .seg-tab:hover { color: var(--text); }
    .seg-tab.active {
      background: var(--surface-alt);
      box-shadow: var(--neu-out-sm);
      color: var(--steel);
    }

    .select-filters {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .morph-select-wrap {
      height: 36px;
      padding: 0 12px;
      border-radius: 14px;
      background: var(--surface);
      box-shadow: var(--neu-out-sm);
      border: 1px solid var(--stroke);
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--text-2);
      font-size: 12px;
      font-weight: 700;
    }

    .morph-select-wrap select {
      background: transparent;
      border: none;
      outline: none;
      color: var(--text);
      font-size: 12px;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
    }
    .morph-select-wrap select option {
      background: var(--surface);
      color: var(--text);
    }

    /* ============================================================
       MAIN SCROLLABLE EXPLORER WORKSPACE
       ============================================================ */
    .explorer-scroll {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding: 4px 18px 20px;
    }
    .explorer-scroll::-webkit-scrollbar { width: 5px; }
    .explorer-scroll::-webkit-scrollbar-thumb {
      background: var(--divider);
      border-radius: 99px;
    }

    .category-section {
      margin-bottom: 22px;
    }

    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 4px 4px 10px;
    }

    .section-title-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .section-heading {
      font-size: 15px;
      font-weight: 800;
      color: var(--text);
      letter-spacing: -0.2px;
    }

    .count-badge {
      padding: 2px 9px;
      border-radius: 999px;
      background: var(--steel-soft);
      color: var(--steel);
      font-size: 11px;
      font-weight: 800;
    }

    /* iOS Files Squircle Grid */
    .files-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(215px, 1fr));
      gap: 15px;
    }

    .file-tile {
      background: var(--surface);
      box-shadow: var(--neu-out);
      border: 1px solid var(--stroke);
      border-radius: 24px;
      padding: 11px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      cursor: pointer;
      transition: transform 0.14s ease, border-color 0.14s ease;
    }
    .file-tile:hover {
      transform: translateY(-2px);
      border-color: var(--steel);
    }
    .file-tile:active {
      transform: scale(0.985);
      box-shadow: var(--neu-in);
    }

    .thumb-frame {
      width: 100%;
      aspect-ratio: 16 / 10;
      border-radius: 16px;
      overflow: hidden;
      position: relative;
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.14);
      background: var(--navy);
    }
    .thumb-frame svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    .tile-body {
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding: 0 2px;
    }

    .tile-name {
      font-size: 13.5px;
      font-weight: 700;
      color: var(--text);
      line-height: 1.3;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      word-break: break-word;
    }

    .tile-tags {
      display: flex;
      align-items: center;
      gap: 5px;
      flex-wrap: wrap;
    }

    .spec-pill {
      padding: 2px 6px;
      border-radius: 6px;
      background: var(--steel-soft);
      color: var(--steel);
      font-size: 10px;
      font-weight: 800;
    }

    .tile-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      font-size: 10.5px;
      font-weight: 700;
      color: var(--text-muted);
    }

    .host-tag {
      padding: 2px 7px;
      border-radius: 7px;
      background: var(--navy-soft);
      color: var(--navy);
      font-size: 10.5px;
      font-weight: 800;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      max-width: 125px;
    }
    .host-tag span {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Samsung One UI Grouped List View */
    .oneui-list-card {
      background: var(--surface);
      box-shadow: var(--neu-out);
      border: 1px solid var(--stroke);
      border-radius: 26px;
      overflow: hidden;
    }

    .oneui-row {
      padding: 11px 15px;
      display: flex;
      align-items: center;
      gap: 13px;
      cursor: pointer;
      border-bottom: 1px solid var(--divider);
      transition: background 0.12s ease;
    }
    .oneui-row:last-child { border-bottom: none; }
    .oneui-row:hover { background: var(--steel-soft); }
    .oneui-row:active { background: var(--navy-soft); }

    .row-thumb {
      width: 72px;
      height: 48px;
      border-radius: 13px;
      overflow: hidden;
      flex-shrink: 0;
      box-shadow: var(--neu-out-sm);
    }
    .row-thumb svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    .row-info {
      flex: 1;
      min-width: 0;
    }

    .row-name {
      font-size: 13.5px;
      font-weight: 700;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .row-sub {
      margin-top: 4px;
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
      font-size: 11px;
      font-weight: 700;
      color: var(--text-muted);
    }

    .row-chevron {
      width: 30px;
      height: 30px;
      border-radius: 11px;
      background: var(--surface-alt);
      box-shadow: var(--neu-out-sm);
      color: var(--steel);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      font-weight: 800;
    }

    /* Series Header Card (Inside a Series Folder) */
    .series-head-card {
      background: var(--surface);
      box-shadow: var(--neu-out);
      border: 1px solid var(--stroke);
      border-radius: 26px;
      padding: 15px 18px;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      flex-wrap: wrap;
    }

    .series-head-left {
      display: flex;
      align-items: center;
      gap: 13px;
      min-width: 0;
      flex: 1;
    }

    .series-head-thumb {
      width: 84px;
      height: 54px;
      border-radius: 16px;
      overflow: hidden;
      flex-shrink: 0;
      box-shadow: var(--neu-out-sm);
    }
    .series-head-thumb svg { width: 100%; height: 100%; display: block; }

    .empty-card {
      max-width: 360px;
      margin: 44px auto;
      background: var(--surface);
      box-shadow: var(--neu-out);
      border: 1px solid var(--stroke);
      border-radius: 28px;
      padding: 28px 22px;
      text-align: center;
    }
    .empty-card h3 {
      margin: 0 0 6px;
      font-size: 16px;
      font-weight: 800;
    }
    .empty-card p {
      margin: 0 0 18px;
      color: var(--text-2);
      font-size: 12.5px;
      line-height: 1.45;
    }

    footer {
      padding: 7px 18px 9px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 11px;
      font-weight: 700;
      color: var(--text-muted);
      flex-shrink: 0;
    }

    .storage-meter {
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
    .storage-track {
      width: 56px;
      height: 5px;
      border-radius: 99px;
      background: var(--surface);
      box-shadow: var(--neu-in);
      overflow: hidden;
    }
    .storage-fill {
      height: 100%;
      width: 45%;
      border-radius: 99px;
      background: var(--steel);
      transition: width 0.3s ease;
    }

    /* ============================================================
       CINEMA PLAYER & EXCLUSIVE FULLSCREEN MODE
       ============================================================ */
    .player-screen {
      display: none;
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100dvh;
      height: var(--app-height, 100dvh);
      max-height: 100dvh;
      background: #070b14;
      z-index: 100;
      flex-direction: column;
      overflow: hidden;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px);
      padding-left: env(safe-area-inset-left, 0px);
      padding-right: env(safe-area-inset-right, 0px);
    }
    .player-screen.open { display: flex; }

    /* Decluttered Player Top Bar */
    .player-header {
      padding: 9px 15px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      background: #0e1626;
      border-bottom: 1px solid rgba(139, 188, 232, 0.12);
      flex-shrink: 0;
      min-height: 50px;
    }

    .player-title-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
      flex: 1;
    }

    .player-name {
      font-weight: 700;
      font-size: 14px;
      color: #edf2f8;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      min-width: 0;
    }

    .quality-badge {
      padding: 3px 9px;
      border-radius: 9px;
      background: rgba(91, 155, 213, 0.18);
      border: 1px solid rgba(91, 155, 213, 0.34);
      color: #8bbce8;
      font-size: 10.5px;
      font-weight: 800;
      white-space: nowrap;
      flex-shrink: 0;
      pointer-events: none;
    }

    .party-badge-pill {
      padding: 3px 9px;
      border-radius: 9px;
      background: rgba(46, 204, 128, 0.16);
      border: 1px solid rgba(46, 204, 128, 0.38);
      color: #2ecc80;
      font-size: 10.5px;
      font-weight: 800;
      display: none;
      align-items: center;
      gap: 5px;
      cursor: pointer;
      flex-shrink: 0;
    }
    .party-badge-pill.show { display: inline-flex; }

    .player-pills {
      display: flex;
      align-items: center;
      gap: 7px;
      flex-shrink: 0;
    }

    .p-pill {
      height: 33px;
      padding: 0 12px;
      border-radius: 13px;
      background: rgba(139, 188, 232, 0.1);
      border: 1px solid rgba(139, 188, 232, 0.14);
      color: #edf2f8;
      font-size: 12px;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      cursor: pointer;
      white-space: nowrap;
      transition: transform 0.12s ease, background 0.15s ease;
    }
    .p-pill:hover:not(.disabled) { background: rgba(139, 188, 232, 0.2); }
    .p-pill:active:not(.disabled) { transform: scale(0.95); }
    .p-pill.disabled { opacity: 0.32; pointer-events: none; }
    .p-pill.steel-pill {
      background: linear-gradient(135deg, #3b74a8, #1f446e);
      border-color: rgba(139, 188, 232, 0.3);
      color: #ffffff;
    }
    .p-pill.icon-pill {
      width: 33px;
      padding: 0;
    }

    .player-workspace {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: row;
      overflow: hidden;
      width: 100%;
    }

    .player-main {
      flex: 1;
      min-width: 0;
      min-height: 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: #000000;
    }

    .video-stage {
      flex: 1;
      min-height: 0;
      width: 100%;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000000;
      overflow: hidden;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      outline: none;
      pointer-events: none;
      display: block;
    }

    /* Floating Watch Party Reactions Layer */
    .reaction-layer {
      position: absolute;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: 110;
    }
    .float-emoji {
      position: absolute;
      bottom: 24px;
      font-size: 26px;
      animation: floatUp 2.1s ease-out forwards;
      filter: drop-shadow(0 4px 10px rgba(0, 0, 0, 0.6));
    }
    @keyframes floatUp {
      0% { opacity: 0; transform: translateY(10px) scale(0.7); }
      15% { opacity: 1; transform: translateY(-12px) scale(1.08); }
      100% { opacity: 0; transform: translateY(-170px) scale(0.95); }
    }

    /* Exclusive Fullscreen Button — Hidden in Normal Mode, Active Only in Fullscreen Mode */
    .fs-exit-btn {
      display: none;
      position: absolute;
      top: max(16px, env(safe-area-inset-top, 16px));
      right: max(18px, env(safe-area-inset-right, 18px));
      z-index: 140;
      height: 40px;
      padding: 0 16px;
      border-radius: 16px;
      background: rgba(12, 19, 32, 0.82);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(139, 188, 232, 0.3);
      color: #edf2f8;
      font-size: 12.5px;
      font-weight: 700;
      align-items: center;
      gap: 7px;
      cursor: pointer;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.65);
      transition: opacity 0.2s ease, transform 0.2s ease, background 0.15s ease;
    }
    .fs-exit-btn:hover {
      background: #2f6394;
      color: #ffffff;
    }
    .fs-exit-btn:active {
      transform: scale(0.95);
    }

    /* Exclusive Fullscreen State */
    .player-screen.fs-active {
      padding: 0 !important;
      background: #000000 !important;
    }
    .player-screen.fs-active .player-header,
    .player-screen.fs-active .player-controls,
    .player-screen.fs-active .episode-pane {
      display: none !important;
    }
    .player-screen.fs-active .player-workspace,
    .player-screen.fs-active .player-main {
      width: 100% !important;
      height: 100% !important;
      max-height: none !important;
    }
    .player-screen.fs-active .video-stage {
      position: fixed !important;
      inset: 0 !important;
      width: 100vw !important;
      height: 100dvh !important;
      max-height: none !important;
      aspect-ratio: auto !important;
      z-index: 125 !important;
      cursor: pointer;
    }
    .player-screen.fs-active.fs-rotate-fallback .video-stage {
      width: 100dvh !important;
      height: 100vw !important;
      top: 50% !important;
      left: 50% !important;
      right: auto !important;
      bottom: auto !important;
      transform: translate(-50%, -50%) rotate(90deg) !important;
    }
    .player-screen.fs-active .fs-exit-btn {
      display: inline-flex;
      opacity: 1;
      pointer-events: auto;
    }
    .player-screen.fs-active .fs-exit-btn.fs-hidden {
      opacity: 0;
      pointer-events: none;
      transform: translateY(-8px);
    }

    .loader-box {
      position: absolute;
      inset: 0;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      background: rgba(7, 11, 20, 0.45);
      pointer-events: none;
      z-index: 15;
    }
    .loader-box.show { display: flex; }
    .loader-circle {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      border: 3px solid rgba(139, 188, 232, 0.18);
      border-top-color: #5b9bd5;
      animation: spin 0.72s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .player-controls {
      padding: 9px 15px 11px;
      background: #0e1626;
      border-top: 1px solid rgba(139, 188, 232, 0.12);
      display: flex;
      flex-direction: column;
      gap: 8px;
      flex-shrink: 0;
    }

    .seek-area {
      height: 18px;
      display: flex;
      align-items: center;
      cursor: pointer;
      touch-action: none;
    }
    .seek-bar {
      width: 100%;
      height: 5px;
      border-radius: 999px;
      background: rgba(139, 188, 232, 0.18);
      position: relative;
      transition: height 0.12s ease;
    }
    .seek-area:hover .seek-bar,
    .seek-area:active .seek-bar { height: 7px; }
    .seek-progress {
      height: 100%;
      width: 0%;
      border-radius: 999px;
      background: linear-gradient(90deg, #2f6394, #6aa9e3);
      position: relative;
    }
    .seek-knob {
      position: absolute;
      right: -7px;
      top: 50%;
      transform: translateY(-50%);
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #edf2f8;
      box-shadow: 0 0 10px rgba(91, 155, 213, 0.95);
    }

    .ctrl-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      min-width: 0;
    }
    .ctrl-group {
      display: flex;
      align-items: center;
      gap: 7px;
      min-width: 0;
    }
    .clock-text {
      font-family: ui-monospace, Consolas, monospace;
      font-size: 12px;
      color: #9db2cc;
      padding: 0 4px;
      white-space: nowrap;
    }

    .vol-box {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      background: rgba(139, 188, 232, 0.1);
      border: 1px solid rgba(139, 188, 232, 0.14);
      border-radius: 13px;
      height: 33px;
      padding: 0 10px 0 8px;
    }
    .vol-mute {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: #edf2f8;
      cursor: pointer;
    }
    .vol-range {
      width: 66px;
      accent-color: #5b9bd5;
      cursor: pointer;
      margin: 0;
    }

    /* Series Episode List Alongside Video */
    .episode-pane {
      width: 295px;
      flex-shrink: 0;
      background: #0c1320;
      border-left: 1px solid rgba(139, 188, 232, 0.12);
      display: none;
      flex-direction: column;
      min-height: 0;
      overflow: hidden;
    }
    .episode-pane.show { display: flex; }

    .ep-pane-head {
      padding: 12px 14px;
      border-bottom: 1px solid rgba(139, 188, 232, 0.12);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-shrink: 0;
    }
    .ep-pane-title {
      font-size: 13px;
      font-weight: 700;
      color: #edf2f8;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .ep-pane-count {
      font-size: 11px;
      font-weight: 800;
      color: #8bbce8;
      background: rgba(91, 155, 213, 0.16);
      padding: 3px 9px;
      border-radius: 9px;
      flex-shrink: 0;
    }

    .ep-list {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding: 8px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .ep-list::-webkit-scrollbar { width: 4px; }
    .ep-list::-webkit-scrollbar-thumb { background: rgba(139, 188, 232, 0.18); border-radius: 99px; }

    .ep-card {
      padding: 10px 11px;
      border-radius: 16px;
      background: rgba(139, 188, 232, 0.05);
      border: 1px solid rgba(139, 188, 232, 0.08);
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      transition: background 0.14s ease, border-color 0.14s ease;
    }
    .ep-card:hover { background: rgba(139, 188, 232, 0.12); }
    .ep-card.active {
      background: rgba(91, 155, 213, 0.18);
      border-color: rgba(91, 155, 213, 0.5);
    }

    .ep-num {
      width: 28px;
      height: 28px;
      border-radius: 10px;
      background: rgba(139, 188, 232, 0.12);
      color: #9db2cc;
      font-size: 11px;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .ep-card.active .ep-num {
      background: #3b74a8;
      color: #ffffff;
    }

    .ep-info { flex: 1; min-width: 0; }
    .ep-name {
      font-size: 12.5px;
      font-weight: 600;
      color: #edf2f8;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .ep-meta {
      margin-top: 3px;
      font-size: 10.5px;
      color: #69809c;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* Popup Modal (Audio, Speed, Overflow Menu, Watch Party) */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(6, 10, 18, 0.76);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 18px;
      z-index: 180;
    }
    .modal-backdrop.open { display: flex; }

    .modal-sheet {
      width: 100%;
      max-width: 390px;
      max-height: 78dvh;
      background: #121c2e;
      border: 1px solid rgba(139, 188, 232, 0.18);
      border-radius: 26px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.85);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      animation: popIn 0.15s ease-out;
    }
    @keyframes popIn {
      from { opacity: 0; transform: scale(0.95) translateY(8px); }
      to { opacity: 1; transform: scale(1) translateY(0); }
    }

    .modal-head {
      padding: 14px 18px;
      border-bottom: 1px solid rgba(139, 188, 232, 0.12);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    .modal-title { font-size: 14.5px; font-weight: 700; color: #edf2f8; }
    .modal-close {
      width: 30px;
      height: 30px;
      border-radius: 11px;
      background: rgba(139, 188, 232, 0.12);
      color: #9db2cc;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
    }

    .modal-list {
      padding: 12px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .modal-option {
      padding: 11px 14px;
      border-radius: 16px;
      background: rgba(139, 188, 232, 0.06);
      border: 1px solid rgba(139, 188, 232, 0.09);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      cursor: pointer;
    }
    .modal-option:hover { background: rgba(139, 188, 232, 0.13); }
    .modal-option.selected {
      background: rgba(91, 155, 213, 0.2);
      border-color: rgba(91, 155, 213, 0.55);
    }

    .opt-main { min-width: 0; flex: 1; }
    .opt-title {
      font-size: 13px;
      font-weight: 600;
      color: #edf2f8;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .opt-sub { margin-top: 2px; font-size: 11px; color: #9db2cc; }
    .opt-check {
      width: 22px;
      height: 22px;
      border-radius: 8px;
      background: #3b74a8;
      color: #ffffff;
      font-size: 12px;
      font-weight: 700;
      display: none;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .modal-option.selected .opt-check { display: inline-flex; }

    /* Watch Party Controls inside Modal */
    .party-code-box {
      padding: 14px;
      border-radius: 18px;
      background: rgba(91, 155, 213, 0.12);
      border: 1px solid rgba(91, 155, 213, 0.28);
      text-align: center;
    }
    .party-code-val {
      font-family: ui-monospace, Consolas, monospace;
      font-size: 26px;
      font-weight: 900;
      letter-spacing: 5px;
      color: #edf2f8;
    }
    .party-input-row {
      display: flex;
      gap: 8px;
    }
    .party-input {
      flex: 1;
      height: 40px;
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid rgba(139, 188, 232, 0.2);
      padding: 0 14px;
      color: #ffffff;
      font-family: ui-monospace, Consolas, monospace;
      font-size: 15px;
      font-weight: 800;
      letter-spacing: 3px;
      text-transform: uppercase;
      outline: none;
    }
    .reaction-bar {
      display: flex;
      justify-content: space-between;
      gap: 6px;
    }
    .react-btn {
      flex: 1;
      height: 38px;
      border-radius: 13px;
      background: rgba(139, 188, 232, 0.09);
      border: 1px solid rgba(139, 188, 232, 0.14);
      font-size: 18px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    .react-btn:active { transform: scale(0.92); }

    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(14px);
      background: #142b47;
      color: #edf2f8;
      border: 1px solid rgba(139, 188, 232, 0.24);
      padding: 9px 18px;
      border-radius: 16px;
      font-size: 12px;
      font-weight: 600;
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.45);
      opacity: 0;
      pointer-events: none;
      transition: all 0.2s ease;
      z-index: 220;
      white-space: nowrap;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    /* ============================================================
       RESPONSIVE MOBILE PORTRAIT & LANDSCAPE FIT
       ============================================================ */
    @media (max-width: 820px) {
      .top-bar { padding: 10px 14px 6px; flex-wrap: wrap; gap: 8px; }
      .top-controls { flex-basis: 100%; justify-content: space-between; }
      .search-well { max-width: none; flex: 1; height: 36px; }
      .morph-btn { height: 36px; padding: 0 11px; font-size: 11.5px; }
      .morph-btn.icon-sq { width: 36px; }
      .filter-bar { padding: 4px 14px 8px; gap: 7px; }
      .explorer-scroll { padding: 4px 14px 14px; }
      .files-grid { grid-template-columns: repeat(2, 1fr); gap: 11px; }
      .file-tile { padding: 9px; border-radius: 20px; }
      .hide-sm { display: none; }
      footer { padding: 6px 14px 8px; font-size: 10.5px; }
    }

    @media (max-width: 900px) and (orientation: portrait) {
      .player-screen:not(.fs-active) .player-header {
        padding: 8px 12px;
        gap: 8px;
        min-height: 46px;
      }
      .player-screen:not(.fs-active) .p-pill { height: 30px; padding: 0 10px; font-size: 11.5px; }
      .player-screen:not(.fs-active) .p-pill.icon-pill { width: 30px; padding: 0; }

      .player-screen:not(.fs-active) .player-workspace { flex-direction: column; }
      .player-screen:not(.fs-active) .player-main { flex: none; }
      .player-screen:not(.fs-active) .player-workspace.no-episodes .player-main { flex: 1; }
      .player-screen:not(.fs-active) .player-workspace:not(.no-episodes) .video-stage {
        flex: none;
        width: 100%;
        aspect-ratio: 16 / 9;
        max-height: 34dvh;
      }
      .player-screen:not(.fs-active) .player-controls { padding: 8px 12px 10px; gap: 7px; }
      .player-screen:not(.fs-active) .ctrl-row { flex-wrap: wrap; gap: 6px; }
      .player-screen:not(.fs-active) .vol-range { width: 54px; }

      .player-screen:not(.fs-active) .episode-pane.show {
        width: 100%;
        flex: 1;
        min-height: 0;
        border-left: none;
        border-top: 1px solid rgba(139, 188, 232, 0.14);
      }
    }

    @media (orientation: landscape) and (max-height: 560px) {
      .top-bar { padding: 7px 14px 4px; }
      footer { display: none; }

      .player-screen:not(.fs-active) .player-header { padding: 5px 12px; min-height: 40px; gap: 8px; }
      .player-screen:not(.fs-active) .player-name { font-size: 13px; }
      .player-screen:not(.fs-active) .p-pill { height: 28px; padding: 0 10px; font-size: 11px; }
      .player-screen:not(.fs-active) .p-pill.icon-pill { width: 28px; padding: 0; }
      .player-screen:not(.fs-active) .player-workspace { flex-direction: row; }
      .player-screen:not(.fs-active) .player-controls { padding: 5px 12px 7px; gap: 4px; }
      .player-screen:not(.fs-active) .seek-area { height: 15px; }
      .player-screen:not(.fs-active) .clock-text { font-size: 11px; }
      .player-screen:not(.fs-active) .vol-box { height: 28px; padding: 0 8px 0 6px; }
      .player-screen:not(.fs-active) .vol-range { width: 50px; }
      .player-screen:not(.fs-active) .episode-pane { width: 235px; }
    }
  </style>
</head>
<body>

  <!-- One UI / iOS Files Header -->
  <header class="top-bar">
    <div class="brand-box" role="button" tabindex="0" onclick="returnToRoot()">
      <div class="squircle-logo">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/><polygon points="10 11 15 14 10 17 10 11" fill="currentColor" stroke="none"/></svg>
      </div>
      <div class="brand-meta">
        <div class="brand-title">Dell G15 Movies</div>
        <div class="telemetry-strip" id="globalTelemetry">
          <span class="status-dot off"></span>
          <span class="mono">0 HOST</span>
        </div>
      </div>
    </div>

    <div class="top-controls">
      <div class="search-well">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
        <input type="text" id="searchInput" placeholder="Search..." oninput="handleSearchInput(this.value)">
      </div>

      <div class="morph-btn" id="btnPartyTop" role="button" tabindex="0" onclick="openWatchPartyModal()" title="Watch Party">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
        <span id="partyTopLabel">Party</span>
      </div>

      <div class="morph-btn icon-sq" id="btnView" role="button" tabindex="0" onclick="toggleViewMode()" title="Switch View">
        <svg id="viewIconSvg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
      </div>
      <div class="morph-btn icon-sq" role="button" tabindex="0" onclick="refreshAllCatalog()" title="Refresh">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3"><path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/></svg>
      </div>
      <div class="morph-btn icon-sq" id="btnTheme" role="button" tabindex="0" onclick="toggleTheme()" title="Switch Theme">☾</div>
    </div>
  </header>

  <!-- Filter Bar: Type (Movies / Series) + Device + Size -->
  <div class="filter-bar" id="filterBar">
    <div class="segmented-group">
      <div class="seg-tab active" id="typeTab_ALL" role="button" tabindex="0" onclick="setTypeFilter('ALL')">All</div>
      <div class="seg-tab" id="typeTab_MOVIES" role="button" tabindex="0" onclick="setTypeFilter('MOVIES')">Movies</div>
      <div class="seg-tab" id="typeTab_SERIES" role="button" tabindex="0" onclick="setTypeFilter('SERIES')">Series</div>
    </div>

    <div class="select-filters">
      <div class="morph-select-wrap">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>
        <select id="deviceSelect" onchange="setHostFilter(this.value)" aria-label="Device">
          <option value="ALL">All Devices</option>
        </select>
      </div>

      <div class="morph-select-wrap">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/></svg>
        <select id="sizeSelect" onchange="setSizeFilter(this.value)" aria-label="Size">
          <option value="ALL">Any Size</option>
          <option value="SMALL">&lt; 1 GB</option>
          <option value="MEDIUM">1 – 3 GB</option>
          <option value="LARGE">&gt; 3 GB</option>
        </select>
      </div>
    </div>
  </div>

  <!-- Main File Explorer Scroll Area -->
  <main class="explorer-scroll" id="explorerScroll"></main>

  <footer>
    <div class="storage-meter">
      <div class="storage-track"><div class="storage-fill" id="storageFillBar"></div></div>
      <span class="mono" id="footerTelemetry">0 · 0 B</span>
    </div>
    <span>© 2026 Sanchar Koirala</span>
  </footer>

  <!-- Cinema Player -->
  <div class="player-screen" id="playerScreen">
    <!-- Decluttered Player Top Bar -->
    <div class="player-header">
      <div class="player-title-wrap">
        <div class="player-name" id="playerName">Video</div>
        <div class="quality-badge mono" id="qualityBadge">HD</div>
        <div class="party-badge-pill mono" id="playerPartyPill" role="button" tabindex="0" onclick="openWatchPartyModal()">

<script>
