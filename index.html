  <style>
    :root[data-theme="dark"] {
      --bg: #000000;
      --surface: #151518;
      --surface-2: #202025;
      --surface-hover: #29292f;
      --stroke: rgba(255, 255, 255, 0.085);
      --text: #fafafa;
      --text-2: #9a9aa4;
      --blue: #3e8bff;
      --blue-soft: rgba(62, 139, 255, 0.16);
      --green: #22c55e;
      --shadow: 0 8px 24px rgba(0, 0, 0, 0.45);
    }

    :root[data-theme="light"] {
      --bg: #f4f4f6;
      --surface: #ffffff;
      --surface-2: #ececf0;
      --surface-hover: #e4e4e9;
      --stroke: rgba(0, 0, 0, 0.07);
      --text: #111114;
      --text-2: #666670;
      --blue: #0381fe;
      --blue-soft: rgba(3, 129, 254, 0.12);
      --green: #16a34a;
      --shadow: 0 6px 20px rgba(0, 0, 0, 0.05);
    }

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100dvh;
      height: var(--app-height, 100dvh);
      max-height: 100dvh;
      background: var(--bg);
      color: var(--text);
      font-family: "One UI Sans", "SamsungOne", "Inter", system-ui, -apple-system, sans-serif;
      font-size: 14px;
      overflow: hidden;
      overscroll-behavior: none;
      touch-action: manipulation;
    }

    body {
      display: flex;
      flex-direction: column;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px);
      padding-left: env(safe-area-inset-left, 0px);
      padding-right: env(safe-area-inset-right, 0px);
      transition: background 0.2s ease, color 0.2s ease;
    }

    .ui-btn {
      background: var(--surface);
      border: 1px solid var(--stroke);
      border-radius: 999px;
      color: var(--text);
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: transform 0.14s ease, background 0.14s ease, color 0.14s ease;
    }
    .ui-btn:hover:not(.disabled) { background: var(--surface-hover); }
    .ui-btn:active:not(.disabled) { transform: scale(0.96); }
    .ui-btn.disabled { opacity: 0.32; pointer-events: none; }

    .app-bar {
      padding: 12px 18px 8px;
      display: flex;
      align-items: center;
      gap: 9px;
      flex-shrink: 0;
    }

    .icon-btn { width: 38px; height: 38px; flex-shrink: 0; }
    .pill-btn { height: 38px; padding: 0 15px; flex-shrink: 0; }

    .server-pill {
      height: 38px;
      padding: 0 14px;
      border-radius: 999px;
      background: var(--surface);
      border: 1px solid var(--stroke);
      color: var(--text);
      font-size: 12.5px;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      cursor: pointer;
      flex-shrink: 0;
      max-width: 210px;
      transition: 0.14s ease;
    }
    .server-pill:hover { background: var(--surface-hover); border-color: var(--blue); }
    .server-pill-name {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .live-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 8px var(--green);
      flex-shrink: 0;
    }
    .live-dot.offline {
      background: #ef4444;
      box-shadow: none;
    }

    .crumb-strip {
      flex: 1;
      height: 38px;
      background: var(--surface);
      border: 1px solid var(--stroke);
      border-radius: 999px;
      padding: 0 14px;
      display: flex;
      align-items: center;
      gap: 4px;
      overflow-x: auto;
      white-space: nowrap;
      min-width: 90px;
    }
    .crumb-strip::-webkit-scrollbar { display: none; }

    .crumb-item {
      padding: 5px 10px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-2);
      cursor: pointer;
      transition: 0.14s;
    }
    .crumb-item:hover, .crumb-item.current {
      color: var(--text);
      background: var(--surface-2);
    }
    .crumb-arrow { color: var(--text-2); opacity: 0.45; font-size: 12px; }

    .search-field {
      width: 210px;
      height: 38px;
      background: var(--surface);
      border: 1px solid var(--stroke);
      border-radius: 999px;
      padding: 0 14px;
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }
    .search-field:focus-within { border-color: var(--blue); }
    .search-field input {
      background: transparent;
      border: none;
      outline: none;
      color: var(--text);
      font-size: 13.5px;
      width: 100%;
      font-family: inherit;
    }
    .search-field input::placeholder { color: var(--text-2); }

    .workspace {
      flex: 1;
      min-height: 0;
      display: flex;
      gap: 16px;
      padding: 6px 18px 10px;
      overflow: hidden;
      position: relative;
    }

    .side-rail {
      width: 260px;
      background: var(--surface);
      border: 1px solid var(--stroke);
      border-radius: 26px;
      padding: 14px 10px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      overflow-y: auto;
      flex-shrink: 0;
    }
    .side-rail::-webkit-scrollbar { width: 4px; }
    .side-rail::-webkit-scrollbar-thumb { background: var(--stroke); border-radius: 99px; }

    .rail-header {
      font-size: 11.5px;
      font-weight: 700;
      color: var(--text-2);
      padding: 8px 14px 4px;
      letter-spacing: 0.4px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .rail-row {
      padding: 10px 14px;
      border-radius: 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      cursor: pointer;
      font-weight: 600;
      font-size: 13px;
      color: var(--text);
      transition: 0.14s ease;
    }
    .rail-row:hover { background: var(--surface-2); }
    .rail-row.active { background: var(--blue-soft); color: var(--blue); }
    .rail-left {
      display: flex;
      align-items: center;
      gap: 10px;
      overflow: hidden;
      min-width: 0;
    }
    .rail-left span {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .rail-meta { font-size: 11px; color: var(--text-2); flex-shrink: 0; }

    .content-area {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding-right: 4px;
    }
    .content-area::-webkit-scrollbar { width: 5px; }
    .content-area::-webkit-scrollbar-thumb { background: var(--stroke); border-radius: 99px; }

    .view-hero {
      padding: 8px 6px 16px;
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }
    .hero-title {
      margin: 0;
      font-size: 25px;
      font-weight: 700;
      letter-spacing: -0.5px;
      line-height: 1.2;
    }
    .hero-sub {
      margin-top: 4px;
      font-size: 13px;
      color: var(--text-2);
      font-weight: 500;
    }

    .group-label {
      font-size: 12.5px;
      font-weight: 700;
      color: var(--text-2);
      padding: 4px 6px 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .oneui-group {
      background: var(--surface);
      border: 1px solid var(--stroke);
      border-radius: 26px;
      overflow: hidden;
      margin-bottom: 18px;
      box-shadow: var(--shadow);
    }

    .oneui-row {
      padding: 13px 16px;
      display: flex;
      align-items: center;
      gap: 14px;
      cursor: pointer;
      position: relative;
      transition: background 0.14s ease, transform 0.12s ease;
    }
    .oneui-row:not(:last-child)::after {
      content: "";
      position: absolute;
      left: 70px;
      right: 16px;
      bottom: 0;
      height: 1px;
      background: var(--stroke);
    }
    .oneui-row:hover { background: var(--surface-hover); }
    .oneui-row:active { transform: scale(0.992); }

    .sam-folder {
      width: 42px;
      height: 42px;
      border-radius: 14px;
      background: rgba(255, 184, 0, 0.14);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .sam-video {
      width: 42px;
      height: 42px;
      border-radius: 14px;
      background: var(--blue-soft);
      color: var(--blue);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .row-body { flex: 1; min-width: 0; }
    .row-title {
      font-weight: 600;
      font-size: 14.5px;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .row-details {
      margin-top: 4px;
      font-size: 12px;
      color: var(--text-2);
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .dot-sep { opacity: 0.45; }
    .resume-tag { color: var(--blue); font-weight: 700; }

    .row-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .chip-action {
      height: 32px;
      padding: 0 13px;
      border-radius: 999px;
      background: var(--surface-2);
      color: var(--text);
      font-size: 12px;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      cursor: pointer;
      transition: 0.14s;
    }
    .chip-action:hover { background: var(--blue); color: #fff; }

    .uniform-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
      gap: 12px;
      margin-bottom: 20px;
    }

    .grid-tile {
      background: var(--surface);
      border: 1px solid var(--stroke);
      border-radius: 24px;
      padding: 15px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      height: 140px;
      box-shadow: var(--shadow);
      transition: transform 0.15s ease, background 0.15s ease;
    }
    .grid-tile:hover { background: var(--surface-hover); transform: translateY(-2px); }
    .grid-tile:active { transform: scale(0.985); }
    .tile-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .tile-badge {
      padding: 4px 10px;
      border-radius: 999px;
      background: var(--surface-2);
      color: var(--text-2);
      font-size: 11px;
      font-weight: 700;
    }
    .tile-name {
      font-weight: 600;
      font-size: 13.5px;
      line-height: 1.35;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      word-break: break-word;
    }
    .tile-sub {
      font-size: 11.5px;
      color: var(--text-2);
      display: flex;
      justify-content: space-between;
    }

    .state-box {
      max-width: 400px;
      margin: 60px auto;
      background: var(--surface);
      border: 1px solid var(--stroke);
      border-radius: 28px;
      padding: 32px 24px;
      text-align: center;
      box-shadow: var(--shadow);
    }
    .state-box h2 { margin: 0 0 8px; font-size: 18px; font-weight: 700; }
    .state-box p { margin: 0 0 20px; color: var(--text-2); font-size: 13.5px; line-height: 1.45; }

    footer {
      padding: 7px 18px 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 12px;
      color: var(--text-2);
      flex-shrink: 0;
    }

    /* ============================================================
       CINEMA PLAYER — ZERO-OVERFLOW PORTRAIT & LANDSCAPE ARCHITECTURE
       ============================================================ */
    .player-screen {
      display: none;
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100dvh;
      height: var(--app-height, 100dvh);
      max-height: 100dvh;
      background: #050507;
      z-index: 100;
      flex-direction: column;
      overflow: hidden;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px);
      padding-left: env(safe-area-inset-left, 0px);
      padding-right: env(safe-area-inset-right, 0px);
    }
    .player-screen.open { display: flex; }

    .player-header {
      padding: 10px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      background: rgba(18, 18, 22, 0.94);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      flex-shrink: 0;
      min-height: 52px;
    }

    .player-title-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
      flex: 1;
    }

    .player-name {
      font-weight: 700;
      font-size: 14.5px;
      color: #ffffff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      min-width: 0;
    }

    .quality-badge {
      padding: 4px 10px;
      border-radius: 999px;
      background: rgba(62, 139, 255, 0.16);
      border: 1px solid rgba(62, 139, 255, 0.35);
      color: #7ab2ff;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.2px;
      white-space: nowrap;
      flex-shrink: 0;
      pointer-events: none;
    }

    .player-pills {
      display: flex;
      align-items: center;
      gap: 7px;
      flex-shrink: 0;
    }

    .p-pill {
      height: 34px;
      padding: 0 13px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.09);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #ffffff;
      font-size: 12px;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      cursor: pointer;
      white-space: nowrap;
      transition: transform 0.12s ease, background 0.15s ease, border-color 0.15s ease;
    }
    .p-pill:hover:not(.disabled) {
      background: rgba(255, 255, 255, 0.18);
      border-color: rgba(255, 255, 255, 0.22);
    }
    .p-pill:active:not(.disabled) { transform: scale(0.95); }
    .p-pill.disabled { opacity: 0.34; pointer-events: none; }
    .p-pill.blue {
      background: #0381fe;
      border-color: rgba(62, 139, 255, 0.6);
    }
    .p-pill.danger-pill {
      background: rgba(255, 75, 75, 0.16);
      border-color: rgba(255, 75, 75, 0.3);
      color: #ff8080;
    }
    .p-pill.danger-pill:hover {
      background: rgba(255, 75, 75, 0.28);
      color: #ffffff;
    }

    .player-workspace {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: row;
      overflow: hidden;
      width: 100%;
    }

    .player-main {
      flex: 1;
      min-width: 0;
      min-height: 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: #000000;
    }

    .video-stage {
      flex: 1;
      min-height: 0;
      width: 100%;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000000;
      overflow: hidden;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      outline: none;
      pointer-events: none;
      display: block;
    }

    .loader-box {
      position: absolute;
      inset: 0;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      background: rgba(0, 0, 0, 0.35);
      pointer-events: none;
      z-index: 15;
    }
    .loader-box.show { display: flex; }
    .loader-circle {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      border: 3px solid rgba(255, 255, 255, 0.16);
      border-top-color: #3e8bff;
      animation: spin 0.72s linear infinite;
    }
    .loader-label {
      padding: 6px 14px;
      border-radius: 999px;
      background: rgba(15, 15, 18, 0.88);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #e4e4e7;
      font-size: 12px;
      font-weight: 600;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .player-controls {
      padding: 10px 16px 12px;
      background: rgba(16, 16, 20, 0.96);
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      flex-direction: column;
      gap: 9px;
      flex-shrink: 0;
    }

    .seek-area {
      height: 20px;
      display: flex;
      align-items: center;
      cursor: pointer;
      touch-action: none;
    }
    .seek-bar {
      width: 100%;
      height: 5px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.16);
      position: relative;
      transition: height 0.12s ease;
    }
    .seek-area:hover .seek-bar,
    .seek-area:active .seek-bar { height: 7px; }
    .seek-progress {
      height: 100%;
      width: 0%;
      border-radius: 999px;
      background: linear-gradient(90deg, #2563eb, #3e8bff);
      position: relative;
    }
    .seek-knob {
      position: absolute;
      right: -7px;
      top: 50%;
      transform: translateY(-50%);
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #ffffff;
      box-shadow: 0 0 10px rgba(62, 139, 255, 0.85);
    }

    .ctrl-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      min-width: 0;
    }
    .ctrl-group {
      display: flex;
      align-items: center;
      gap: 7px;
      min-width: 0;
    }
    .clock-text {
      font-family: ui-monospace, Consolas, monospace;
      font-size: 12px;
      color: #d4d4d8;
      padding: 0 4px;
      white-space: nowrap;
    }

    .vol-box {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid rgba(255, 255, 255, 0.09);
      border-radius: 999px;
      height: 34px;
      padding: 0 11px 0 8px;
    }
    .vol-mute {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      cursor: pointer;
    }
    .vol-range {
      width: 72px;
      accent-color: #3e8bff;
      cursor: pointer;
      margin: 0;
    }

    .episode-pane {
      width: 300px;
      flex-shrink: 0;
      background: #101014;
      border-left: 1px solid rgba(255, 255, 255, 0.08);
      display: none;
      flex-direction: column;
      min-height: 0;

<body>

<script>
  const firebaseConfig = {

  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();

  const FOLDER_ICON = `<svg width="22" height="22" viewBox="0 0 24 24" fill="#FFB800"><path d="M10.41 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2h-8l-1.59-2z"/></svg>`;

  /* ============================================================
     MOBILE AUTO-ROTATION & VIEWPORT SYNC
     ============================================================ */
  function syncViewportLayout() {
    document.documentElement.style.setProperty('--app-height', `${window.innerHeight}px`);
    if (window.scrollY !== 0 || window.scrollX !== 0) {
      window.scrollTo(0, 0);
    }
  }

  function unlockMobileOrientation() {
    try {
      if (screen.orientation && typeof screen.orientation.unlock === 'function') {
        screen.orientation.unlock();
      }
    } catch (e) {}
  }

  let lastAccelAngle = '';
  function handleAccelerometerMotion(e) {
    const acc = e.accelerationIncludingGravity;
    if (!acc || acc.x === null || acc.y === null) return;
    const ax = Math.abs(acc.x);
    const ay = Math.abs(acc.y);
    if (ax < 5.5 && ay < 5.5) return;
    const inferred = ax > ay ? 'landscape' : 'portrait';
    if (inferred !== lastAccelAngle) {
      lastAccelAngle = inferred;
      syncViewportLayout();
    }
  }

  unlockMobileOrientation();
  syncViewportLayout();
  window.addEventListener('resize', syncViewportLayout, { passive: true });
  window.addEventListener('orientationchange', () => {
    setTimeout(syncViewportLayout, 60);
    setTimeout(syncViewportLayout, 250);
  }, { passive: true });
  if (screen.orientation && screen.orientation.addEventListener) {
    screen.orientation.addEventListener('change', syncViewportLayout);
  }
  window.addEventListener('devicemotion', handleAccelerometerMotion, { passive: true });

  /* ============================================================
     THEME & KEYBOARD ACCESSIBILITY
     ============================================================ */
  function applyTheme(theme) {
    document.documentElement.setAttribute('data-theme', theme);
    localStorage.setItem('oneui_files_theme', theme);
    document.getElementById('btnTheme').textContent = theme === 'dark' ? '☀' : '☾';
    document.getElementById('metaThemeColor').setAttribute('content', theme === 'dark' ? '#000000' : '#f4f4f6');
  }

  function toggleTheme() {
    const cur = document.documentElement.getAttribute('data-theme') || 'dark';
    applyTheme(cur === 'dark' ? 'light' : 'dark');
  }

  applyTheme(localStorage.getItem('oneui_files_theme') || 'dark');

  document.addEventListener('keydown', (e) => {
    if (e.target && e.target.getAttribute('role') === 'button' && (e.key === 'Enter' || e.key === ' ')) {
      e.preventDefault();
      e.target.click();
    }
  });

  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(t._timer);
    t._timer = setTimeout(() => t.classList.remove('show'), 2400);
  }

  function setLoader(show, text = 'Preparing stream...') {
    const box = document.getElementById('loaderBox');
    document.getElementById('loaderLabel').textContent = text;
    box.classList.toggle('show', show);
  }

  function renderState(title, msg) {
    document.getElementById('contentArea').innerHTML = `
      <div class="state-box">
        <h2>${escapeHtml(title)}</h2>
        <p>${escapeHtml(msg)}</p>
        <div class="ui-btn pill-btn" role="button" tabindex="0" onclick="refreshCurrent()">Retry</div>
      </div>
    `;
    document.getElementById('footerStats').textContent = 'Offline';
  }

  async function apiFetch(endpoint) {
    if (!API_BASE) throw new Error('Offline');
    const res = await fetch(`${API_BASE}${endpoint}`);
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);
    return data;
  }

  /* ============================================================
     FEDERATED MULTI-SERVER DIRECTORY (FIREBASE RTDB)
     ============================================================ */
  db.ref('.info/serverTimeOffset').on('value', (snap) => {
    serverTimeOffsetMs = snap.val() || 0;
  });

  let latestServersObj = {};
  let latestLegacyObj = null;

  function reconcileServers() {
    const nowSec = Math.floor((Date.now() + serverTimeOffsetMs) / 1000);
    const list = [];

    if (latestServersObj && typeof latestServersObj === 'object') {
      Object.entries(latestServersObj).forEach(([key, srv]) => {
        if (!srv || !srv.url) return;
        const cleanUrl = String(srv.url).trim().replace(/\/+$/, '');
        if (!cleanUrl) return;
        const lastSeen = Number(srv.lastSeen || 0);
        if (lastSeen > 0 && (nowSec - lastSeen) > 85) return;
        list.push({
          id: srv.id || key,
          name: srv.name || key,
          url: cleanUrl,
          videoCount: Number(srv.videoCount || 0),
          totalSizeLabel: srv.totalSizeLabel || '',
          encoder: srv.encoder || '',
          updatedAt: srv.updatedAt || ''
        });
      });
    }

    if (list.length === 0 && latestLegacyObj && latestLegacyObj.url) {
      const cleanLegacy = String(latestLegacyObj.url).trim().replace(/\/+$/, '');
      if (cleanLegacy) {
        list.push({
          id: 'default-host',
          name: 'Primary Host',
          url: cleanLegacy,
          videoCount: 0,
          totalSizeLabel: '',
          encoder: '',
          updatedAt: latestLegacyObj.updatedAt || ''
        });
      }
    }

    list.sort((a, b) => a.name.localeCompare(b.name, undefined, { numeric: true }));
    onlineServers = list;
    renderServersRailAndPill();

    if (onlineServers.length === 0) {
      selectedServerId = '';
      API_BASE = '';
      renderRailFolders([]);
      renderState('No Active Servers Online', 'Run MyFilesServer.exe on any PC to share movies and appear live here.');
      return;
    }

    const currentMatch = onlineServers.find(s => s.id === selectedServerId);
    if (!currentMatch) {
      const nextSrv = onlineServers[0];
      switchToServer(nextSrv.id, false);
    } else if (API_BASE !== currentMatch.url) {
      API_BASE = currentMatch.url;
      loadFolder(currentPath, false);
    }
  }

  db.ref('servers').on('value', (snap) => {
    latestServersObj = snap.val() || {};
    reconcileServers();
  });

  db.ref('server-js').on('value', (snap) => {
    latestLegacyObj = snap.val();
    reconcileServers();
  });

  setInterval(reconcileServers, 15000);

    const pillName = document.getElementById('serverPillName');

      pillDot.classList.add('offline');

      pillDot.classList.remove('offline');

  function switchToServer(srvId, notify = true) {
    const target = onlineServers.find(s => s.id === srvId);
    if (!target) return;

    if (document.getElementById('playerScreen').classList.contains('open')) {
      closePlayer();
    }

    selectedServerId = target.id;
    API_BASE = target.url;
    historyStack = [''];
    historyIndex = 0;
    document.getElementById('sideRail').classList.remove('open');

      showToast(`Connected to ${target.name}`);

  /* ============================================================
     DIRECTORY BROWSING & EXPLORER
     ============================================================ */
  async function loadFolder(path, pushHistory = true) {
    currentPath = path;
    document.getElementById('searchInput').value = '';

    if (pushHistory) {
      historyStack = historyStack.slice(0, historyIndex + 1);
      if (historyStack[historyStack.length - 1] !== path) {
        historyStack.push(path);
        historyIndex = historyStack.length - 1;
      }
    }

    updateNavState();
    renderBreadcrumbs();

    if (!API_BASE) return;

    try {
      const data = await apiFetch(`/api/list?path=${encodeURIComponent(path)}`);
      currentItems = data.items || [];

      if (path === '') {
        renderRailFolders(currentItems.filter(i => i.type === 'folder'));
      }

      document.getElementById('railRoot').classList.toggle('active', path === '');
      document.querySelectorAll('.rail-folder').forEach(el => {
        el.classList.toggle('active', el.dataset.path === path);
      });

      renderContent();
    } catch (e) {
      renderState('Host Unreachable', 'This server stopped responding or closed its tunnel.');
    }
  }

  function renderRailFolders(folders) {
    const box = document.getElementById('railFolders');
    if (!folders.length) {
      box.innerHTML = `<div style="padding:6px 14px; font-size:12px; color:var(--text-2);">No subfolders</div>`;
      return;
    }
    box.innerHTML = folders.map(f => `
      <div class="rail-row rail-folder" data-path="${escapeHtml(f.path)}" role="button" tabindex="0" onclick="navigateTo('${escapeJs(f.path)}')">

          <svg width="17" height="17" viewBox="0 0 24 24" fill="#FFB800"><path d="M10.41 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2h-8l-1.59-2z"/></svg>
          <span title="${escapeHtml(f.name)}">${escapeHtml(f.name)}</span>
        </div>
        <span class="rail-meta">${escapeHtml(f.sizeLabel)}</span>

  function renderBreadcrumbs() {
    const strip = document.getElementById('crumbStrip');
    const activeSrv = onlineServers.find(s => s.id === selectedServerId);
    const rootLabel = activeSrv ? activeSrv.name : 'Root';
    const parts = currentPath ? currentPath.split('/') : [];
    let html = `<div class="crumb-item ${parts.length === 0 ? 'current' : ''}" role="button" tabindex="0" onclick="navigateTo('')">${escapeHtml(rootLabel)}</div>`;
    let acc = '';
    parts.forEach((p, idx) => {
      acc += (idx === 0 ? '' : '/') + p;
      const target = acc;
      const isLast = idx === parts.length - 1;
      html += `<span class="crumb-arrow">›</span><div class="crumb-item ${isLast ? 'current' : ''}" role="button" tabindex="0" onclick="navigateTo('${escapeJs(target)}')">${escapeHtml(p)}</div>`;
    });
    strip.innerHTML = html;
    strip.scrollLeft = strip.scrollWidth;
  }

  function sortList(items) {
    return [...items].sort((a, b) => {
      let cmp = 0;
      if (sortBy === 'name') cmp = a.name.localeCompare(b.name, undefined, { numeric: true });
      else if (sortBy === 'size') cmp = a.size - b.size;
      else if (sortBy === 'mtime') cmp = a.mtime - b.mtime;
      return sortAsc ? cmp : -cmp;
    });
  }

  function cleanTitle(filename) {
    return filename.replace(/\.[^/.]+$/, '').replace(/\./g, ' ');
  }

  function progressKey(path) {
    return `oneui_prog_${selectedServerId || 'host'}_${path}`;
  }

  function getSavedProgress(path) {
    try {
      return JSON.parse(localStorage.getItem(progressKey(path)) || 'null');
    } catch (e) {
      return null;
    }
  }

  function renderContent() {

    const heading = parts.length ? parts[parts.length - 1] : (activeSrv ? activeSrv.name : 'Media Library');
    const totalBytes = [...folders, ...files].reduce((acc, x) => acc + (x.size || 0), 0);

    document.getElementById('footerStats').textContent = `${total} ${total === 1 ? 'item' : 'items'}`;

    if (total === 0) {

    let html = `

    `;

    if (folders.length > 0) {

            <div class="grid-tile" role="button" tabindex="0" onclick="navigateTo('${escapeJs(f.path)}')">

          const prog = getSavedProgress(m.path);

          html += `

              </div>

      } else {

  /* ============================================================
     FOLDER SERIES DETECTION & SIDE/BOTTOM PLAYLIST
     ============================================================ */
  function isFolderSeries() {
    return currentPath.trim() !== '' && Array.isArray(window._renderedFiles) && window._renderedFiles.length > 1;
  }

  function updateEpisodeNavigationUI() {
    const showSeriesUI = isFolderSeries();
    const prevBtn = document.getElementById('prevEpBtn');
    const nextBtn = document.getElementById('nextEpBtn');
    const epPane = document.getElementById('episodePane');
    const workspace = document.getElementById('playerWorkspace');

    if (!showSeriesUI) {
      prevBtn.style.display = 'none';
      nextBtn.style.display = 'none';
      epPane.classList.remove('show');
      workspace.classList.add('no-episodes');
      return;
    }

    const files = window._renderedFiles;
    prevBtn.style.display = 'inline-flex';
    nextBtn.style.display = 'inline-flex';
    prevBtn.classList.toggle('disabled', activeIndex <= 0);
    nextBtn.classList.toggle('disabled', activeIndex >= files.length - 1);

    epPane.classList.add('show');
    workspace.classList.remove('no-episodes');

    const parts = currentPath.split('/');
    document.getElementById('epPaneTitle').textContent = parts[parts.length - 1] || 'Folder Videos';
    document.getElementById('epPaneCount').textContent = `${activeIndex + 1} / ${files.length}`;

    const listEl = document.getElementById('epList');
    listEl.innerHTML = files.map((f, i) => {
      const isCur = i === activeIndex;
      const prog = getSavedProgress(f.path);
      const statusHtml = isCur
        ? `<span class="ep-playing-tag">Playing</span>`
        : (prog && prog.pos > 15 ? `<span>Resume ${formatClock(prog.pos)}</span>` : `<span>${escapeHtml(f.ext)}</span>`);
      return `
        <div class="ep-card ${isCur ? 'active' : ''}" id="epCard_${i}" role="button" tabindex="0" onclick="selectEpisode(${i})">
          <div class="ep-num">${String(i + 1).padStart(2, '0')}</div>
          <div class="ep-info">
            <div class="ep-name" title="${escapeHtml(f.name)}">${escapeHtml(cleanTitle(f.name))}</div>
            <div class="ep-meta">
              ${statusHtml}
              <span>•</span>
              <span>${escapeHtml(f.sizeLabel)}</span>
            </div>
          </div>
        </div>
      `;
    }).join('');

    requestAnimationFrame(() => {
      const activeCard = document.getElementById(`epCard_${activeIndex}`);
      if (activeCard) {
        activeCard.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
      }
    });
  }

  function selectEpisode(idx) {
    if (idx === activeIndex) return;
    openMedia(idx, false);
  }

  function playPrevEpisode() {
    if (!isFolderSeries() || activeIndex <= 0) return;
    openMedia(activeIndex - 1, false);
  }

  function playNextEpisode() {
    if (!isFolderSeries() || activeIndex >= window._renderedFiles.length - 1) return;
    openMedia(activeIndex + 1, false);
  }

  /* ============================================================
     CINEMA PLAYER CORE
     ============================================================ */
  function updateQualityBadge(label) {
    document.getElementById('qualityBadge').textContent = `${label || 'HD'} · Auto`;
  }

  async function openMedia(idx, forceStartZero = false) {
    const item = window._renderedFiles[idx];
    if (!item || !API_BASE) return;

    unlockMobileOrientation();
    syncViewportLayout();

    activeIndex = idx;
    activeMedia = item;
    activeAudioTrack = 0;

    const saved = !forceStartZero ? getSavedProgress(item.path) : null;
    const initialStart = saved && saved.pos > 15 && (!saved.dur || saved.pos < saved.dur - 30) ? Math.floor(saved.pos) : 0;
    streamOffsetSec = initialStart;

    const screen = document.getElementById('playerScreen');
    const audioBtn = document.getElementById('audioBtn');

    document.getElementById('playerName').textContent = cleanTitle(item.name);
    document.getElementById('seekProgress').style.width = '0%';
    document.getElementById('clockText').textContent = '00:00 / --:--';
    updateQualityBadge('HD');
    audioBtn.style.display = 'none';

    updateEpisodeNavigationUI();
    setLoader(true, 'Analyzing stream...');
    screen.classList.add('open');

    try {
      activeProbe = await apiFetch(`/api/probe?path=${encodeURIComponent(item.path)}`);
    } catch (e) {
      activeProbe = { duration: 0, resolutionLabel: 'HD', audioTracks: [] };
    }

    updateQualityBadge(activeProbe.resolutionLabel || 'HD');

    if (activeProbe.audioTracks && activeProbe.audioTracks.length > 0) {
      audioBtn.style.display = 'inline-flex';
      document.getElementById('audioBtnLabel').textContent = `Audio: ${activeProbe.audioTracks[0].shortLabel}`;
    }

    if (initialStart > 0) {
      showToast(`Resuming at ${formatClock(initialStart)}`);
    }

    await startHlsSession(initialStart);
  }

  async function startHlsSession(startSec) {
    if (!activeMedia || !API_BASE) return;
    setLoader(true, 'Buffering stream...');

    const video = document.getElementById('videoEl');
    if (hlsInstance) {
      hlsInstance.destroy();
      hlsInstance = null;
    }
    video.pause();

    try {
      const qs = new URLSearchParams({
        path: activeMedia.path,
        start: String(Math.max(0, Math.floor(startSec))),
        atrack: String(activeAudioTrack),
        prev: activeSessionId || ''
      });

      const sess = await apiFetch(`/api/session?${qs.toString()}`);
      activeSessionId = sess.sessionId;
      streamOffsetSec = Math.max(0, Math.floor(startSec));
      if (sess.duration && !activeProbe.duration) {
        activeProbe.duration = sess.duration;
      }
      if (sess.resolutionLabel) {
        updateQualityBadge(sess.resolutionLabel);
      }

      const fullPlaylistUrl = `${API_BASE}${sess.playlistUrl}`;

      if (window.Hls && Hls.isSupported()) {
        hlsInstance = new Hls({
          enableWorker: true,
          maxBufferLength: 30,
          maxMaxBufferLength: 60,
          manifestLoadingMaxRetry: 6,
          levelLoadingMaxRetry: 6,
          fragLoadingMaxRetry: 8
        });
        hlsInstance.loadSource(fullPlaylistUrl);
        hlsInstance.attachMedia(video);
        hlsInstance.on(Hls.Events.MANIFEST_PARSED, () => {
          video.playbackRate = activeSpeed;
          video.play().catch(() => {});
        });
        hlsInstance.on(Hls.Events.ERROR, (_, data) => {
          if (data.fatal) {
            if (data.type === Hls.ErrorTypes.NETWORK_ERROR) {
              hlsInstance.startLoad();
            } else if (data.type === Hls.ErrorTypes.MEDIA_ERROR) {
              hlsInstance.recoverMediaError();
            } else {
              setLoader(false);
              showToast('Stream interrupted');
            }
          }
        });
      } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
        video.src = fullPlaylistUrl;
        video.load();
        video.playbackRate = activeSpeed;
        video.play().catch(() => {});
      }
    } catch (e) {
      setLoader(false);
      showToast(`Stream error: ${e.message}`);
    }
  }

  /* ============================================================
     POPUP MODALS (AUDIO TRACK / LANGUAGE & PLAYBACK SPEED)
     ============================================================ */
  function openAudioPopup() {
    const tracks = activeProbe.audioTracks || [];
    if (tracks.length === 0) return;

    document.getElementById('modalTitle').textContent = 'Audio Track & Language';
    const list = document.getElementById('modalList');
    list.innerHTML = tracks.map(tr => `
      <div class="modal-option ${tr.index === activeAudioTrack ? 'selected' : ''}" role="button" tabindex="0" onclick="selectAudioTrack(${tr.index})">
        <div class="opt-main">
          <div class="opt-title">${escapeHtml(tr.title)}</div>
          <div class="opt-sub">${escapeHtml(tr.meta)}</div>
        </div>

      </div>
    `).join('');
    document.getElementById('modalBackdrop').classList.add('open');
  }

  function selectAudioTrack(trackIdx) {
    closeModal();
    if (trackIdx === activeAudioTrack) return;
    const tracks = activeProbe.audioTracks || [];
    const chosen = tracks.find(t => t.index === trackIdx);
    if (!chosen) return;

    activeAudioTrack = trackIdx;
    document.getElementById('audioBtnLabel').textContent = `Audio: ${chosen.shortLabel}`;
    showToast(`Audio: ${chosen.title}`);

    const cur = streamOffsetSec + (document.getElementById('videoEl').currentTime || 0);
    startHlsSession(cur);
  }

  function openSpeedPopup() {
    document.getElementById('modalTitle').textContent = 'Playback Speed';
    const list = document.getElementById('modalList');
    list.innerHTML = SPEED_OPTIONS.map(opt => `
      <div class="modal-option ${opt.value === activeSpeed ? 'selected' : ''}" role="button" tabindex="0" onclick="selectPlaybackSpeed(${opt.value})">
        <div class="opt-main">
          <div class="opt-title">${escapeHtml(opt.label)}</div>
          <div class="opt-sub">${escapeHtml(opt.sub)}</div>
        </div>
        <div class="opt-check">✓</div>
      </div>
    `).join('');
    document.getElementById('modalBackdrop').classList.add('open');
  }

  function selectPlaybackSpeed(val) {
    closeModal();
    activeSpeed = val;
    const video = document.getElementById('videoEl');
    video.playbackRate = val;
    document.getElementById('speedBtn').textContent = `${val}x`;
    showToast(`Speed ${val}x`);
  }

  function closeModal() {
    document.getElementById('modalBackdrop').classList.remove('open');
  }

  /* ============================================================
     PLAYBACK CONTROLS & TIMELINE
     ============================================================ */
  const videoEl = document.getElementById('videoEl');

  videoEl.addEventListener('loadedmetadata', () => {
    if (videoEl.videoHeight > 0) {
      const h = videoEl.videoHeight;
      const label = h >= 2160 ? '2160p 4K' : (h >= 1440 ? '1440p QHD' : (h >= 1080 ? '1080p FHD' : (h >= 720 ? '720p HD' : (h >= 480 ? '480p SD' : `${h}p`))));
      updateQualityBadge(label);
    }
  });

  videoEl.addEventListener('playing', () => {
    setLoader(false);
    document.getElementById('playBtn').textContent = 'Pause';
  });

  videoEl.addEventListener('pause', () => {
    document.getElementById('playBtn').textContent = 'Play';
  });

  videoEl.addEventListener('waiting', () => {
    setLoader(true, 'Buffering...');
  });

  videoEl.addEventListener('ended', () => {
    if (isFolderSeries() && activeIndex < window._renderedFiles.length - 1) {
      showToast('Playing next episode...');
      playNextEpisode();
    }
  });

  videoEl.addEventListener('timeupdate', () => {
    const total = activeProbe.duration || (isFinite(videoEl.duration) ? streamOffsetSec + videoEl.duration : 0);
    const current = streamOffsetSec + (videoEl.currentTime || 0);
    document.getElementById('clockText').textContent = `${formatClock(current)} / ${total > 0 ? formatClock(total) : '--:--'}`;

    if (total > 0) {
      const pct = Math.min(100, Math.max(0, (current / total) * 100));
      document.getElementById('seekProgress').style.width = `${pct}%`;
    }

    if (activeMedia && Math.abs(current - lastSavedTick) >= 5) {
      lastSavedTick = current;
      localStorage.setItem(progressKey(activeMedia.path), JSON.stringify({ pos: current, dur: total }));
    }
  });

  function jumpToPosition(targetSec) {
    const relTarget = targetSec - streamOffsetSec;
    if (relTarget >= 0 && videoEl.seekable && videoEl.seekable.length > 0) {
      const bufEnd = videoEl.seekable.end(videoEl.seekable.length - 1);
      if (relTarget <= bufEnd) {
        videoEl.currentTime = relTarget;
        return;
      }
    }
    startHlsSession(targetSec);
  }

  function seekFromBar(e) {
    const total = activeProbe.duration || (isFinite(videoEl.duration) ? streamOffsetSec + videoEl.duration : 0);
    if (!total || total <= 0) return;
    const rect = document.getElementById('seekArea').getBoundingClientRect();
    const ratio = Math.min(1, Math.max(0, (e.clientX - rect.left) / rect.width));
    jumpToPosition(ratio * total);
  }

  function skipBy(delta) {
    const total = activeProbe.duration || 0;
    const current = streamOffsetSec + (videoEl.currentTime || 0);
    const target = Math.max(0, total > 0 ? Math.min(total - 2, current + delta) : current + delta);
    jumpToPosition(target);
  }

  function togglePlayPause() {
    if (videoEl.paused) videoEl.play().catch(() => {});
    else videoEl.pause();
  }

  let savedVol = 1;
  function setVolume(val) {
    const num = Number(val);
    videoEl.volume = num;
    videoEl.muted = num === 0;
    if (num > 0) savedVol = num;
    updateVolumeIcon();
  }

  function toggleMute() {
    if (videoEl.muted || videoEl.volume === 0) {
      videoEl.muted = false;
      videoEl.volume = savedVol || 1;
      document.getElementById('volRange').value = String(videoEl.volume);
    } else {
      savedVol = videoEl.volume || 1;
      videoEl.muted = true;
      document.getElementById('volRange').value = '0';
    }
    updateVolumeIcon();
  }

  function updateVolumeIcon() {
    const icon = document.getElementById('volIcon');
    if (videoEl.muted || videoEl.volume === 0) {
      icon.innerHTML = `<polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/>`;
    } else {
      icon.innerHTML = `<polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/>`;
    }
  }

  function closePlayer() {
    closeModal();
    if (hlsInstance) {
      hlsInstance.destroy();
      hlsInstance = null;
    }
    videoEl.pause();
    videoEl.removeAttribute('src');
    videoEl.load();

    if (activeSessionId && API_BASE) {
      fetch(`${API_BASE}/api/stop?id=${encodeURIComponent(activeSessionId)}`).catch(() => {});
      activeSessionId = '';
    }

    activeMedia = null;
    setLoader(false);
    document.getElementById('playerScreen').classList.remove('open');
    renderContent();
  }

  function openExternalVLC() {
    if (!activeMedia || !API_BASE) return;
    window.location.href = `${API_BASE}/api/playlist?path=${encodeURIComponent(activeMedia.path)}`;
    showToast('Playlist downloaded — open with VLC');
  }

  function downloadM3U(idx) {
    const item = window._renderedFiles[idx];
    if (!item || !API_BASE) return;
    window.location.href = `${API_BASE}/api/playlist?path=${encodeURIComponent(item.path)}`;
    showToast('Playlist downloaded — open with VLC');
  }

  function navigateTo(path) {
    document.getElementById('sideRail').classList.remove('open');
    loadFolder(path, true);
  }

  function goBack() {
    if (historyIndex > 0) {
      historyIndex--;
      loadFolder(historyStack[historyIndex], false);
    }
  }

  function goUp() {
    if (!currentPath) return;
    const parts = currentPath.split('/');
    parts.pop();
    navigateTo(parts.join('/'));
  }

  function refreshCurrent() {
    loadFolder(currentPath, false);
    showToast('Refreshed');
  }

  function updateNavState() {
    document.getElementById('btnBack').classList.toggle('disabled', historyIndex <= 0);
    document.getElementById('btnUp').classList.toggle('disabled', currentPath === '');
  }

  function cycleSort() {
    const modes = [
      { key: 'name', asc: true, label: 'Name' },
      { key: 'size', asc: false, label: 'Size' },
      { key: 'mtime', asc: false, label: 'Date' }
    ];
    const idx = modes.findIndex(m => m.key === sortBy);
    const next = modes[(idx + 1) % modes.length];
    sortBy = next.key;
    sortAsc = next.asc;
    document.getElementById('btnSort').textContent = next.label;
    renderContent();
  }

  function toggleView() {
    viewMode = viewMode === 'list' ? 'grid' : 'list';
    document.getElementById('btnView').textContent = viewMode === 'list' ? 'Grid' : 'List';
    renderContent();
  }

  function toggleRail() {
    document.getElementById('sideRail').classList.toggle('open');
  }

  function handleSearch(val) {
    clearTimeout(searchTimer);
    if (!val.trim()) {
      loadFolder(currentPath, false);
      return;
    }
    searchTimer = setTimeout(async () => {
      try {
        const data = await apiFetch(`/api/search?q=${encodeURIComponent(val)}`);
        currentItems = data.items || [];
        document.getElementById('crumbStrip').innerHTML = `<div class="crumb-item current">Search: ${escapeHtml(val)}</div>`;
        renderContent();
      } catch (e) {}
    }, 220);
  }

  function formatBytes(bytes) {
    if (!bytes) return '0 KB';
    const units = ['B', 'KB', 'MB', 'GB', 'TB'];
    let i = 0;
    let n = bytes;
    while (n >= 1024 && i < units.length - 1) { n /= 1024; i++; }
    return `${n.toFixed(i > 1 ? 2 : 0)} ${units[i]}`;
  }

  function formatClock(sec) {
    const s = Math.floor(sec || 0);
    const h = Math.floor(s / 3600);
    const m = Math.floor((s % 3600) / 60);
    const r = s % 60;
    if (h > 0) return `${h}:${String(m).padStart(2, '0')}:${String(r).padStart(2, '0')}`;
    return `${String(m).padStart(2, '0')}:${String(r).padStart(2, '0')}`;
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
  }

  function escapeJs(s) {
    return String(s).replace(/\\/g, '\\\\').replace(/'/g, "\\'");
  }

  document.addEventListener('keydown', (e) => {
    if (!document.getElementById('playerScreen').classList.contains('open')) return;
    if (e.key === 'Escape') {
      if (document.getElementById('modalBackdrop').classList.contains('open')) closeModal();
      else closePlayer();
    } else if (e.key === ' ' && document.activeElement.getAttribute('role') !== 'button') {
      e.preventDefault();
      togglePlayPause();
    } else if (e.key === 'ArrowRight') skipBy(10);
    else if (e.key === 'ArrowLeft') skipBy(-10);
  });
</script>
</body>
</html>
