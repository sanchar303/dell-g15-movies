  <style>
    /* ============================================================
       NEUMORPHIC NETFLIX DESIGN TOKENS (DARK & LIGHT THEMES)
       ============================================================ */
    :root[data-theme="dark"] {
      --bg: #121318;
      --surface: #171920;
      --surface-elevated: #1c1f28;
      --neu-out: 7px 7px 16px #090a0d, -6px -6px 14px #21242e;
      --neu-out-sm: 4px 4px 10px #090a0d, -4px -4px 10px #21242e;
      --neu-in: inset 4px 4px 9px #090a0d, inset -4px -4px 9px #21242e;
      --stroke: rgba(255, 255, 255, 0.055);
      --text: #f5f6fa;
      --text-2: #9ca3af;
      --text-muted: #6b7280;
      --accent: #e50914;
      --accent-hover: #f6121d;
      --accent-soft: rgba(229, 9, 20, 0.16);
      --accent-glow: 0 6px 20px rgba(229, 9, 20, 0.35);
      --series-bg: rgba(59, 130, 246, 0.16);
      --series-fg: #60a5fa;
      --movie-bg: rgba(229, 9, 20, 0.16);
      --movie-fg: #ff6b72;
      --host-bg: rgba(16, 185, 129, 0.14);
      --host-fg: #34d399;
      --green: #22c55e;
      --hero-grad: linear-gradient(135deg, rgba(229, 9, 20, 0.18) 0%, rgba(23, 25, 32, 0.96) 55%, rgba(18, 19, 24, 1) 100%);
    }

    :root[data-theme="light"] {
      --bg: #e6ebf2;
      --surface: #ebf0f7;
      --surface-elevated: #f2f6fc;
      --neu-out: 7px 7px 16px #c5cbd4, -7px -7px 16px #ffffff;
      --neu-out-sm: 4px 4px 9px #c5cbd4, -4px -4px 9px #ffffff;
      --neu-in: inset 4px 4px 9px #c5cbd4, inset -4px -4px 9px #ffffff;
      --stroke: rgba(0, 0, 0, 0.045);
      --text: #14161f;
      --text-2: #525866;
      --text-muted: #7b8291;
      --accent: #e50914;
      --accent-hover: #c80711;
      --accent-soft: rgba(229, 9, 20, 0.11);
      --accent-glow: 0 6px 18px rgba(229, 9, 20, 0.25);
      --series-bg: rgba(37, 99, 235, 0.12);
      --series-fg: #1d4ed8;
      --movie-bg: rgba(229, 9, 20, 0.12);
      --movie-fg: #c80711;
      --host-bg: rgba(5, 150, 105, 0.12);
      --host-fg: #047857;
      --green: #16a34a;
      --hero-grad: linear-gradient(135deg, rgba(229, 9, 20, 0.11) 0%, rgba(235, 240, 247, 0.96) 55%, rgba(230, 235, 242, 1) 100%);
    }

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100dvh;
      height: var(--app-height, 100dvh);
      max-height: 100dvh;
      background: var(--bg);
      color: var(--text);
      font-family: "Inter", "Plus Jakarta Sans", system-ui, -apple-system, sans-serif;
      font-size: 14px;
      overflow: hidden;
      overscroll-behavior: none;
      touch-action: manipulation;
    }

    body {
      display: flex;
      flex-direction: column;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px);
      padding-left: env(safe-area-inset-left, 0px);
      padding-right: env(safe-area-inset-right, 0px);
      transition: background 0.22s ease, color 0.22s ease;
    }

    /* ============================================================
       TOP NAVIGATION BAR (NEUMORPHIC)
       ============================================================ */
    .top-nav {
      padding: 12px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-shrink: 0;
      z-index: 20;
    }

    .brand-cluster {
      display: flex;
      align-items: center;
      gap: 11px;
      cursor: pointer;
      flex-shrink: 0;
    }

    .brand-emblem {
      width: 38px;
      height: 38px;
      border-radius: 12px;
      background: var(--accent);
      box-shadow: var(--accent-glow);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      font-weight: 900;
      font-size: 19px;
      letter-spacing: -1px;
      flex-shrink: 0;
    }

    .brand-titles {
      display: flex;
      flex-direction: column;
    }

    .brand-name {
      font-size: 16px;
      font-weight: 800;
      letter-spacing: 0.4px;
      color: var(--text);
      line-height: 1.1;
    }

    .brand-name span {
      color: var(--accent);
    }

    .brand-sub {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
      margin-top: 2px;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .live-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 8px var(--green);
      display: inline-block;
      flex-shrink: 0;
    }
    .live-dot.off {
      background: #ef4444;
      box-shadow: none;
    }

    .nav-actions {
      display: flex;
      align-items: center;
      gap: 10px;
      flex: 1;
      justify-content: flex-end;
      min-width: 0;
    }

    .neu-search {
      width: 100%;
      max-width: 290px;
      height: 40px;
      border-radius: 999px;
      background: var(--surface);
      box-shadow: var(--neu-in);
      border: 1px solid var(--stroke);
      padding: 0 15px;
      display: flex;
      align-items: center;
      gap: 9px;
      color: var(--text-2);
    }
    .neu-search:focus-within {
      border-color: rgba(229, 9, 20, 0.45);
    }
    .neu-search input {
      width: 100%;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text);
      font-size: 13px;
      font-weight: 500;
      font-family: inherit;
    }
    .neu-search input::placeholder {
      color: var(--text-muted);
    }

    .neu-btn {
      height: 40px;
      padding: 0 15px;
      border-radius: 999px;
      background: var(--surface);
      box-shadow: var(--neu-out-sm);
      border: 1px solid var(--stroke);
      color: var(--text);
      font-size: 12.5px;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      cursor: pointer;
      flex-shrink: 0;
      transition: transform 0.14s ease, box-shadow 0.14s ease, color 0.14s ease;
    }
    .neu-btn:hover {
      color: var(--accent);
    }
    .neu-btn:active {
      transform: scale(0.96);
      box-shadow: var(--neu-in);
    }
    .neu-btn.icon-only {
      width: 40px;
      padding: 0;
    }
    .neu-btn.primary {
      background: var(--accent);
      color: #ffffff;
      border-color: transparent;
      box-shadow: var(--accent-glow);
    }
    .neu-btn.primary:hover {
      background: var(--accent-hover);
      color: #ffffff;
    }

    /* ============================================================
       MAIN SCROLLABLE CATALOG CONTAINER
       ============================================================ */
    .main-scroll {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding: 4px 20px 20px;
    }
    .main-scroll::-webkit-scrollbar { width: 6px; }
    .main-scroll::-webkit-scrollbar-thumb {
      background: rgba(156, 163, 175, 0.22);
      border-radius: 99px;
    }

    /* Featured Cinema Hero Card */
    .hero-card {
      background: var(--hero-grad);
      box-shadow: var(--neu-out);
      border: 1px solid var(--stroke);
      border-radius: 26px;
      padding: 22px 24px;
      margin-bottom: 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      position: relative;
      overflow: hidden;
    }

    .hero-left {
      min-width: 0;
      flex: 1;
    }

    .hero-badges {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 10px;
    }

    .badge-pill {
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.4px;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      text-transform: uppercase;
    }
    .badge-series {
      background: var(--series-bg);
      color: var(--series-fg);
    }
    .badge-movie {
      background: var(--movie-bg);
      color: var(--movie-fg);
    }
    .badge-host {
      background: var(--host-bg);
      color: var(--host-fg);
    }

    .hero-title {
      margin: 0;
      font-size: 23px;
      font-weight: 800;
      letter-spacing: -0.4px;
      color: var(--text);
      line-height: 1.25;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .hero-meta-low {
      margin-top: 8px;
      font-size: 12px;
      font-weight: 500;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .hero-cta {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }

    /* Host Server Filter Bar */
    .filter-strip {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }

    .host-tabs {
      display: flex;
      align-items: center;
      gap: 8px;
      overflow-x: auto;
      padding: 4px 2px;
      max-width: 100%;
    }
    .host-tabs::-webkit-scrollbar { display: none; }

    .host-chip {
      height: 34px;
      padding: 0 14px;
      border-radius: 999px;
      background: var(--surface);
      box-shadow: var(--neu-out-sm);
      border: 1px solid var(--stroke);
      color: var(--text-2);
      font-size: 12px;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      cursor: pointer;
      white-space: nowrap;
      transition: 0.15s ease;
    }
    .host-chip:hover { color: var(--text); }
    .host-chip.active {
      background: var(--surface);
      box-shadow: var(--neu-in);
      color: var(--accent);
      border-color: rgba(229, 9, 20, 0.35);
    }

    .catalog-summary {
      font-size: 12px;
      font-weight: 700;
      color: var(--text-muted);
      white-space: nowrap;
    }

    /* ============================================================
       UNIFIED CATALOG GRID & LIST (NEUMORPHIC NETFLIX CARDS)
       ============================================================ */
    .netflix-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(265px, 1fr));
      gap: 16px;
    }

    .media-card {
      background: var(--surface);
      box-shadow: var(--neu-out);
      border: 1px solid var(--stroke);
      border-radius: 22px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 12px;
      cursor: pointer;
      transition: transform 0.16s ease, box-shadow 0.16s ease, border-color 0.16s ease;
      position: relative;
    }
    .media-card:hover {
      transform: translateY(-3px);
      border-color: rgba(229, 9, 20, 0.38);
    }
    .media-card:active {
      transform: scale(0.985);
      box-shadow: var(--neu-in);
    }

    .card-top-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      flex-wrap: wrap;
    }

    .card-title {
      font-size: 15px;
      font-weight: 700;
      line-height: 1.35;
      color: var(--text);
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      word-break: break-word;
    }

    .card-bottom-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding-top: 8px;
      border-top: 1px solid var(--stroke);
    }

    .low-priority-meta {
      font-size: 11px;
      font-weight: 500;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
      min-width: 0;
    }

    .resume-pill {
      color: var(--accent);
      font-weight: 700;
    }

    .play-circle {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: var(--surface);
      box-shadow: var(--neu-out-sm);
      border: 1px solid var(--stroke);
      color: var(--accent);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: 0.15s ease;
    }
    .media-card:hover .play-circle {
      background: var(--accent);
      color: #ffffff;
      box-shadow: var(--accent-glow);
    }

    /* Neumorphic List View */
    .netflix-list {
      display: flex;
      flex-direction: column;
      gap: 11px;
    }

    .media-row {
      background: var(--surface);
      box-shadow: var(--neu-out-sm);
      border: 1px solid var(--stroke);
      border-radius: 20px;
      padding: 13px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      cursor: pointer;
      transition: transform 0.14s ease, border-color 0.14s ease;
    }
    .media-row:hover {
      border-color: rgba(229, 9, 20, 0.38);
    }
    .media-row:active {
      transform: scale(0.992);
      box-shadow: var(--neu-in);
    }

    .row-main {
      flex: 1;
      min-width: 0;
    }

    .row-header-line {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 4px;
    }

    .row-title {
      font-size: 14.5px;
      font-weight: 700;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Series Episode Drawer / View */
    .series-banner {
      background: var(--surface);
      box-shadow: var(--neu-out);
      border: 1px solid var(--stroke);
      border-radius: 24px;
      padding: 18px 20px;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      flex-wrap: wrap;
    }

    .state-panel {
      max-width: 420px;
      margin: 48px auto;
      background: var(--surface);
      box-shadow: var(--neu-out);
      border: 1px solid var(--stroke);
      border-radius: 28px;
      padding: 32px 24px;
      text-align: center;
    }
    .state-panel h2 {
      margin: 0 0 8px;
      font-size: 18px;
      font-weight: 800;
    }
    .state-panel p {
      margin: 0 0 20px;
      color: var(--text-2);
      font-size: 13px;
      line-height: 1.5;
    }

    footer {
      padding: 8px 20px 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 11.5px;
      color: var(--text-muted);
      flex-shrink: 0;
    }

    /* ============================================================
       CINEMA PLAYER & EXCLUSIVE FULLSCREEN MODE
       ============================================================ */
    .player-screen {
      display: none;
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100dvh;
      height: var(--app-height, 100dvh);
      max-height: 100dvh;
      background: #060609;
      z-index: 100;
      flex-direction: column;
      overflow: hidden;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px);
      padding-left: env(safe-area-inset-left, 0px);
      padding-right: env(safe-area-inset-right, 0px);
    }
    .player-screen.open { display: flex; }

    .player-header {
      padding: 10px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      background: rgba(16, 17, 23, 0.95);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      flex-shrink: 0;
      min-height: 52px;
    }

    .player-title-wrap {
      display: flex;
      align-items: center;
      gap: 9px;
      min-width: 0;
      flex: 1;
    }

    .player-name {
      font-weight: 700;
      font-size: 14.5px;
      color: #ffffff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      min-width: 0;
    }

    .quality-badge {
      padding: 4px 10px;
      border-radius: 999px;
      background: rgba(229, 9, 20, 0.16);
      border: 1px solid rgba(229, 9, 20, 0.38);
      color: #ff7a80;
      font-size: 11px;
      font-weight: 800;
      white-space: nowrap;
      flex-shrink: 0;
      pointer-events: none;
    }

    .player-pills {
      display: flex;
      align-items: center;
      gap: 7px;
      flex-shrink: 0;
    }

    .p-pill {
      height: 34px;
      padding: 0 13px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #ffffff;
      font-size: 12px;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      cursor: pointer;
      white-space: nowrap;
      transition: transform 0.12s ease, background 0.15s ease;
    }
    .p-pill:hover:not(.disabled) { background: rgba(255, 255, 255, 0.18); }
    .p-pill:active:not(.disabled) { transform: scale(0.95); }
    .p-pill.disabled { opacity: 0.32; pointer-events: none; }
    .p-pill.red {
      background: #e50914;
      border-color: rgba(255, 90, 95, 0.45);
    }
    .p-pill.danger-pill {
      background: rgba(255, 75, 75, 0.16);
      border-color: rgba(255, 75, 75, 0.3);
      color: #ff8585;
    }

    .player-workspace {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: row;
      overflow: hidden;
      width: 100%;
    }

    .player-main {
      flex: 1;
      min-width: 0;
      min-height: 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: #000000;
    }

    .video-stage {
      flex: 1;
      min-height: 0;
      width: 100%;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000000;
      overflow: hidden;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      outline: none;
      pointer-events: none;
      display: block;
    }

    /* Floating Exit Fullscreen Button — Hidden in Normal Mode, Active Only in Fullscreen Mode */
    .fs-exit-btn {
      display: none;
      position: absolute;
      top: max(16px, env(safe-area-inset-top, 16px));
      right: max(18px, env(safe-area-inset-right, 18px));
      z-index: 140;
      height: 40px;
      padding: 0 16px;
      border-radius: 999px;
      background: rgba(15, 16, 22, 0.78);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.22);

      font-size: 12.5px;
      font-weight: 700;
      align-items: center;
      gap: 7px;

    .player-screen.fs-active .episode-pane {
      display: none !important;

    .player-screen.fs-active .player-workspace,
    .player-screen.fs-active .player-main {
      width: 100% !important;
      height: 100% !important;
      max-height: none !important;
    }
    .player-screen.fs-active .video-stage {
      position: fixed !important;
      inset: 0 !important;
      width: 100vw !important;
      height: 100dvh !important;
      max-height: none !important;
      aspect-ratio: auto !important;
      z-index: 125 !important;
      cursor: pointer;
    }
    /* Fallback landscape rotation if mobile browser blocks screen.orientation.lock('landscape') while held upright */
    .player-screen.fs-active.fs-rotate-fallback .video-stage {
      width: 100dvh !important;
      height: 100vw !important;
      top: 50% !important;
      left: 50% !important;
      right: auto !important;
      bottom: auto !important;
      transform: translate(-50%, -50%) rotate(90deg) !important;
    }
    .player-screen.fs-active .fs-exit-btn {
      display: inline-flex;
      opacity: 1;
      pointer-events: auto;
    }
    .player-screen.fs-active .fs-exit-btn.fs-hidden {
      opacity: 0;
      pointer-events: none;
      transform: translateY(-8px);
    }

    .loader-box {
      position: absolute;
      inset: 0;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      background: rgba(0, 0, 0, 0.35);
      pointer-events: none;
      z-index: 15;

    .loader-box.show { display: flex; }
    .loader-circle {
      width: 42px;
      height: 42px;

      border-top-color: #e50914;
      animation: spin 0.72s linear infinite;
    }
    .loader-label {
      padding: 6px 14px;
      border-radius: 999px;
      background: rgba(15, 15, 18, 0.88);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #e4e4e7;
      font-size: 12px;
      font-weight: 600;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .player-controls {
      padding: 10px 16px 12px;
      background: rgba(16, 17, 23, 0.96);
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      flex-direction: column;
      gap: 9px;
      flex-shrink: 0;
    }

    .seek-area {
      height: 20px;
      display: flex;
      align-items: center;
      cursor: pointer;
      touch-action: none;
    }
    .seek-bar {

      height: 5px;

      transition: height 0.12s ease;

    .seek-area:hover .seek-bar,
    .seek-area:active .seek-bar { height: 7px; }
    .seek-progress {

    .seek-knob {

      height: 14px;

    .ctrl-row {
      display: flex;

      justify-content: space-between;

    .ctrl-group {

      align-items: center;
      gap: 7px;
      min-width: 0;

    }

    .vol-box {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid rgba(255, 255, 255, 0.09);
      border-radius: 999px;

      justify-content: center;

    .vol-range {

      accent-color: #e50914;

    /* Series Episode List Alongside Video */
    .episode-pane {

      flex-shrink: 0;
      background: #101116;

      flex-direction: column;
      min-height: 0;
      overflow: hidden;

    .ep-pane-head {

      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-shrink: 0;

      font-weight: 700;
      color: #ffffff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;

    .ep-pane-count {
      font-size: 11px;
      font-weight: 700;
      color: #9ca3af;
      background: rgba(255, 255, 255, 0.08);
      padding: 3px 9px;
      border-radius: 999px;
      flex-shrink: 0;
    }

    .ep-list {

      padding: 8px;
      display: flex;
      flex-direction: column;
      gap: 6px;

      border-color: rgba(229, 9, 20, 0.5);
    }

    .ep-num {

      height: 28px;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.08);
      color: #d4d4d8;
      font-size: 11.5px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .ep-info { flex: 1; min-width: 0; }
    .ep-name {
      font-size: 12.5px;
      font-weight: 600;
      color: #f4f4f6;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .ep-meta {
      margin-top: 3px;
      font-size: 11px;
      color: #8e8e98;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .ep-playing-tag { color: #ff6b72; font-weight: 700; }

    /* Custom Glass/Neumorphic Popup Modal (Audio & Speed) */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.72);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 18px;
      z-index: 180;
    }
    .modal-backdrop.open { display: flex; }

    .modal-sheet {
      width: 100%;
      max-width: 400px;
      max-height: 76dvh;
      background: #171920;
      border: 1px solid rgba(255, 255, 255, 0.12);

      flex-direction: column;

    }

    .modal-head {
      padding: 15px 18px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);

      align-items: center;
      justify-content: space-between;
      gap: 10px;

    }

      height: 30px;

      align-items: center;
      justify-content: center;
      font-size: 14px;

      gap: 6px;
    }

    .modal-option {

    .modal-option.selected {

      border-color: rgba(229, 9, 20, 0.55);
    }

    .opt-main { min-width: 0; flex: 1; }
    .opt-title {
      font-size: 13.5px;
      font-weight: 600;
      color: #ffffff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .opt-sub { margin-top: 2px; font-size: 11.5px; color: #9ca3af; }
    .opt-check {
      width: 22px;
      height: 22px;
      border-radius: 50%;

      color: #ffffff;
      font-size: 12px;
      font-weight: 700;
      display: none;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(14px);

      color: #fafafa;
      border: 1px solid rgba(255, 255, 255, 0.12);
      padding: 9px 18px;
      border-radius: 999px;
      font-size: 12.5px;
      font-weight: 600;
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.6);
      opacity: 0;
      pointer-events: none;

      z-index: 220;
      white-space: nowrap;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    /* ============================================================
       RESPONSIVE MOBILE PORTRAIT & LANDSCAPE FIT

    @media (max-width: 820px) {

      .hero-title { font-size: 19px; }

      .media-card { padding: 13px; border-radius: 18px; }
      .hide-sm { display: none; }
      footer { flex-direction: column; gap: 3px; text-align: center; font-size: 11px; padding: 6px 14px 8px; }
    }

    @media (max-width: 900px) and (orientation: portrait) {
      .player-screen:not(.fs-active) .player-header {

      }
      .player-screen:not(.fs-active) .player-title-wrap { flex-basis: 100%; }
      .player-screen:not(.fs-active) .player-pills {
        width: 100%;
        justify-content: flex-start;
        overflow-x: auto;
        gap: 6px;
      }
      .player-screen:not(.fs-active) .player-pills::-webkit-scrollbar { display: none; }
      .player-screen:not(.fs-active) .p-pill { height: 31px; padding: 0 11px; font-size: 11.5px; }

      .player-screen:not(.fs-active) .player-workspace { flex-direction: column; }
      .player-screen:not(.fs-active) .player-main { flex: none; }
      .player-screen:not(.fs-active) .player-workspace.no-episodes .player-main { flex: 1; }
      .player-screen:not(.fs-active) .player-workspace:not(.no-episodes) .video-stage {
        flex: none;
        width: 100%;
        aspect-ratio: 16 / 9;
        max-height: 34dvh;
      }
      .player-screen:not(.fs-active) .player-controls { padding: 8px 12px 10px; gap: 7px; }
      .player-screen:not(.fs-active) .ctrl-row { flex-wrap: wrap; gap: 6px; }
      .player-screen:not(.fs-active) .vol-range { width: 54px; }

      .player-screen:not(.fs-active) .episode-pane.show {
        width: 100%;
        flex: 1;
        min-height: 0;
        border-left: none;
        border-top: 1px solid rgba(255, 255, 255, 0.1);
      }
    }

    @media (orientation: landscape) and (max-height: 560px) {
      .top-nav { padding: 7px 14px; }
      footer { display: none; }

      .player-screen:not(.fs-active) .player-header { padding: 5px 12px; min-height: 40px; gap: 8px; }
      .player-screen:not(.fs-active) .player-name { font-size: 13px; }
      .player-screen:not(.fs-active) .p-pill { height: 29px; padding: 0 10px; font-size: 11px; }
      .player-screen:not(.fs-active) .player-workspace { flex-direction: row; }
      .player-screen:not(.fs-active) .player-controls { padding: 5px 12px 7px; gap: 4px; }

<body>

  <!-- Top Navigation -->
  <header class="top-nav">
    <div class="brand-cluster" role="button" tabindex="0" onclick="returnToAllCatalog()">

  <footer>

    <span>© 2026 Sanchar Koirala | All rights reserved</span>
  </footer>

  <!-- Cinema Player -->
  <div class="player-screen" id="playerScreen">
    <div class="player-header">
      <div class="player-title-wrap">
        <div class="player-name" id="playerName">Video</div>
        <div class="quality-badge" id="qualityBadge">HD · Auto</div>
      </div>

      <div class="player-pills">
        <div class="p-pill" id="audioBtn" role="button" tabindex="0" onclick="openAudioPopup()" style="display:none;">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/></svg>

        <div class="p-pill" id="nextEpBtn" role="button" tabindex="0" onclick="playNextEpisode()" style="display:none;">Next ›</div>
        <div class="p-pill red" role="button" tabindex="0" onclick="openExternalVLC()">VLC</div>
        <div class="p-pill danger-pill" role="button" tabindex="0" onclick="closePlayer()">Close</div>

    <div class="player-workspace no-episodes" id="playerWorkspace">

          <div class="fs-exit-btn" id="fsExitBtn" role="button" tabindex="0" onclick="exitFullscreenMode(event)">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M8 3v3a2 2 0 0 1-2 2H3m18 0h-3a2 2 0 0 1-2-2V3m0 18v-3a2 2 0 0 1 2-2h3M3 16h3a2 2 0 0 1 2 2v3"/></svg>
            <span>Exit Fullscreen</span>
          </div>

          <div class="loader-box" id="loaderBox">
            <div class="loader-circle"></div>

        </div>

        <div class="player-controls">
          <div class="seek-area" id="seekArea" onclick="seekFromBar(event)">
            <div class="seek-bar">
              <div class="seek-progress" id="seekProgress">

            <div class="ctrl-group">
              <div class="p-pill" id="speedBtn" role="button" tabindex="0" onclick="openSpeedPopup()">1x</div>
              <div class="vol-box">
                <div class="vol-mute" id="muteBtn" role="button" tabindex="0" onclick="toggleMute()" title="Mute/Unmute">
                  <svg id="volIcon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/></svg>
                </div>
                <input type="range" class="vol-range" id="volRange" min="0" max="1" step="0.05" value="1" oninput="setVolume(this.value)">
              </div>

                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3"><path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/></svg>
                <span>Fullscreen</span>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- Series Episodes List Alongside Video -->
      <aside class="episode-pane" id="episodePane">
        <div class="ep-pane-head">
          <div class="ep-pane-title" id="epPaneTitle">Series Episodes</div>
          <div class="ep-pane-count" id="epPaneCount">1 / 1</div>
        </div>
        <div class="ep-list" id="epList"></div>
      </aside>
    </div>
  </div>

  <!-- Custom Popup Modal (Audio Track & Speed Selection) -->
  <div class="modal-backdrop" id="modalBackdrop" onclick="closeModal()">
    <div class="modal-sheet" onclick="event.stopPropagation()">

      </div>

    </div>
  </div>

  <div class="toast" id="toast"></div>

  /* Active Series Folder View State (null = Unified Root Catalog) */
  let activeSeriesFolder = null;
  let activeSeriesEpisodes = [];

  /* Active Player State */
  let activePlayerList = [];
  let activeIndex = -1;
  let activeMedia = null;
  let activeProbe = { duration: 0, resolutionLabel: 'HD', audioTracks: [] };
  let activeSessionId = '';
  let activeAudioTrack = 0;
  let activeSpeed = 1;
  let streamOffsetSec = 0;
  let hlsInstance = null;
  let lastSavedTick = 0;

  /* Exclusive Fullscreen State */
  let isFullscreenMode = false;
  let fsButtonVisible = true;
  let orientationLockedByPlayer = false;

  const SPEED_OPTIONS = [
    { value: 0.5, label: '0.5x', sub: 'Slow motion' },
    { value: 0.75, label: '0.75x', sub: 'Slightly slower' },
    { value: 1, label: '1x (Normal)', sub: 'Standard playback speed' },
    { value: 1.25, label: '1.25x', sub: 'Faster' },
    { value: 1.5, label: '1.5x', sub: 'Quick review' },
    { value: 2, label: '2x', sub: 'Double speed' }
  ];

  /* ============================================================
     VIEWPORT & ACCELEROMETER / ORIENTATION SYNC
     ============================================================ */
  function syncViewportLayout() {
    document.documentElement.style.setProperty('--app-height', `${window.innerHeight}px`);
    if (window.scrollY !== 0 || window.scrollX !== 0) {
      window.scrollTo(0, 0);
    }
    if (isFullscreenMode) {
      updateFullscreenRotationFallback();
    }
  }

  function updateFullscreenRotationFallback() {
    const screenEl = document.getElementById('playerScreen');
    if (!isFullscreenMode) {
      screenEl.classList.remove('fs-rotate-fallback');
      return;
    }
    const isPortraitViewport = window.innerHeight > window.innerWidth;
    screenEl.classList.toggle('fs-rotate-fallback', !orientationLockedByPlayer && isPortraitViewport);
  }

  function unlockMobileOrientation() {
    orientationLockedByPlayer = false;
    try {
      if (screen.orientation && typeof screen.orientation.unlock === 'function') {
        screen.orientation.unlock();
      }
    } catch (e) {}
  }

  let lastAccelAngle = '';
  function handleAccelerometerMotion(e) {
    const acc = e.accelerationIncludingGravity;
    if (!acc || acc.x === null || acc.y === null) return;
    const ax = Math.abs(acc.x);
    const ay = Math.abs(acc.y);
    if (ax < 5.5 && ay < 5.5) return;
    const inferred = ax > ay ? 'landscape' : 'portrait';
    if (inferred !== lastAccelAngle) {
      lastAccelAngle = inferred;
      syncViewportLayout();
    }
  }

  syncViewportLayout();
  window.addEventListener('resize', syncViewportLayout, { passive: true });
  window.addEventListener('orientationchange', () => {
    setTimeout(syncViewportLayout, 60);
    setTimeout(syncViewportLayout, 260);
  }, { passive: true });
  if (screen.orientation && screen.orientation.addEventListener) {
    screen.orientation.addEventListener('change', syncViewportLayout);
  }
  window.addEventListener('devicemotion', handleAccelerometerMotion, { passive: true });

  /* ============================================================
     THEME & ACCESSIBILITY
     ============================================================ */
  function applyTheme(theme) {
    document.documentElement.setAttribute('data-theme', theme);
    localStorage.setItem('g15_movies_theme', theme);
    document.getElementById('btnTheme').textContent = theme === 'dark' ? '☀' : '☾';
    document.getElementById('metaThemeColor').setAttribute('content', theme === 'dark' ? '#121318' : '#e6ebf2');
  }

  function toggleTheme() {
    const cur = document.documentElement.getAttribute('data-theme') || 'dark';
    applyTheme(cur === 'dark' ? 'light' : 'dark');
  }

  applyTheme(localStorage.getItem('g15_movies_theme') || 'dark');

  document.addEventListener('keydown', (e) => {
    if (e.target && e.target.getAttribute('role') === 'button' && (e.key === 'Enter' || e.key === ' ')) {
      e.preventDefault();
      e.target.click();
    }
  });

  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(t._timer);
    t._timer = setTimeout(() => t.classList.remove('show'), 2400);
  }

  function setLoader(show, text = 'Preparing stream...') {
    const box = document.getElementById('loaderBox');
    document.getElementById('loaderLabel').textContent = text;
    box.classList.toggle('show', show);
  }

  async function apiFetchFromServer(serverUrl, endpoint) {
    if (!serverUrl) throw new Error('Server offline');
    const res = await fetch(`${serverUrl}${endpoint}`);
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);
    return data;
  }

  /* ============================================================
     FEDERATED MULTI-SERVER DISCOVERY & UNIFIED CATALOG FETCH
     ============================================================ */
  db.ref('.info/serverTimeOffset').on('value', (snap) => {
    serverTimeOffsetMs = snap.val() || 0;
  });

  function reconcileServers() {
    const nowSec = Math.floor((Date.now() + serverTimeOffsetMs) / 1000);
    const list = [];

    if (latestServersObj && typeof latestServersObj === 'object') {
      Object.entries(latestServersObj).forEach(([key, srv]) => {
        if (!srv || !srv.url) return;
        const cleanUrl = String(srv.url).trim().replace(/\/+$/, '');
        if (!cleanUrl) return;
        const lastSeen = Number(srv.lastSeen || 0);
        if (lastSeen > 0 && (nowSec - lastSeen) > 85) return;
        list.push({
          id: srv.id || key,
          name: srv.name || key,
          url: cleanUrl,
          videoCount: Number(srv.videoCount || 0),
          totalSizeLabel: srv.totalSizeLabel || ''
        });
      });
    }

    if (list.length === 0 && latestLegacyObj && latestLegacyObj.url) {
      const cleanLegacy = String(latestLegacyObj.url).trim().replace(/\/+$/, '');
      if (cleanLegacy) {
        list.push({
          id: 'default-host',
          name: 'DELL-G15',
          url: cleanLegacy,
          videoCount: 0,
          totalSizeLabel: ''
        });
      }
    }

    list.sort((a, b) => a.name.localeCompare(b.name, undefined, { numeric: true }));

    const prevSignature = onlineServers.map(s => `${s.id}:${s.url}`).join('|');
    const nextSignature = list.map(s => `${s.id}:${s.url}`).join('|');
    onlineServers = list;

    const dot = document.getElementById('globalLiveDot');
    const status = document.getElementById('globalHostStatus');
    if (onlineServers.length === 0) {
      dot.classList.add('off');
      status.textContent = 'No hosts online';
      unifiedCatalog = [];
      renderCurrentScreen();
      return;
    }

    dot.classList.remove('off');
    status.textContent = onlineServers.length === 1
      ? `Live Host: ${onlineServers[0].name}`
      : `${onlineServers.length} Live Hosts Online`;

    if (hostFilterId !== 'ALL' && !onlineServers.some(s => s.id === hostFilterId)) {
      hostFilterId = 'ALL';
    }

    if (prevSignature !== nextSignature) {
      fetchUnifiedCatalog();
    }
  }

  db.ref('servers').on('value', (snap) => {
    latestServersObj = snap.val() || {};
    reconcileServers();
  });

  db.ref('server-js').on('value', (snap) => {
    latestLegacyObj = snap.val();
    reconcileServers();
  });

  setInterval(reconcileServers, 15000);

  async function fetchUnifiedCatalog() {
    if (onlineServers.length === 0) {
      unifiedCatalog = [];
      renderCurrentScreen();
      return;
    }

    const results = await Promise.all(
      onlineServers.map(async (srv) => {
        try {
          const data = await apiFetchFromServer(srv.url, '/api/list?path=');
          const items = data.items || [];
          return items.map(item => ({
            ...item,
            cleanName: cleanTitle(item.name),
            serverId: srv.id,
            serverName: srv.name,
            serverUrl: srv.url
          }));
        } catch (e) {
          return [];
        }
      })
    );

    const merged = results.flat();
    // Strict alphabetical ascending order (A -> Z) mixing Movies & Series together
    merged.sort((a, b) => a.cleanName.localeCompare(b.cleanName, undefined, { numeric: true, sensitivity: 'base' }));
    unifiedCatalog = merged;
    renderCurrentScreen();
  }

  function refreshAllCatalog() {
    if (activeSeriesFolder) {
      openSeriesFolder(activeSeriesFolder, false);
    } else {
      fetchUnifiedCatalog();
    }
    showToast('Catalog refreshed');
  }

  /* ============================================================
     SERIES FOLDER DRILLING & NAVIGATION
     ============================================================ */
  async function openSeriesFolder(seriesItem, scrollTop = true) {
    activeSeriesFolder = seriesItem;
    const container = document.getElementById('mainScroll');
    container.innerHTML = `<div class="state-panel"><h2>Loading Series...</h2><p>Fetching episodes from ${escapeHtml(seriesItem.serverName)}</p></div>`;

    try {
      const data = await apiFetchFromServer(seriesItem.serverUrl, `/api/list?path=${encodeURIComponent(seriesItem.path)}`);
      const rawItems = (data.items || []).filter(i => i.type === 'file');
      rawItems.sort((a, b) => a.name.localeCompare(b.name, undefined, { numeric: true, sensitivity: 'base' }));

      activeSeriesEpisodes = rawItems.map(ep => ({
        ...ep,
        cleanName: cleanTitle(ep.name),
        serverId: seriesItem.serverId,
        serverName: seriesItem.serverName,
        serverUrl: seriesItem.serverUrl
      }));

      renderCurrentScreen();
      if (scrollTop) container.scrollTop = 0;
    } catch (e) {
      container.innerHTML = `
        <div class="state-panel">
          <h2>Host Unreachable</h2>
          <p>Could not load episodes from ${escapeHtml(seriesItem.serverName)}.</p>
          <div class="neu-btn" role="button" tabindex="0" onclick="returnToAllCatalog()">← Back to Catalog</div>
        </div>
      `;
    }
  }

  function returnToAllCatalog() {
    activeSeriesFolder = null;
    activeSeriesEpisodes = [];
    renderCurrentScreen();
  }

  function setHostFilter(srvId) {
    hostFilterId = srvId;
    renderCurrentScreen();
  }

  function toggleViewMode() {
    viewMode = viewMode === 'grid' ? 'list' : 'grid';
    document.getElementById('btnView').textContent = viewMode === 'grid' ? 'List' : 'Grid';
    renderCurrentScreen();
  }

  function handleSearchInput(val) {
    searchQuery = val.trim().toLowerCase();
    renderCurrentScreen();
  }

  /* ============================================================
     RENDERING: UNIFIED NETFLIX CATALOG & SERIES EPISODE VIEW
     ============================================================ */
  function cleanTitle(filename) {
    return filename.replace(/\.[^/.]+$/, '').replace(/[._]+/g, ' ').trim();
  }

  function progressKey(serverId, path) {
    return `g15_prog_${serverId || 'host'}_${path}`;
  }

  function getSavedProgress(serverId, path) {
    try {
      return JSON.parse(localStorage.getItem(progressKey(serverId, path)) || 'null');
    } catch (e) {
      return null;
    }
  }

  function renderCurrentScreen() {
    const container = document.getElementById('mainScroll');

    if (onlineServers.length === 0) {
      document.getElementById('footerStats').textContent = 'Offline';
      container.innerHTML = `
        <div class="state-panel">
          <h2>No Hosts Online</h2>
          <p>Run <strong>MyFilesServer.exe</strong> on any Windows PC to stream your movie &amp; series library live here.</p>
          <div class="neu-btn" role="button" tabindex="0" onclick="refreshAllCatalog()">Check Again</div>
        </div>
      `;
      return;
    }

    // 1. Inside a Series Folder -> Render Series Header & Episode Cards
    if (activeSeriesFolder) {
      const s = activeSeriesFolder;
      const eps = searchQuery
        ? activeSeriesEpisodes.filter(e => e.cleanName.toLowerCase().includes(searchQuery))
        : activeSeriesEpisodes;

      document.getElementById('footerStats').textContent = `${eps.length} ${eps.length === 1 ? 'episode' : 'episodes'} · Hosted on ${s.serverName}`;

      let html = `
        <div class="series-banner">
          <div style="min-width:0; flex:1;">
            <div class="hero-badges">
              <div class="neu-btn" style="height:30px; padding:0 12px; font-size:11.5px;" role="button" tabindex="0" onclick="returnToAllCatalog()">← All Movies &amp; Series</div>
              <span class="badge-pill badge-series">SERIES · ${activeSeriesEpisodes.length} EP</span>
              <span class="badge-pill badge-host">HOST: ${escapeHtml(s.serverName)}</span>
            </div>
            <h1 class="hero-title">${escapeHtml(s.cleanName)}</h1>
            <div class="hero-meta-low">
              <span>Total Size: ${escapeHtml(s.sizeLabel)}</span>
              <span>•</span>
              <span>Updated: ${escapeHtml(s.modified)}</span>
            </div>
          </div>
          ${activeSeriesEpisodes.length > 0 ? `
            <div class="hero-cta">
              <div class="neu-btn primary" role="button" tabindex="0" onclick="launchSeriesEpisode(0)">▶ Play Episode 1</div>
            </div>
          ` : ''}
        </div>
      `;

      if (eps.length === 0) {
        html += `<div class="state-panel"><h2>No Episodes Found</h2><p>No playable videos match your filter inside this series.</p></div>`;
        container.innerHTML = html;
        return;
      }

      html += `<div class="${viewMode === 'grid' ? 'netflix-grid' : 'netflix-list'}">`;
      eps.forEach((ep) => {
        const realIdx = activeSeriesEpisodes.indexOf(ep);
        const prog = getSavedProgress(ep.serverId, ep.path);
        const resumeHtml = prog && prog.pos > 15 ? `<span class="resume-pill">Resume ${formatClock(prog.pos)}</span><span>•</span>` : '';

        if (viewMode === 'grid') {
          html += `
            <div class="media-card" role="button" tabindex="0" onclick="launchSeriesEpisode(${realIdx})">
              <div class="card-top-row">
                <span class="badge-pill badge-series">EP ${String(realIdx + 1).padStart(2, '0')}</span>
                <span class="badge-pill badge-host">${escapeHtml(ep.serverName)}</span>
              </div>
              <div class="card-title" title="${escapeHtml(ep.name)}">${escapeHtml(ep.cleanName)}</div>
              <div class="card-bottom-row">
                <div class="low-priority-meta">
                  ${resumeHtml}
                  <span>${escapeHtml(ep.sizeLabel)}</span>
                  <span>•</span>
                  <span>${escapeHtml(ep.ext)}</span>
                </div>
                <div class="play-circle">▶</div>
              </div>
            </div>
          `;
        } else {
          html += `
            <div class="media-row" role="button" tabindex="0" onclick="launchSeriesEpisode(${realIdx})">
              <div class="row-main">
                <div class="row-header-line">
                  <span class="badge-pill badge-series">EP ${String(realIdx + 1).padStart(2, '0')}</span>
                  <span class="badge-pill badge-host">${escapeHtml(ep.serverName)}</span>
                </div>
                <div class="row-title" title="${escapeHtml(ep.name)}">${escapeHtml(ep.cleanName)}</div>
                <div class="low-priority-meta" style="margin-top:4px;">
                  ${resumeHtml}
                  <span>${escapeHtml(ep.sizeLabel)}</span>
                  <span>•</span>
                  <span>${escapeHtml(ep.ext)}</span>
                  <span class="hide-sm">•</span>
                  <span class="hide-sm">${escapeHtml(ep.modified)}</span>
                </div>
              </div>
              <div class="play-circle">▶</div>
            </div>
          `;
        }
      });
      html += `</div>`;
      container.innerHTML = html;
      return;
    }

    // 2. Unified Root Catalog (All Movies & Series Mixed Alphabetically A -> Z)
    let filtered = unifiedCatalog;
    if (hostFilterId !== 'ALL') {
      filtered = filtered.filter(item => item.serverId === hostFilterId);
    }
    if (searchQuery) {
      filtered = filtered.filter(item =>
        item.cleanName.toLowerCase().includes(searchQuery) ||
        item.serverName.toLowerCase().includes(searchQuery)
      );
    }

    // Guarantee alphabetical ascending order
    filtered = [...filtered].sort((a, b) =>
      a.cleanName.localeCompare(b.cleanName, undefined, { numeric: true, sensitivity: 'base' })
    );
    window._visibleUnifiedItems = filtered;

    const movieCount = filtered.filter(i => i.type === 'file').length;
    const seriesCount = filtered.filter(i => i.type === 'folder').length;
    document.getElementById('footerStats').textContent = `${filtered.length} titles (${movieCount} movies, ${seriesCount} series) · Sorted A–Z`;

    // Build Featured Hero from first item (or most recently resumable item)
    let heroItem = filtered[0] || null;
    for (const candidate of filtered) {
      if (candidate.type === 'file') {
        const p = getSavedProgress(candidate.serverId, candidate.path);
        if (p && p.pos > 15) {
          heroItem = candidate;
          break;
        }
      }
    }

    let html = '';
    if (heroItem) {
      const heroIdx = filtered.indexOf(heroItem);
      const isSeries = heroItem.type === 'folder';
      const heroProg = !isSeries ? getSavedProgress(heroItem.serverId, heroItem.path) : null;
      const ctaText = isSeries
        ? `Browse ${heroItem.count} Episodes`
        : (heroProg && heroProg.pos > 15 ? `▶ Resume (${formatClock(heroProg.pos)})` : '▶ Watch Now');

      html += `
        <div class="hero-card">
          <div class="hero-left">
            <div class="hero-badges">
              <span class="badge-pill ${isSeries ? 'badge-series' : 'badge-movie'}">
                ${isSeries ? `SERIES · ${heroItem.count} ${heroItem.count === 1 ? 'EP' : 'EPS'}` : `MOVIE · ${escapeHtml(heroItem.ext)}`}
              </span>
              <span class="badge-pill badge-host">HOSTED BY ${escapeHtml(heroItem.serverName)}</span>
            </div>
            <h1 class="hero-title">${escapeHtml(heroItem.cleanName)}</h1>
            <div class="hero-meta-low">
              <span>Size: ${escapeHtml(heroItem.sizeLabel)}</span>
              <span>•</span>
              <span>Added: ${escapeHtml(heroItem.modified)}</span>
            </div>
          </div>
          <div class="hero-cta">
            <div class="neu-btn primary" role="button" tabindex="0" onclick="handleCatalogItemClick(${heroIdx})">${escapeHtml(ctaText)}</div>
          </div>
        </div>
      `;
    }

    // Host Filter Pills
    html += `
      <div class="filter-strip">
        <div class="host-tabs">
          <div class="host-chip ${hostFilterId === 'ALL' ? 'active' : ''}" role="button" tabindex="0" onclick="setHostFilter('ALL')">
            <span class="live-dot"></span>
            <span>All Hosts (${onlineServers.length})</span>
          </div>
          ${onlineServers.map(srv => `
            <div class="host-chip ${hostFilterId === srv.id ? 'active' : ''}" role="button" tabindex="0" onclick="setHostFilter('${escapeJs(srv.id)}')">
              <span class="live-dot"></span>
              <span>${escapeHtml(srv.name)}</span>
            </div>
          `).join('')}
        </div>
        <div class="catalog-summary">Sorted A → Z · ${filtered.length} ${filtered.length === 1 ? 'Title' : 'Titles'}</div>
      </div>
    `;

    if (filtered.length === 0) {
      html += `<div class="state-panel"><h2>No Matching Titles</h2><p>No movies or series match your current search or host filter.</p></div>`;
      container.innerHTML = html;
      return;
    }

    html += `<div class="${viewMode === 'grid' ? 'netflix-grid' : 'netflix-list'}">`;
    filtered.forEach((item, idx) => {
      const isSeries = item.type === 'folder';
      const typeBadge = isSeries
        ? `<span class="badge-pill badge-series">SERIES · ${item.count} ${item.count === 1 ? 'EP' : 'EPS'}</span>`
        : `<span class="badge-pill badge-movie">MOVIE · ${escapeHtml(item.ext)}</span>`;
      const hostBadge = `<span class="badge-pill badge-host">${escapeHtml(item.serverName)}</span>`;

      const prog = !isSeries ? getSavedProgress(item.serverId, item.path) : null;
      const resumeHtml = prog && prog.pos > 15 ? `<span class="resume-pill">Resume ${formatClock(prog.pos)}</span><span>•</span>` : '';

      if (viewMode === 'grid') {
        html += `
          <div class="media-card" role="button" tabindex="0" onclick="handleCatalogItemClick(${idx})">
            <div class="card-top-row">
              ${typeBadge}
              ${hostBadge}
            </div>
            <div class="card-title" title="${escapeHtml(item.name)}">${escapeHtml(item.cleanName)}</div>
            <div class="card-bottom-row">
              <div class="low-priority-meta">
                ${resumeHtml}
                <span>${escapeHtml(item.sizeLabel)}</span>
                <span>•</span>
                <span>${escapeHtml(item.modified)}</span>
              </div>
              <div class="play-circle">${isSeries ? '☰' : '▶'}</div>
            </div>
          </div>
        `;
      } else {
        html += `
          <div class="media-row" role="button" tabindex="0" onclick="handleCatalogItemClick(${idx})">
            <div class="row-main">
              <div class="row-header-line">
                ${typeBadge}
                ${hostBadge}
              </div>
              <div class="row-title" title="${escapeHtml(item.name)}">${escapeHtml(item.cleanName)}</div>
              <div class="low-priority-meta" style="margin-top:4px;">
                ${resumeHtml}
                <span>${escapeHtml(item.sizeLabel)}</span>
                <span>•</span>
                <span>${escapeHtml(item.modified)}</span>
              </div>
            </div>
            <div class="play-circle">${isSeries ? '☰' : '▶'}</div>
          </div>
        `;
      }
    });
    html += `</div>`;
    container.innerHTML = html;
  }

  function handleCatalogItemClick(idx) {
    const item = window._visibleUnifiedItems[idx];
    if (!item) return;

    if (item.type === 'folder') {
      openSeriesFolder(item, true);
    } else {
      // Singular Movie from Root -> Play without Prev/Next or Episode list
      activePlayerList = [item];
      openMediaAtIndex(0, false, false);
    }
  }

  function launchSeriesEpisode(epIdx) {
    if (!activeSeriesEpisodes.length) return;
    activePlayerList = activeSeriesEpisodes;
    openMediaAtIndex(epIdx, true, false);
  }

  /* ============================================================
     SERIES EPISODE NAVIGATION (SHOWN ONLY FOR MULTI-EPISODE SERIES)
     ============================================================ */
  function isPlayingSeriesFolder() {
    return activeSeriesFolder !== null && Array.isArray(activePlayerList) && activePlayerList.length > 1;
  }

  function updateEpisodeNavigationUI() {
    const showSeriesUI = isPlayingSeriesFolder();
    const prevBtn = document.getElementById('prevEpBtn');
    const nextBtn = document.getElementById('nextEpBtn');
    const epPane = document.getElementById('episodePane');
    const workspace = document.getElementById('playerWorkspace');

    if (!showSeriesUI) {
      prevBtn.style.display = 'none';
      nextBtn.style.display = 'none';
      epPane.classList.remove('show');
      workspace.classList.add('no-episodes');
      return;
    }

    prevBtn.style.display = 'inline-flex';
    nextBtn.style.display = 'inline-flex';
    prevBtn.classList.toggle('disabled', activeIndex <= 0);
    nextBtn.classList.toggle('disabled', activeIndex >= activePlayerList.length - 1);

    epPane.classList.add('show');
    workspace.classList.remove('no-episodes');

    document.getElementById('epPaneTitle').textContent = activeSeriesFolder.cleanName;
    document.getElementById('epPaneCount').textContent = `${activeIndex + 1} / ${activePlayerList.length}`;

    const listEl = document.getElementById('epList');
    listEl.innerHTML = activePlayerList.map((f, i) => {
      const isCur = i === activeIndex;
      const prog = getSavedProgress(f.serverId, f.path);
      const statusHtml = isCur
        ? `<span class="ep-playing-tag">Playing</span>`
        : (prog && prog.pos > 15 ? `<span>Resume ${formatClock(prog.pos)}</span>` : `<span>${escapeHtml(f.ext)}</span>`);
      return `
        <div class="ep-card ${isCur ? 'active' : ''}" id="epCard_${i}" role="button" tabindex="0" onclick="selectEpisode(${i})">
          <div class="ep-num">${String(i + 1).padStart(2, '0')}</div>
          <div class="ep-info">
            <div class="ep-name" title="${escapeHtml(f.name)}">${escapeHtml(f.cleanName)}</div>
            <div class="ep-meta">
              ${statusHtml}
              <span>•</span>
              <span>${escapeHtml(f.sizeLabel)}</span>
            </div>
          </div>
        </div>
      `;
    }).join('');

    requestAnimationFrame(() => {
      const activeCard = document.getElementById(`epCard_${activeIndex}`);
      if (activeCard) {
        activeCard.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
      }
    });
  }

  function selectEpisode(idx) {
    if (idx === activeIndex) return;
    openMediaAtIndex(idx, true, false);
  }

  function playPrevEpisode() {
    if (!isPlayingSeriesFolder() || activeIndex <= 0) return;
    openMediaAtIndex(activeIndex - 1, true, false);
  }

  function playNextEpisode() {
    if (!isPlayingSeriesFolder() || activeIndex >= activePlayerList.length - 1) return;
    openMediaAtIndex(activeIndex + 1, true, false);
  }

  /* ============================================================
     EXCLUSIVE FULLSCREEN MODE & SCREEN TAP TOGGLE
     ============================================================ */
  function enterFullscreenMode() {
    if (!activeMedia) return;
    isFullscreenMode = true;
    fsButtonVisible = true;

    const screenEl = document.getElementById('playerScreen');
    const exitBtn = document.getElementById('fsExitBtn');
    screenEl.classList.add('fs-active');
    exitBtn.classList.remove('fs-hidden');

    const reqFs = screenEl.requestFullscreen || screenEl.webkitRequestFullscreen || screenEl.msRequestFullscreen;
    if (typeof reqFs === 'function') {
      try {
        const promise = reqFs.call(screenEl);
        if (promise && typeof promise.catch === 'function') {
          promise.catch(() => {});
        }
      } catch (e) {}
    }

    if (screen.orientation && typeof screen.orientation.lock === 'function') {
      screen.orientation.lock('landscape')
        .then(() => {
          orientationLockedByPlayer = true;
          updateFullscreenRotationFallback();
        })
        .catch(() => {
          orientationLockedByPlayer = false;
          updateFullscreenRotationFallback();
        });
    } else {
      orientationLockedByPlayer = false;
      updateFullscreenRotationFallback();
    }
  }

  function exitFullscreenMode(fromBrowserEvent = false) {
    if (!isFullscreenMode && !fromBrowserEvent) return;
    isFullscreenMode = false;
    fsButtonVisible = true;

    const screenEl = document.getElementById('playerScreen');
    const exitBtn = document.getElementById('fsExitBtn');
    screenEl.classList.remove('fs-active', 'fs-rotate-fallback');
    exitBtn.classList.remove('fs-hidden');

    if (!fromBrowserEvent) {
      const fsEl = document.fullscreenElement || document.webkitFullscreenElement || document.msFullscreenElement;
      if (fsEl) {
        const exitFn = document.exitFullscreen || document.webkitExitFullscreen || document.msExitFullscreen;
        if (typeof exitFn === 'function') {
          try {
            const p = exitFn.call(document);
            if (p && typeof p.catch === 'function') p.catch(() => {});
          } catch (e) {}
        }
      }
    }

    unlockMobileOrientation();
    setTimeout(syncViewportLayout, 60);
  }

  function handleVideoStageTap(e) {
    // Only toggles the Exit Fullscreen button when in Fullscreen Mode; does nothing in normal mode
    if (!isFullscreenMode) return;
    if (e.target && e.target.closest('#fsExitBtn')) return;

    fsButtonVisible = !fsButtonVisible;
    document.getElementById('fsExitBtn').classList.toggle('fs-hidden', !fsButtonVisible);
  }

  function handleNativeFullscreenChange() {
    const fsEl = document.fullscreenElement || document.webkitFullscreenElement || document.msFullscreenElement;
    if (!fsEl && isFullscreenMode) {
      exitFullscreenMode(true);
    }
  }

  document.addEventListener('fullscreenchange', handleNativeFullscreenChange);
  document.addEventListener('webkitfullscreenchange', handleNativeFullscreenChange);

  /* ============================================================
     CINEMA PLAYER CORE
     ============================================================ */
  function updateQualityBadge(label) {
    document.getElementById('qualityBadge').textContent = `${label || 'HD'} · Auto`;
  }

  async function openMediaAtIndex(idx, isSeries, forceStartZero = false) {
    const item = activePlayerList[idx];
    if (!item || !item.serverUrl) return;

    unlockMobileOrientation();
    syncViewportLayout();

    activeIndex = idx;
    activeMedia = item;
    activeAudioTrack = 0;

    const saved = !forceStartZero ? getSavedProgress(item.serverId, item.path) : null;
    const initialStart = saved && saved.pos > 15 && (!saved.dur || saved.pos < saved.dur - 30) ? Math.floor(saved.pos) : 0;
    streamOffsetSec = initialStart;

    const screenEl = document.getElementById('playerScreen');
    const audioBtn = document.getElementById('audioBtn');

    isFullscreenMode = false;
    screenEl.classList.remove('fs-active', 'fs-rotate-fallback');

    document.getElementById('playerName').textContent = `${item.cleanName} (${item.serverName})`;
    document.getElementById('seekProgress').style.width = '0%';
    document.getElementById('clockText').textContent = '00:00 / --:--';
    updateQualityBadge('HD');
    audioBtn.style.display = 'none';

    updateEpisodeNavigationUI();
    setLoader(true, `Connecting to ${item.serverName}...`);
    screenEl.classList.add('open');

    try {
      activeProbe = await apiFetchFromServer(item.serverUrl, `/api/probe?path=${encodeURIComponent(item.path)}`);
    } catch (e) {
      activeProbe = { duration: 0, resolutionLabel: 'HD', audioTracks: [] };
    }

    updateQualityBadge(activeProbe.resolutionLabel || 'HD');

    if (activeProbe.audioTracks && activeProbe.audioTracks.length > 0) {
      audioBtn.style.display = 'inline-flex';
      document.getElementById('audioBtnLabel').textContent = `Audio: ${activeProbe.audioTracks[0].shortLabel}`;
    }

    if (initialStart > 0) {
      showToast(`Resuming at ${formatClock(initialStart)}`);
    }

    await startHlsSession(initialStart);
  }

  async function startHlsSession(startSec) {
    if (!activeMedia || !activeMedia.serverUrl) return;
    setLoader(true, 'Buffering stream...');

    const video = document.getElementById('videoEl');
    if (hlsInstance) {
      hlsInstance.destroy();
      hlsInstance = null;
    }
    video.pause();

    try {
      const qs = new URLSearchParams({
        path: activeMedia.path,
        start: String(Math.max(0, Math.floor(startSec))),
        atrack: String(activeAudioTrack),
        prev: activeSessionId || ''
      });

      const sess = await apiFetchFromServer(activeMedia.serverUrl, `/api/session?${qs.toString()}`);
      activeSessionId = sess.sessionId;
      streamOffsetSec = Math.max(0, Math.floor(startSec));
      if (sess.duration && !activeProbe.duration) {
        activeProbe.duration = sess.duration;
      }
      if (sess.resolutionLabel) {
        updateQualityBadge(sess.resolutionLabel);
      }

      const fullPlaylistUrl = `${activeMedia.serverUrl}${sess.playlistUrl}`;

      if (window.Hls && Hls.isSupported()) {
        hlsInstance = new Hls({
          enableWorker: true,
          maxBufferLength: 30,
          maxMaxBufferLength: 60,
          manifestLoadingMaxRetry: 6,
          levelLoadingMaxRetry: 6,
          fragLoadingMaxRetry: 8
        });
        hlsInstance.loadSource(fullPlaylistUrl);
        hlsInstance.attachMedia(video);
        hlsInstance.on(Hls.Events.MANIFEST_PARSED, () => {
          video.playbackRate = activeSpeed;
          video.play().catch(() => {});
        });
        hlsInstance.on(Hls.Events.ERROR, (_, data) => {
          if (data.fatal) {
            if (data.type === Hls.ErrorTypes.NETWORK_ERROR) {
              hlsInstance.startLoad();
            } else if (data.type === Hls.ErrorTypes.MEDIA_ERROR) {
              hlsInstance.recoverMediaError();
            } else {
              setLoader(false);
              showToast('Stream interrupted');
            }
          }
        });
      } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
        video.src = fullPlaylistUrl;
        video.load();
        video.playbackRate = activeSpeed;
        video.play().catch(() => {});
      }
    } catch (e) {
      setLoader(false);
      showToast(`Stream error: ${e.message}`);
    }
  }

  /* ============================================================
     POPUP MODALS (AUDIO TRACK / LANGUAGE & PLAYBACK SPEED)
     ============================================================ */
  function openAudioPopup() {
    const tracks = activeProbe.audioTracks || [];
    if (tracks.length === 0) return;

    document.getElementById('modalTitle').textContent = 'Audio Track & Language';
    const list = document.getElementById('modalList');
    list.innerHTML = tracks.map(tr => `
      <div class="modal-option ${tr.index === activeAudioTrack ? 'selected' : ''}" role="button" tabindex="0" onclick="selectAudioTrack(${tr.index})">
        <div class="opt-main">
          <div class="opt-title">${escapeHtml(tr.title)}</div>
          <div class="opt-sub">${escapeHtml(tr.meta)}</div>
        </div>
        <div class="opt-check">✓</div>
      </div>
    `).join('');
    document.getElementById('modalBackdrop').classList.add('open');
  }

  function selectAudioTrack(trackIdx) {
    closeModal();
    if (trackIdx === activeAudioTrack) return;
    const tracks = activeProbe.audioTracks || [];
    const chosen = tracks.find(t => t.index === trackIdx);
    if (!chosen) return;

    activeAudioTrack = trackIdx;
    document.getElementById('audioBtnLabel').textContent = `Audio: ${chosen.shortLabel}`;
    showToast(`Audio: ${chosen.title}`);

    const cur = streamOffsetSec + (document.getElementById('videoEl').currentTime || 0);
    startHlsSession(cur);
  }

  function openSpeedPopup() {
    document.getElementById('modalTitle').textContent = 'Playback Speed';
    const list = document.getElementById('modalList');
    list.innerHTML = SPEED_OPTIONS.map(opt => `
      <div class="modal-option ${opt.value === activeSpeed ? 'selected' : ''}" role="button" tabindex="0" onclick="selectPlaybackSpeed(${opt.value})">
        <div class="opt-main">
          <div class="opt-title">${escapeHtml(opt.label)}</div>
          <div class="opt-sub">${escapeHtml(opt.sub)}</div>
        </div>
        <div class="opt-check">✓</div>
      </div>
    `).join('');
    document.getElementById('modalBackdrop').classList.add('open');
  }

  function selectPlaybackSpeed(val) {
    closeModal();
    activeSpeed = val;
    const video = document.getElementById('videoEl');
    video.playbackRate = val;
    document.getElementById('speedBtn').textContent = `${val}x`;
    showToast(`Speed ${val}x`);
  }

  function closeModal() {
    document.getElementById('modalBackdrop').classList.remove('open');
  }

  /* ============================================================
     PLAYBACK CONTROLS & TIMELINE
     ============================================================ */
  const videoEl = document.getElementById('videoEl');

  videoEl.addEventListener('loadedmetadata', () => {
    if (videoEl.videoHeight > 0) {
      const h = videoEl.videoHeight;
      const label = h >= 2160 ? '2160p 4K' : (h >= 1440 ? '1440p QHD' : (h >= 1080 ? '1080p FHD' : (h >= 720 ? '720p HD' : (h >= 480 ? '480p SD' : `${h}p`))));
      updateQualityBadge(label);
    }
  });

  videoEl.addEventListener('playing', () => {
    setLoader(false);
    document.getElementById('playBtn').textContent = 'Pause';
  });

  videoEl.addEventListener('pause', () => {
    document.getElementById('playBtn').textContent = 'Play';
  });

  videoEl.addEventListener('waiting', () => {
    setLoader(true, 'Buffering...');
  });

  videoEl.addEventListener('ended', () => {
    if (isPlayingSeriesFolder() && activeIndex < activePlayerList.length - 1) {
      showToast('Playing next episode...');
      playNextEpisode();
    }
  });

  videoEl.addEventListener('timeupdate', () => {
    const total = activeProbe.duration || (isFinite(videoEl.duration) ? streamOffsetSec + videoEl.duration : 0);
    const current = streamOffsetSec + (videoEl.currentTime || 0);
    document.getElementById('clockText').textContent = `${formatClock(current)} / ${total > 0 ? formatClock(total) : '--:--'}`;

    if (total > 0) {
      const pct = Math.min(100, Math.max(0, (current / total) * 100));
      document.getElementById('seekProgress').style.width = `${pct}%`;
    }

    if (activeMedia && Math.abs(current - lastSavedTick) >= 5) {
      lastSavedTick = current;
      localStorage.setItem(progressKey(activeMedia.serverId, activeMedia.path), JSON.stringify({ pos: current, dur: total }));
    }
  });

  function jumpToPosition(targetSec) {
    const relTarget = targetSec - streamOffsetSec;
    if (relTarget >= 0 && videoEl.seekable && videoEl.seekable.length > 0) {
      const bufEnd = videoEl.seekable.end(videoEl.seekable.length - 1);
      if (relTarget <= bufEnd) {
        videoEl.currentTime = relTarget;
        return;
      }
    }
    startHlsSession(targetSec);
  }

  function seekFromBar(e) {
    const total = activeProbe.duration || (isFinite(videoEl.duration) ? streamOffsetSec + videoEl.duration : 0);
    if (!total || total <= 0) return;
    const rect = document.getElementById('seekArea').getBoundingClientRect();
    const ratio = Math.min(1, Math.max(0, (e.clientX - rect.left) / rect.width));
    jumpToPosition(ratio * total);
  }

  function skipBy(delta) {
    const total = activeProbe.duration || 0;
    const current = streamOffsetSec + (videoEl.currentTime || 0);
    const target = Math.max(0, total > 0 ? Math.min(total - 2, current + delta) : current + delta);
    jumpToPosition(target);
  }

  function togglePlayPause() {
    if (videoEl.paused) videoEl.play().catch(() => {});
    else videoEl.pause();
  }

  let savedVol = 1;
  function setVolume(val) {
    const num = Number(val);
    videoEl.volume = num;
    videoEl.muted = num === 0;
    if (num > 0) savedVol = num;
    updateVolumeIcon();
  }

  function toggleMute() {
    if (videoEl.muted || videoEl.volume === 0) {
      videoEl.muted = false;
      videoEl.volume = savedVol || 1;
      document.getElementById('volRange').value = String(videoEl.volume);
    } else {
      savedVol = videoEl.volume || 1;
      videoEl.muted = true;
      document.getElementById('volRange').value = '0';
    }
    updateVolumeIcon();
  }

  function updateVolumeIcon() {
    const icon = document.getElementById('volIcon');
    if (videoEl.muted || videoEl.volume === 0) {
      icon.innerHTML = `<polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/>`;
    } else {
      icon.innerHTML = `<polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/>`;
    }
  }

  function closePlayer() {
    if (isFullscreenMode) {
      exitFullscreenMode(false);
    }
    closeModal();
    if (hlsInstance) {
      hlsInstance.destroy();
      hlsInstance = null;
    }
    videoEl.pause();
    videoEl.removeAttribute('src');
    videoEl.load();

    if (activeSessionId && activeMedia && activeMedia.serverUrl) {
      fetch(`${activeMedia.serverUrl}/api/stop?id=${encodeURIComponent(activeSessionId)}`).catch(() => {});
      activeSessionId = '';
    }

    activeMedia = null;
    setLoader(false);
    document.getElementById('playerScreen').classList.remove('open');
    renderCurrentScreen();
  }

  function openExternalVLC() {
    if (!activeMedia || !activeMedia.serverUrl) return;
    window.location.href = `${activeMedia.serverUrl}/api/playlist?path=${encodeURIComponent(activeMedia.path)}`;
    showToast('Playlist downloaded — open with VLC');
  }

  function formatClock(sec) {
    const s = Math.floor(sec || 0);
    const h = Math.floor(s / 3600);
    const m = Math.floor((s % 3600) / 60);
    const r = s % 60;
    if (h > 0) return `${h}:${String(m).padStart(2, '0')}:${String(r).padStart(2, '0')}`;
    return `${String(m).padStart(2, '0')}:${String(r).padStart(2, '0')}`;
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
  }

  function escapeJs(s) {
    return String(s).replace(/\\/g, '\\\\').replace(/'/g, "\\'");
  }

  document.addEventListener('keydown', (e) => {
    if (!document.getElementById('playerScreen').classList.contains('open')) return;
    if (e.key === 'Escape') {
      if (document.getElementById('modalBackdrop').classList.contains('open')) closeModal();
      else if (isFullscreenMode) exitFullscreenMode(false);
      else closePlayer();
    } else if (e.key === ' ' && document.activeElement.getAttribute('role') !== 'button') {
      e.preventDefault();
      togglePlayPause();
    } else if (e.key === 'ArrowRight') skipBy(10);
    else if (e.key === 'ArrowLeft') skipBy(-10);
  });
</script>
</body>
</html>
