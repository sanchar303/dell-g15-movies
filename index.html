<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">

  <title>Dell G15 Movies</title>
  <meta name="description" content="Dell G15 Movies — Stream movies and series live across hosted Windows devices.">
  <meta name="author" content="Sanchar Koirala">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Dell G15 Movies">
  <meta name="theme-color" content="#e3e8ef" id="metaThemeColor">

  <link rel="icon" type="image/png" sizes="32x32" href="favicon.png">
  <link rel="apple-touch-icon" href="favicon.png">

  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.15/dist/hls.min.js"></script>

  <style>
    /* ============================================================
       THEME 1 (LIGHT): SOFT COOL GREY, STEEL BLUE & NAVY BLUE
       ============================================================ */
    :root[data-theme="light"] {
      --bg: #e3e8ef;
      --surface: #ebf0f6;
      --surface-alt: #f3f7fc;
      --neu-out: 7px 7px 15px #c1cad6, -7px -7px 15px #ffffff;
      --neu-out-sm: 4px 4px 9px #c1cad6, -4px -4px 9px #ffffff;
      --neu-in: inset 4px 4px 8px #c1cad6, inset -4px -4px 8px #ffffff;
      --stroke: rgba(255, 255, 255, 0.72);
      --divider: rgba(16, 35, 60, 0.08);
      --text: #10233c;
      --text-2: #445a74;
      --text-muted: #6c8099;
      --steel: #2f6394;
      --steel-bright: #3d79b0;
      --steel-soft: rgba(47, 99, 148, 0.12);
      --navy: #142b47;
      --navy-soft: rgba(20, 43, 71, 0.1);
      --brand-grad: linear-gradient(135deg, #2f6394 0%, #10233c 100%);
      --brand-shadow: 0 6px 16px rgba(16, 35, 60, 0.25);
      --green: #169c5b;
    }

    /* ============================================================
       THEME 2 (DARK): DEEP NAVY, MIDNIGHT SLATE & LUMINOUS STEEL BLUE
       ============================================================ */
    :root[data-theme="dark"] {
      --bg: #0c1320;
      --surface: #121c2e;
      --surface-alt: #17243b;
      --neu-out: 7px 7px 16px #060a12, -6px -6px 14px #1a2842;
      --neu-out-sm: 4px 4px 10px #060a12, -4px -4px 10px #1a2842;
      --neu-in: inset 4px 4px 9px #060a12, inset -4px -4px 9px #1a2842;
      --stroke: rgba(139, 188, 232, 0.08);
      --divider: rgba(139, 188, 232, 0.09);
      --text: #edf2f8;
      --text-2: #9db2cc;
      --text-muted: #69809c;
      --steel: #5b9bd5;
      --steel-bright: #75b0e6;
      --steel-soft: rgba(91, 155, 213, 0.16);
      --navy: #8bbce8;
      --navy-soft: rgba(139, 188, 232, 0.12);
      --brand-grad: linear-gradient(135deg, #5b9bd5 0%, #244b78 100%);
      --brand-shadow: 0 6px 18px rgba(6, 10, 18, 0.55);
      --green: #2ecc80;
    }

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100dvh;
      height: var(--app-height, 100dvh);
      max-height: 100dvh;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
      font-size: 14px;
      overflow: hidden;
      overscroll-behavior: none;
      touch-action: manipulation;
    }

    body {
      display: flex;
      flex-direction: column;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px);
      padding-left: env(safe-area-inset-left, 0px);
      padding-right: env(safe-area-inset-right, 0px);
      transition: background 0.2s ease, color 0.2s ease;
    }

    /* ============================================================
       ONE UI + iOS FILES HEADER BAR
       ============================================================ */
    .top-bar {
      padding: 12px 18px 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-shrink: 0;
      z-index: 20;
    }

    .brand-box {
      display: flex;
      align-items: center;
      gap: 11px;
      cursor: pointer;
      flex-shrink: 0;
    }

    .squircle-logo {
      width: 40px;
      height: 40px;
      border-radius: 14px;
      background: var(--brand-grad);
      box-shadow: var(--brand-shadow);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      flex-shrink: 0;
    }

    .brand-meta {
      display: flex;
      flex-direction: column;
    }

    .brand-title {
      font-size: 16.5px;
      font-weight: 800;
      letter-spacing: -0.2px;
      color: var(--text);
      line-height: 1.15;
    }

    .host-pill-status {
      margin-top: 2px;
      font-size: 11.5px;
      font-weight: 600;
      color: var(--text-2);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 7px var(--green);
      display: inline-block;
    }
    .status-dot.off {
      background: var(--text-muted);
      box-shadow: none;
    }

    .top-controls {
      display: flex;
      align-items: center;
      gap: 9px;
      flex: 1;
      justify-content: flex-end;
      min-width: 0;
    }

    .search-well {
      width: 100%;
      max-width: 270px;
      height: 38px;
      border-radius: 19px;
      background: var(--surface);
      box-shadow: var(--neu-in);
      border: 1px solid var(--stroke);
      padding: 0 14px;
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--text-2);
    }
    .search-well:focus-within {
      border-color: var(--steel);
    }
    .search-well input {
      width: 100%;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text);
      font-size: 13px;
      font-weight: 500;
      font-family: inherit;
    }
    .search-well input::placeholder {
      color: var(--text-muted);
    }

    .morph-btn {
      height: 38px;
      padding: 0 14px;
      border-radius: 19px;
      background: var(--surface);
      box-shadow: var(--neu-out-sm);
      border: 1px solid var(--stroke);
      color: var(--text);
      font-size: 12.5px;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      cursor: pointer;
      flex-shrink: 0;
      transition: transform 0.12s ease, box-shadow 0.12s ease, color 0.12s ease;
    }
    .morph-btn:hover { color: var(--steel); }
    .morph-btn:active {
      transform: scale(0.96);
      box-shadow: var(--neu-in);
    }
    .morph-btn.icon-sq {
      width: 38px;
      padding: 0;
      border-radius: 14px;
    }
    .morph-btn.accent {
      background: var(--brand-grad);
      color: #ffffff;
      border-color: transparent;
      box-shadow: var(--brand-shadow);
    }

    /* ============================================================
       ONE UI / iOS FILES FILTER RIBBON
       ============================================================ */
    .filter-bar {
      padding: 4px 18px 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
      flex-shrink: 0;
    }

    .segmented-group {
      display: inline-flex;
      align-items: center;
      padding: 3px;
      border-radius: 16px;
      background: var(--surface);
      box-shadow: var(--neu-in);
      border: 1px solid var(--stroke);
      gap: 3px;
    }

    .seg-tab {
      height: 30px;
      padding: 0 13px;
      border-radius: 13px;
      font-size: 12px;
      font-weight: 700;
      color: var(--text-2);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      cursor: pointer;
      transition: 0.15s ease;
    }
    .seg-tab:hover { color: var(--text); }
    .seg-tab.active {
      background: var(--surface-alt);
      box-shadow: var(--neu-out-sm);
      color: var(--steel);
    }

    .select-filters {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .morph-select-wrap {
      height: 36px;
      padding: 0 12px;
      border-radius: 14px;
      background: var(--surface);
      box-shadow: var(--neu-out-sm);
      border: 1px solid var(--stroke);
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--text-2);
      font-size: 12px;
      font-weight: 700;
    }

    .morph-select-wrap select {
      background: transparent;
      border: none;
      outline: none;
      color: var(--text);
      font-size: 12px;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
    }
    .morph-select-wrap select option {
      background: var(--surface);
      color: var(--text);
    }

    /* ============================================================
       MAIN SCROLLABLE EXPLORER WORKSPACE
       ============================================================ */
    .explorer-scroll {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding: 4px 18px 20px;
    }
    .explorer-scroll::-webkit-scrollbar { width: 5px; }
    .explorer-scroll::-webkit-scrollbar-thumb {
      background: var(--divider);
      border-radius: 99px;
    }

    .category-section {
      margin-bottom: 22px;
    }

    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 4px 4px 10px;
    }

    .section-title-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .section-heading {
      font-size: 15px;
      font-weight: 800;
      color: var(--text);
      letter-spacing: -0.2px;
    }

    .count-badge {
      padding: 2px 9px;
      border-radius: 999px;
      background: var(--steel-soft);
      color: var(--steel);
      font-size: 11.5px;
      font-weight: 800;
    }

    /* iOS Files Squircle Grid */
    .files-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(215px, 1fr));
      gap: 15px;
    }

    .file-tile {
      background: var(--surface);
      box-shadow: var(--neu-out);
      border: 1px solid var(--stroke);
      border-radius: 24px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      cursor: pointer;
      transition: transform 0.14s ease, border-color 0.14s ease;
    }
    .file-tile:hover {
      transform: translateY(-2px);
      border-color: var(--steel);
    }
    .file-tile:active {
      transform: scale(0.985);
      box-shadow: var(--neu-in);
    }

    .thumb-frame {
      width: 100%;
      aspect-ratio: 16 / 10;
      border-radius: 16px;
      overflow: hidden;
      position: relative;
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.14);
      background: var(--navy);
    }
    .thumb-frame svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    .tile-body {
      display: flex;
      flex-direction: column;
      gap: 5px;
      padding: 0 2px;
    }

    .tile-name {
      font-size: 13.5px;
      font-weight: 700;
      color: var(--text);
      line-height: 1.3;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      word-break: break-word;
    }

    .tile-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      flex-wrap: wrap;
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
    }

    .host-tag {
      padding: 2px 8px;
      border-radius: 8px;
      background: var(--navy-soft);
      color: var(--navy);
      font-size: 10.5px;
      font-weight: 800;
      max-width: 115px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .resume-tag {
      color: var(--steel);
      font-weight: 800;
    }

    /* Samsung One UI Grouped List View */
    .oneui-list-card {
      background: var(--surface);
      box-shadow: var(--neu-out);
      border: 1px solid var(--stroke);
      border-radius: 26px;
      overflow: hidden;
    }

    .oneui-row {
      padding: 11px 15px;
      display: flex;
      align-items: center;
      gap: 13px;
      cursor: pointer;
      border-bottom: 1px solid var(--divider);
      transition: background 0.12s ease;
    }
    .oneui-row:last-child { border-bottom: none; }
    .oneui-row:hover { background: var(--steel-soft); }
    .oneui-row:active { background: var(--navy-soft); }

    .row-thumb {
      width: 68px;
      height: 46px;
      border-radius: 13px;
      overflow: hidden;
      flex-shrink: 0;
      box-shadow: var(--neu-out-sm);
    }
    .row-thumb svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    .row-info {
      flex: 1;
      min-width: 0;
    }

    .row-name {
      font-size: 13.5px;
      font-weight: 700;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .row-sub {
      margin-top: 4px;
      display: flex;
      align-items: center;
      gap: 7px;
      flex-wrap: wrap;
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
    }

    .row-chevron {
      width: 30px;
      height: 30px;
      border-radius: 11px;
      background: var(--surface-alt);
      box-shadow: var(--neu-out-sm);
      color: var(--steel);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      font-weight: 800;
    }

    /* Series Header Card (Inside a Series Folder) */
    .series-head-card {
      background: var(--surface);
      box-shadow: var(--neu-out);
      border: 1px solid var(--stroke);
      border-radius: 26px;
      padding: 16px 18px;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      flex-wrap: wrap;
    }

    .series-head-left {
      display: flex;
      align-items: center;
      gap: 14px;
      min-width: 0;
      flex: 1;
    }

    .series-head-thumb {
      width: 84px;
      height: 56px;
      border-radius: 16px;
      overflow: hidden;
      flex-shrink: 0;
      box-shadow: var(--neu-out-sm);
    }
    .series-head-thumb svg { width: 100%; height: 100%; display: block; }

    .empty-card {
      max-width: 380px;
      margin: 44px auto;
      background: var(--surface);
      box-shadow: var(--neu-out);
      border: 1px solid var(--stroke);
      border-radius: 28px;
      padding: 30px 22px;
      text-align: center;
    }
    .empty-card h3 {
      margin: 0 0 6px;
      font-size: 16.5px;
      font-weight: 800;
    }
    .empty-card p {
      margin: 0 0 18px;
      color: var(--text-2);
      font-size: 12.5px;
      line-height: 1.45;
    }

    footer {
      padding: 7px 18px 9px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
      flex-shrink: 0;
    }

    /* ============================================================
       CINEMA PLAYER & EXCLUSIVE FULLSCREEN MODE
       ============================================================ */
    .player-screen {
      display: none;
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100dvh;
      height: var(--app-height, 100dvh);
      max-height: 100dvh;
      background: #070b14;
      z-index: 100;
      flex-direction: column;
      overflow: hidden;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px);
      padding-left: env(safe-area-inset-left, 0px);
      padding-right: env(safe-area-inset-right, 0px);
    }
    .player-screen.open { display: flex; }

    .player-header {
      padding: 9px 15px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      background: #0e1626;
      border-bottom: 1px solid rgba(139, 188, 232, 0.12);
      flex-shrink: 0;
      min-height: 50px;
    }

    .player-title-wrap {
      display: flex;
      align-items: center;
      gap: 9px;
      min-width: 0;
      flex: 1;
    }

    .player-name {
      font-weight: 700;
      font-size: 14px;
      color: #edf2f8;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      min-width: 0;
    }

    .quality-badge {
      padding: 4px 10px;
      border-radius: 999px;
      background: rgba(91, 155, 213, 0.18);
      border: 1px solid rgba(91, 155, 213, 0.36);
      color: #8bbce8;
      font-size: 11px;
      font-weight: 800;
      white-space: nowrap;
      flex-shrink: 0;
      pointer-events: none;
    }

    .player-pills {
      display: flex;
      align-items: center;
      gap: 7px;
      flex-shrink: 0;
    }

    .p-pill {
      height: 33px;
      padding: 0 13px;
      border-radius: 14px;
      background: rgba(139, 188, 232, 0.1);
      border: 1px solid rgba(139, 188, 232, 0.14);
      color: #edf2f8;
      font-size: 12px;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      cursor: pointer;
      white-space: nowrap;
      transition: transform 0.12s ease, background 0.15s ease;
    }
    .p-pill:hover:not(.disabled) { background: rgba(139, 188, 232, 0.2); }
    .p-pill:active:not(.disabled) { transform: scale(0.95); }
    .p-pill.disabled { opacity: 0.32; pointer-events: none; }
    .p-pill.steel-pill {
      background: linear-gradient(135deg, #3b74a8, #1f446e);
      border-color: rgba(139, 188, 232, 0.3);
      color: #ffffff;
    }

    .player-workspace {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: row;
      overflow: hidden;
      width: 100%;
    }

    .player-main {
      flex: 1;
      min-width: 0;
      min-height: 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: #000000;
    }

    .video-stage {
      flex: 1;
      min-height: 0;
      width: 100%;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000000;
      overflow: hidden;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      outline: none;
      pointer-events: none;
      display: block;
    }

    /* Exclusive Fullscreen Button — Hidden in Normal Mode, Active Only in Fullscreen Mode */
    .fs-exit-btn {
      display: none;
      position: absolute;
      top: max(16px, env(safe-area-inset-top, 16px));
      right: max(18px, env(safe-area-inset-right, 18px));
      z-index: 140;
      height: 40px;
      padding: 0 16px;
      border-radius: 16px;
      background: rgba(12, 19, 32, 0.82);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(139, 188, 232, 0.3);
      color: #edf2f8;
      font-size: 12.5px;
      font-weight: 700;
      align-items: center;
      gap: 7px;
      cursor: pointer;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.65);
      transition: opacity 0.2s ease, transform 0.2s ease, background 0.15s ease;
    }
    .fs-exit-btn:hover {
      background: #2f6394;
      color: #ffffff;
    }
    .fs-exit-btn:active {
      transform: scale(0.95);
    }

    /* Exclusive Fullscreen State */
    .player-screen.fs-active {
      padding: 0 !important;
      background: #000000 !important;
    }
    .player-screen.fs-active .player-header,
    .player-screen.fs-active .player-controls,
    .player-screen.fs-active .episode-pane {
      display: none !important;
    }
    .player-screen.fs-active .player-workspace,
    .player-screen.fs-active .player-main {
      width: 100% !important;
      height: 100% !important;
      max-height: none !important;
    }
    .player-screen.fs-active .video-stage {
      position: fixed !important;
      inset: 0 !important;
      width: 100vw !important;
      height: 100dvh !important;
      max-height: none !important;
      aspect-ratio: auto !important;
      z-index: 125 !important;
      cursor: pointer;
    }
    .player-screen.fs-active.fs-rotate-fallback .video-stage {
      width: 100dvh !important;
      height: 100vw !important;
      top: 50% !important;
      left: 50% !important;
      right: auto !important;
      bottom: auto !important;
      transform: translate(-50%, -50%) rotate(90deg) !important;
    }
    .player-screen.fs-active .fs-exit-btn {
      display: inline-flex;
      opacity: 1;
      pointer-events: auto;
    }
    .player-screen.fs-active .fs-exit-btn.fs-hidden {
      opacity: 0;
      pointer-events: none;
      transform: translateY(-8px);
    }

    .loader-box {
      position: absolute;
      inset: 0;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      background: rgba(7, 11, 20, 0.45);
      pointer-events: none;
      z-index: 15;
    }
    .loader-box.show { display: flex; }
    .loader-circle {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: 3px solid rgba(139, 188, 232, 0.18);
      border-top-color: #5b9bd5;
      animation: spin 0.72s linear infinite;
    }
    .loader-label {
      padding: 6px 14px;
      border-radius: 14px;
      background: rgba(14, 22, 38, 0.9);
      border: 1px solid rgba(139, 188, 232, 0.16);
      color: #edf2f8;
      font-size: 12px;
      font-weight: 600;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .player-controls {
      padding: 9px 15px 11px;
      background: #0e1626;
      border-top: 1px solid rgba(139, 188, 232, 0.12);
      display: flex;
      flex-direction: column;
      gap: 8px;
      flex-shrink: 0;
    }

    .seek-area {
      height: 18px;
      display: flex;
      align-items: center;
      cursor: pointer;
      touch-action: none;
    }
    .seek-bar {
      width: 100%;
      height: 5px;
      border-radius: 999px;
      background: rgba(139, 188, 232, 0.18);
      position: relative;
      transition: height 0.12s ease;
    }
    .seek-area:hover .seek-bar,
    .seek-area:active .seek-bar { height: 7px; }
    .seek-progress {
      height: 100%;
      width: 0%;
      border-radius: 999px;
      background: linear-gradient(90deg, #2f6394, #6aa9e3);
      position: relative;
    }
    .seek-knob {
      position: absolute;
      right: -7px;
      top: 50%;
      transform: translateY(-50%);
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #edf2f8;
      box-shadow: 0 0 10px rgba(91, 155, 213, 0.95);
    }

    .ctrl-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      min-width: 0;
    }
    .ctrl-group {
      display: flex;
      align-items: center;
      gap: 7px;
      min-width: 0;
    }
    .clock-text {
      font-family: ui-monospace, Consolas, monospace;
      font-size: 12px;
      color: #9db2cc;
      padding: 0 4px;
      white-space: nowrap;
    }

    .vol-box {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      background: rgba(139, 188, 232, 0.1);
      border: 1px solid rgba(139, 188, 232, 0.14);
      border-radius: 14px;
      height: 33px;
      padding: 0 10px 0 8px;
    }
    .vol-mute {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: #edf2f8;
      cursor: pointer;
    }
    .vol-range {
      width: 66px;
      accent-color: #5b9bd5;
      cursor: pointer;
      margin: 0;
    }

    /* Series Episode List Alongside Video */
    .episode-pane {
      width: 295px;
      flex-shrink: 0;
      background: #0c1320;
      border-left: 1px solid rgba(139, 188, 232, 0.12);
      display: none;
      flex-direction: column;
      min-height: 0;
      overflow: hidden;
    }
    .episode-pane.show { display: flex; }

    .ep-pane-head {
      padding: 12px 14px;
      border-bottom: 1px solid rgba(139, 188, 232, 0.12);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-shrink: 0;
    }
    .ep-pane-title {
      font-size: 13px;
      font-weight: 700;
      color: #edf2f8;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .ep-pane-count {
      font-size: 11px;
      font-weight: 700;
      color: #8bbce8;
      background: rgba(91, 155, 213, 0.16);
      padding: 3px 9px;
      border-radius: 10px;
      flex-shrink: 0;
    }

    .ep-list {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding: 8px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .ep-list::-webkit-scrollbar { width: 4px; }
    .ep-list::-webkit-scrollbar-thumb { background: rgba(139, 188, 232, 0.18); border-radius: 99px; }

    .ep-card {
      padding: 10px 11px;
      border-radius: 16px;
      background: rgba(139, 188, 232, 0.05);
      border: 1px solid rgba(139, 188, 232, 0.08);
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      transition: background 0.14s ease, border-color 0.14s ease;
    }
    .ep-card:hover { background: rgba(139, 188, 232, 0.12); }
    .ep-card.active {
      background: rgba(91, 155, 213, 0.18);
      border-color: rgba(91, 155, 213, 0.5);
    }

    .ep-num {
      width: 28px;
      height: 28px;
      border-radius: 10px;
      background: rgba(139, 188, 232, 0.12);
      color: #9db2cc;
      font-size: 11.5px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .ep-card.active .ep-num {
      background: #3b74a8;
      color: #ffffff;
    }

    .ep-info { flex: 1; min-width: 0; }
    .ep-name {
      font-size: 12.5px;
      font-weight: 600;
      color: #edf2f8;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .ep-meta {
      margin-top: 3px;
      font-size: 11px;
      color: #69809c;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .ep-playing-tag { color: #75b0e6; font-weight: 700; }

    /* Popup Modal */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(6, 10, 18, 0.76);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 18px;
      z-index: 180;
    }
    .modal-backdrop.open { display: flex; }

    .modal-sheet {
      width: 100%;
      max-width: 390px;
      max-height: 76dvh;
      background: #121c2e;
      border: 1px solid rgba(139, 188, 232, 0.18);
      border-radius: 26px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.85);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      animation: popIn 0.15s ease-out;
    }
    @keyframes popIn {
      from { opacity: 0; transform: scale(0.95) translateY(8px); }
      to { opacity: 1; transform: scale(1) translateY(0); }
    }

    .modal-head {
      padding: 14px 18px;
      border-bottom: 1px solid rgba(139, 188, 232, 0.12);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    .modal-title { font-size: 14.5px; font-weight: 700; color: #edf2f8; }
    .modal-close {
      width: 30px;
      height: 30px;
      border-radius: 11px;
      background: rgba(139, 188, 232, 0.12);
      color: #9db2cc;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
    }

    .modal-list {
      padding: 10px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .modal-option {
      padding: 11px 14px;
      border-radius: 16px;
      background: rgba(139, 188, 232, 0.06);
      border: 1px solid rgba(139, 188, 232, 0.09);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      cursor: pointer;
    }
    .modal-option:hover { background: rgba(139, 188, 232, 0.13); }
    .modal-option.selected {
      background: rgba(91, 155, 213, 0.2);
      border-color: rgba(91, 155, 213, 0.55);
    }

    .opt-main { min-width: 0; flex: 1; }
    .opt-title {
      font-size: 13px;
      font-weight: 600;
      color: #edf2f8;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .opt-sub { margin-top: 2px; font-size: 11px; color: #9db2cc; }
    .opt-check {
      width: 22px;
      height: 22px;
      border-radius: 8px;
      background: #3b74a8;
      color: #ffffff;
      font-size: 12px;
      font-weight: 700;
      display: none;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .modal-option.selected .opt-check { display: inline-flex; }

    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(14px);
      background: #142b47;
      color: #edf2f8;
      border: 1px solid rgba(139, 188, 232, 0.24);
      padding: 9px 18px;
      border-radius: 16px;
      font-size: 12px;
      font-weight: 600;
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.45);
      opacity: 0;
      pointer-events: none;
      transition: all 0.2s ease;
      z-index: 220;
      white-space: nowrap;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    /* ============================================================
       RESPONSIVE MOBILE PORTRAIT & LANDSCAPE FIT
       ============================================================ */
    @media (max-width: 820px) {
      .top-bar { padding: 10px 14px 6px; flex-wrap: wrap; gap: 8px; }
      .top-controls { flex-basis: 100%; justify-content: space-between; }
      .search-well { max-width: none; flex: 1; height: 36px; }
      .morph-btn { height: 36px; padding: 0 12px; font-size: 12px; }
      .morph-btn.icon-sq { width: 36px; }
      .filter-bar { padding: 4px 14px 8px; gap: 7px; }
      .explorer-scroll { padding: 4px 14px 14px; }
      .files-grid { grid-template-columns: repeat(2, 1fr); gap: 11px; }
      .file-tile { padding: 10px; border-radius: 20px; }
      .hide-sm { display: none; }
      footer { padding: 6px 14px 8px; font-size: 10.5px; }
    }

    @media (max-width: 900px) and (orientation: portrait) {
      .player-screen:not(.fs-active) .player-header {
        padding: 8px 12px;
        flex-wrap: wrap;
        gap: 6px;
        min-height: 0;
      }
      .player-screen:not(.fs-active) .player-title-wrap { flex-basis: 100%; }
      .player-screen:not(.fs-active) .player-pills {
        width: 100%;
        justify-content: flex-start;
        overflow-x: auto;
        gap: 6px;
      }
      .player-screen:not(.fs-active) .player-pills::-webkit-scrollbar { display: none; }
      .player-screen:not(.fs-active) .p-pill { height: 30px; padding: 0 11px; font-size: 11.5px; }

      .player-screen:not(.fs-active) .player-workspace { flex-direction: column; }
      .player-screen:not(.fs-active) .player-main { flex: none; }
      .player-screen:not(.fs-active) .player-workspace.no-episodes .player-main { flex: 1; }
      .player-screen:not(.fs-active) .player-workspace:not(.no-episodes) .video-stage {
        flex: none;
        width: 100%;
        aspect-ratio: 16 / 9;
        max-height: 34dvh;
      }
      .player-screen:not(.fs-active) .player-controls { padding: 8px 12px 10px; gap: 7px; }
      .player-screen:not(.fs-active) .ctrl-row { flex-wrap: wrap; gap: 6px; }
      .player-screen:not(.fs-active) .vol-range { width: 54px; }

      .player-screen:not(.fs-active) .episode-pane.show {
        width: 100%;
        flex: 1;
        min-height: 0;
        border-left: none;
        border-top: 1px solid rgba(139, 188, 232, 0.14);
      }
    }

    @media (orientation: landscape) and (max-height: 560px) {
      .top-bar { padding: 7px 14px 4px; }
      footer { display: none; }

      .player-screen:not(.fs-active) .player-header { padding: 5px 12px; min-height: 40px; gap: 8px; }
      .player-screen:not(.fs-active) .player-name { font-size: 13px; }
      .player-screen:not(.fs-active) .p-pill { height: 28px; padding: 0 10px; font-size: 11px; }
      .player-screen:not(.fs-active) .player-workspace { flex-direction: row; }
      .player-screen:not(.fs-active) .player-controls { padding: 5px 12px 7px; gap: 4px; }
      .player-screen:not(.fs-active) .seek-area { height: 15px; }
      .player-screen:not(.fs-active) .clock-text { font-size: 11px; }
      .player-screen:not(.fs-active) .vol-box { height: 28px; padding: 0 8px 0 6px; }
      .player-screen:not(.fs-active) .vol-range { width: 50px; }
      .player-screen:not(.fs-active) .episode-pane { width: 235px; }
    }
  </style>
</head>
<body>

  <!-- One UI / iOS Files Header -->
  <header class="top-bar">
    <div class="brand-box" role="button" tabindex="0" onclick="returnToRoot()">
      <div class="squircle-logo">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/><polygon points="10 11 15 14 10 17 10 11" fill="currentColor" stroke="none"/></svg>
      </div>
      <div class="brand-meta">
        <div class="brand-title">Dell G15 Movies</div>
        <div class="host-pill-status">
          <span class="status-dot off" id="globalLiveDot"></span>
          <span id="globalHostStatus">Offline</span>
        </div>
      </div>
    </div>

    <div class="top-controls">
      <div class="search-well">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
        <input type="text" id="searchInput" placeholder="Search..." oninput="handleSearchInput(this.value)">
      </div>

      <div class="morph-btn icon-sq" id="btnView" role="button" tabindex="0" onclick="toggleViewMode()" title="Switch Grid / List">
        <svg id="viewIconSvg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
      </div>
      <div class="morph-btn icon-sq" role="button" tabindex="0" onclick="refreshAllCatalog()" title="Refresh">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3"><path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/></svg>
      </div>
      <div class="morph-btn icon-sq" id="btnTheme" role="button" tabindex="0" onclick="toggleTheme()" title="Switch Theme">☾</div>
    </div>
  </header>

  <!-- Filter Bar: Type (Movies / Series) + Device + Size -->
  <div class="filter-bar" id="filterBar">
    <div class="segmented-group">
      <div class="seg-tab active" id="typeTab_ALL" role="button" tabindex="0" onclick="setTypeFilter('ALL')">All</div>
      <div class="seg-tab" id="typeTab_MOVIES" role="button" tabindex="0" onclick="setTypeFilter('MOVIES')">Movies</div>
      <div class="seg-tab" id="typeTab_SERIES" role="button" tabindex="0" onclick="setTypeFilter('SERIES')">Series</div>
    </div>

    <div class="select-filters">
      <div class="morph-select-wrap">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>
        <select id="deviceSelect" onchange="setHostFilter(this.value)" aria-label="Device Filter">
          <option value="ALL">All Devices</option>
        </select>
      </div>

      <div class="morph-select-wrap">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/></svg>
        <select id="sizeSelect" onchange="setSizeFilter(this.value)" aria-label="Size Filter">
          <option value="ALL">Any Size</option>
          <option value="SMALL">&lt; 1 GB</option>
          <option value="MEDIUM">1 – 3 GB</option>
          <option value="LARGE">&gt; 3 GB</option>
        </select>
      </div>
    </div>
  </div>

  <!-- Main File Explorer Scroll Area -->
  <main class="explorer-scroll" id="explorerScroll"></main>

  <footer>
    <span id="footerStats">0 items</span>
    <span>© 2026 Sanchar Koirala</span>
  </footer>

  <!-- Cinema Player -->
  <div class="player-screen" id="playerScreen">
    <div class="player-header">
      <div class="player-title-wrap">
        <div class="player-name" id="playerName">Video</div>
        <div class="quality-badge" id="qualityBadge">HD · Auto</div>
      </div>

      <div class="player-pills">
        <div class="p-pill" id="audioBtn" role="button" tabindex="0" onclick="openAudioPopup()" style="display:none;">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/></svg>
          <span id="audioBtnLabel">Audio</span>
        </div>
        <div class="p-pill" id="prevEpBtn" role="button" tabindex="0" onclick="playPrevEpisode()" style="display:none;">‹ Prev</div>
        <div class="p-pill" id="nextEpBtn" role="button" tabindex="0" onclick="playNextEpisode()" style="display:none;">Next ›</div>
        <div class="p-pill steel-pill" role="button" tabindex="0" onclick="openExternalVLC()">VLC</div>
        <div class="p-pill" role="button" tabindex="0" onclick="closePlayer()">Close</div>
      </div>
    </div>

    <div class="player-workspace no-episodes" id="playerWorkspace">
      <div class="player-main">
        <div class="video-stage" id="videoStage" onclick="handleVideoStageTap(event)">
          <video id="videoEl" playsinline webkit-playsinline preload="auto"></video>

          <!-- Exclusive Fullscreen Exit Button (Shown ONLY in Fullscreen Mode, toggled by tapping video screen) -->
          <div class="fs-exit-btn" id="fsExitBtn" role="button" tabindex="0" onclick="handleExitFullscreenClick(event)">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M8 3v3a2 2 0 0 1-2 2H3m18 0h-3a2 2 0 0 1-2-2V3m0 18v-3a2 2 0 0 1 2-2h3M3 16h3a2 2 0 0 1 2 2v3"/></svg>
            <span>Exit Fullscreen</span>
          </div>

          <div class="loader-box" id="loaderBox">
            <div class="loader-circle"></div>
            <div class="loader-label" id="loaderLabel">Connecting...</div>
          </div>
        </div>

        <div class="player-controls">
          <div class="seek-area" id="seekArea" onclick="seekFromBar(event)">
            <div class="seek-bar">
              <div class="seek-progress" id="seekProgress">
                <div class="seek-knob"></div>
              </div>
            </div>
          </div>

          <div class="ctrl-row">
            <div class="ctrl-group">
              <div class="p-pill steel-pill" id="playBtn" role="button" tabindex="0" onclick="togglePlayPause()">Pause</div>
              <div class="p-pill" role="button" tabindex="0" onclick="skipBy(-10)">-10s</div>
              <div class="p-pill" role="button" tabindex="0" onclick="skipBy(10)">+10s</div>
              <div class="clock-text" id="clockText">00:00 / 00:00</div>
            </div>

            <div class="ctrl-group">
              <div class="p-pill" id="speedBtn" role="button" tabindex="0" onclick="openSpeedPopup()">1x</div>
              <div class="vol-box">
                <div class="vol-mute" id="muteBtn" role="button" tabindex="0" onclick="toggleMute()" title="Mute/Unmute">
                  <svg id="volIcon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/></svg>
                </div>
                <input type="range" class="vol-range" id="volRange" min="0" max="1" step="0.05" value="1" oninput="setVolume(this.value)">
              </div>
              <div class="p-pill" id="fsEnterBtn" role="button" tabindex="0" onclick="enterFullscreenMode()" title="Fullscreen">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3"><path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/></svg>
                <span>Fullscreen</span>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- Series Episodes List Alongside Video -->
      <aside class="episode-pane" id="episodePane">
        <div class="ep-pane-head">
          <div class="ep-pane-title" id="epPaneTitle">Episodes</div>
          <div class="ep-pane-count" id="epPaneCount">1 / 1</div>
        </div>
        <div class="ep-list" id="epList"></div>
      </aside>
    </div>
  </div>

  <!-- Popup Modal -->
  <div class="modal-backdrop" id="modalBackdrop" onclick="closeModal()">
    <div class="modal-sheet" onclick="event.stopPropagation()">
      <div class="modal-head">
        <div class="modal-title" id="modalTitle">Select</div>
        <div class="modal-close" role="button" tabindex="0" onclick="closeModal()">✕</div>
      </div>
      <div class="modal-list" id="modalList"></div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  /* ============================================================
     CODED PROCEDURAL THUMBNAIL GENERATOR (SVG ARTWORK)
     ============================================================ */
  const THUMB_PALETTES = [
    { c1: '#1a365d', c2: '#3b74a8', accent: '#90cdf4' },
    { c1: '#10233c', c2: '#2f6394', accent: '#75b0e6' },

  ];

  function hashString(str) {
    let h = 2166136261;
    for (let i = 0; i < str.length; i++) {
      h ^= str.charCodeAt(i);
      h = Math.imul(h, 16777619);
    }
    return h >>> 0;
  }

  function getMonogram(title) {
    const words = title.replace(/[^a-zA-Z0-9\s]/g, '').trim().split(/\s+/).filter(Boolean);
    if (words.length === 0) return 'G15';
    if (words.length === 1) return words[0].slice(0, 2).toUpperCase();
    return (words[0][0] + words[1][0]).toUpperCase();
  }

  function buildCodedThumbnailSvg(item, epNumber = null) {
    const seed = hashString(`${item.cleanName}_${item.serverName}`);
    const pal = THUMB_PALETTES[seed % THUMB_PALETTES.length];
    const patternType = seed % 3;
    const isSeries = item.type === 'folder';
    const mono = epNumber !== null ? `E${String(epNumber).padStart(2, '0')}` : getMonogram(item.cleanName);

      `;
    } else if (patternType === 1) {
      motifSvg = `
        <path d="M-20 140 Q 90 60, 180 120 T 340 70 L 340 200 L -20 200 Z" fill="${pal.accent}" fill-opacity="0.11"/>
        <path d="M-20 165 Q 110 95, 210 145 T 340 105 L 340 200 L -20 200 Z" fill="${pal.accent}" fill-opacity="0.09"/>

      motifSvg = `
        <rect x="195" y="-18" width="120" height="120" rx="28" transform="rotate(22 195 -18)" fill="${pal.accent}" fill-opacity="0.1"/>
        <rect x="220" y="18" width="95" height="95" rx="22" transform="rotate(22 220 18)" fill="none" stroke="${pal.accent}" stroke-opacity="0.18" stroke-width="2"/>
      `;
    }

    const centerGlyph = isSeries
      ? `
        <rect x="122" y="54" width="76" height="54" rx="14" fill="#ffffff" fill-opacity="0.14"/>
        <path d="M126 66 C126 60 130 56 136 56 L151 56 L157 63 L184 63 C190 63 194 67 194 73 L194 102 C194 108 190 112 184 112 L136 112 C130 112 126 108 126 102 Z" fill="#ffffff" fill-opacity="0.92"/>
      `
      : `
        <circle cx="160" cy="84" r="26" fill="#ffffff" fill-opacity="0.18"/>
        <circle cx="160" cy="84" r="20" fill="#ffffff" fill-opacity="0.94"/>
        <polygon points="155,75 170,84 155,93" fill="${pal.c1}"/>
      `;

    const gradId = `tg_${seed}`;
    return `
      <svg viewBox="0 0 320 180" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="${gradId}" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="${pal.c1}"/>
            <stop offset="100%" stop-color="${pal.c2}"/>
          </linearGradient>
        </defs>
        <rect width="320" height="180" fill="url(#${gradId})"/>
        ${motifSvg}
        <text x="18" y="160" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="44" font-weight="900" fill="#ffffff" fill-opacity="0.12" letter-spacing="-1">${escapeHtml(mono)}</text>
        ${centerGlyph}
        <rect x="14" y="14" width="66" height="24" rx="9" fill="#0c1320" fill-opacity="0.52"/>
        <text x="47" y="30" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="800" fill="#edf2f8" letter-spacing="0.4">${escapeHtml(badgeLabel)}</text>
      </svg>

  /* ============================================================

  function syncViewportLayout() {
    document.documentElement.style.setProperty('--app-height', `${window.innerHeight}px`);
    if (window.scrollY !== 0 || window.scrollX !== 0) {
      window.scrollTo(0, 0);
    }
    if (isFullscreenMode) {
      updateFullscreenRotationFallback();

  }

  function updateFullscreenRotationFallback() {
    const screenEl = document.getElementById('playerScreen');
    if (!isFullscreenMode) {
      screenEl.classList.remove('fs-rotate-fallback');
      return;
    }
    const isPortraitViewport = window.innerHeight > window.innerWidth;
    screenEl.classList.toggle('fs-rotate-fallback', !orientationLockedByPlayer && isPortraitViewport);
  }

  function unlockMobileOrientation() {
    orientationLockedByPlayer = false;
    try {
      if (screen.orientation && typeof screen.orientation.unlock === 'function') {
        screen.orientation.unlock();
      }
    } catch (e) {}
  }

  let lastAccelAngle = '';
  function handleAccelerometerMotion(e) {
    const acc = e.accelerationIncludingGravity;
    if (!acc || acc.x === null || acc.y === null) return;
    const ax = Math.abs(acc.x);
    const ay = Math.abs(acc.y);
    if (ax < 5.5 && ay < 5.5) return;
    const inferred = ax > ay ? 'landscape' : 'portrait';
    if (inferred !== lastAccelAngle) {
      lastAccelAngle = inferred;
      syncViewportLayout();
    }
  }

  syncViewportLayout();
  window.addEventListener('resize', syncViewportLayout, { passive: true });
  window.addEventListener('orientationchange', () => {
    setTimeout(syncViewportLayout, 60);

  if (screen.orientation && screen.orientation.addEventListener) {

  async function apiFetchFromServer(serverUrl, endpoint) {
    if (!serverUrl) throw new Error('Offline');
    const res = await fetch(`${serverUrl}${endpoint}`);
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);
    return data;
  }

  /* ============================================================
     MULTI-SERVER DISCOVERY & CATALOG AGGREGATION
     ============================================================ */
  db.ref('.info/serverTimeOffset').on('value', (snap) => {
    serverTimeOffsetMs = snap.val() || 0;
  });

  function reconcileServers() {
    const nowSec = Math.floor((Date.now() + serverTimeOffsetMs) / 1000);
    const list = [];

    if (latestServersObj && typeof latestServersObj === 'object') {
      Object.entries(latestServersObj).forEach(([key, srv]) => {
        if (!srv || !srv.url) return;
        const cleanUrl = String(srv.url).trim().replace(/\/+$/, '');
        if (!cleanUrl) return;
        const lastSeen = Number(srv.lastSeen || 0);
        if (lastSeen > 0 && (nowSec - lastSeen) > 85) return;
        list.push({
          id: srv.id || key,
          name: srv.name || key,
          url: cleanUrl
        });
      });
    }

    if (list.length === 0 && latestLegacyObj && latestLegacyObj.url) {
      const cleanLegacy = String(latestLegacyObj.url).trim().replace(/\/+$/, '');
      if (cleanLegacy) {
        list.push({
          id: 'default-host',
          name: 'DELL-G15',
          url: cleanLegacy
        });
      }
    }

    list.sort((a, b) => a.name.localeCompare(b.name, undefined, { numeric: true }));

    const prevSignature = onlineServers.map(s => `${s.id}:${s.url}`).join('|');
    const nextSignature = list.map(s => `${s.id}:${s.url}`).join('|');
    onlineServers = list;

    updateDeviceDropdown();

    const dot = document.getElementById('globalLiveDot');
    const status = document.getElementById('globalHostStatus');
    if (onlineServers.length === 0) {
      dot.classList.add('off');
      status.textContent = 'Offline';
      allRootItems = [];
      renderExplorer();
      return;
    }

    dot.classList.remove('off');
    status.textContent = onlineServers.length === 1
      ? onlineServers[0].name
      : `${onlineServers.length} Devices Online`;

    if (prevSignature !== nextSignature) {
      fetchAllCatalog();
    }
  }

  function updateDeviceDropdown() {
    const sel = document.getElementById('deviceSelect');
    if (hostFilterId !== 'ALL' && !onlineServers.some(s => s.id === hostFilterId)) {
      hostFilterId = 'ALL';
    }
    const opts = [`<option value="ALL">All Devices</option>`].concat(
      onlineServers.map(s => `<option value="${escapeHtml(s.id)}">${escapeHtml(s.name)}</option>`)

    sel.innerHTML = opts.join('');

  db.ref('servers').on('value', (snap) => {

  setInterval(reconcileServers, 15000);

  function parseItemBytes(item) {
    if (typeof item.size === 'number' && !isNaN(item.size)) return item.size;
    const lbl = String(item.sizeLabel || '').trim().toUpperCase();
    const m = lbl.match(/^([\d.]+)\s*(B|KB|MB|GB|TB)$/);
    if (!m) return 0;
    const num = parseFloat(m[1]);
    const unit = m[2];
    const mult = { B: 1, KB: 1024, MB: 1024 ** 2, GB: 1024 ** 3, TB: 1024 ** 4 }[unit] || 1;
    return Math.round(num * mult);
  }

  async function fetchAllCatalog() {
    if (onlineServers.length === 0) {
      allRootItems = [];
      renderExplorer();
      return;
    }

    const results = await Promise.all(
      onlineServers.map(async (srv) => {
        try {
          const data = await apiFetchFromServer(srv.url, '/api/list?path=');
          return (data.items || []).map(item => ({
            ...item,
            cleanName: cleanTitle(item.name),
            bytes: parseItemBytes(item),
            serverId: srv.id,
            serverName: srv.name,
            serverUrl: srv.url
          }));
        } catch (e) {
          return [];
        }
      })
    );

    const merged = results.flat();
    merged.sort((a, b) => a.cleanName.localeCompare(b.cleanName, undefined, { numeric: true, sensitivity: 'base' }));
    allRootItems = merged;
    renderExplorer();
  }

  function handleSearchInput(val) {

  function matchesSizeFilter(bytes) {
    if (sizeFilter === 'ALL') return true;
    const oneGb = 1024 ** 3;
    const threeGb = 3 * oneGb;
    if (sizeFilter === 'SMALL') return bytes > 0 && bytes < oneGb;
    if (sizeFilter === 'MEDIUM') return bytes >= oneGb && bytes <= threeGb;
    if (sizeFilter === 'LARGE') return bytes > threeGb;
    return true;
  }

  async function openSeriesFolder(seriesItem, scrollTop = true) {
    activeSeriesFolder = seriesItem;
    const container = document.getElementById('explorerScroll');
    container.innerHTML = `<div class="empty-card"><h3>Loading...</h3><p>${escapeHtml(seriesItem.cleanName)}</p></div>`;

    try {
      const data = await apiFetchFromServer(seriesItem.serverUrl, `/api/list?path=${encodeURIComponent(seriesItem.path)}`);
      const raw = (data.items || []).filter(i => i.type === 'file');
      raw.sort((a, b) => a.name.localeCompare(b.name, undefined, { numeric: true, sensitivity: 'base' }));

      activeSeriesEpisodes = raw.map(ep => ({
        ...ep,
        cleanName: cleanTitle(ep.name),
        bytes: parseItemBytes(ep),
        serverId: seriesItem.serverId,
        serverName: seriesItem.serverName,
        serverUrl: seriesItem.serverUrl
      }));

      renderExplorer();
      if (scrollTop) container.scrollTop = 0;
    } catch (e) {
      container.innerHTML = `
        <div class="empty-card">
          <h3>Host Offline</h3>
          <p>${escapeHtml(seriesItem.serverName)} could not be reached.</p>
          <div class="morph-btn" role="button" tabindex="0" onclick="returnToRoot()">Back</div>
        </div>

    }
  }

  function cleanTitle(filename) {

  function renderItemCollection(items, clickFnName, isEpisodeList = false) {

    return `

          const epNum = isEpisodeList ? (activeSeriesEpisodes.indexOf(item) + 1) : null;
          const prog = item.type === 'file' ? getSavedProgress(item.serverId, item.path) : null;
          const resumeHtml = prog && prog.pos > 15 ? `<span class="resume-tag">Resume ${formatClock(prog.pos)}</span><span>•</span>` : '';
          return `
            <div class="oneui-row" role="button" tabindex="0" onclick="${clickFnName}(${idx})">

                  ${resumeHtml}
                  <span>${escapeHtml(item.sizeLabel)}</span>
                  <span class="hide-sm">•</span>
                  <span class="hide-sm">${escapeHtml(item.modified)}</span>
                </div>
              </div>
              <div class="row-chevron">${item.type === 'folder' ? '›' : '▶'}</div>
            </div>
          `;
        }).join('')}
      </div>
    `;
