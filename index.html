<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">

  <meta name="description" content="My Files Media Explorer by Sanchar Koirala — Adaptive HLS cinema streaming with multi-quality video, audio tracks, subtitles, and Samsung One UI 9 navigation.">

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="My Files">
  <meta name="theme-color" content="#000000" id="metaThemeColor">

  <!-- Open Graph / Social SEO -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="My Files">
  <meta property="og:title" content="My Files — Personal Cinema &amp; Media Explorer">
  <meta property="og:description" content="Adaptive HLS cinema streaming with multi-quality video, audio tracks, and subtitles by Sanchar Koirala.">
  <meta property="og:image" content="favicon.png">
  <meta property="og:locale" content="en_US">

  <!-- Twitter Card SEO -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="My Files — Personal Cinema &amp; Media Explorer">

  <meta name="twitter:image" content="favicon.png">

  <!-- Favicon & App Icons -->
  <link rel="icon" type="image/png" sizes="32x32" href="favicon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="favicon.png">
  <link rel="shortcut icon" type="image/png" href="favicon.png">
  <link rel="apple-touch-icon" href="favicon.png">

  <!-- Structured Data (JSON-LD) -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebSite",
    "name": "My Files",
    "alternateName": "Personal Cinema & Media Explorer",
    "description": "Adaptive HLS cinema streaming with multi-quality video, audio tracks, and subtitles by Sanchar Koirala.",
    "author": {
      "@type": "Person",
      "name": "Sanchar Koirala"
    },
    "inLanguage": "en"
  }
  </script>

  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.15/dist/hls.min.js"></script>

  <style>
    :root[data-theme="dark"] {
      --bg: #000000;
      --surface: #17171a;
      --surface-2: #222226;
      --surface-hover: #2a2a2f;
      --stroke: rgba(255, 255, 255, 0.08);
      --text: #fafafa;
      --text-2: #9a9aa2;
      --blue: #3e8bff;
      --blue-soft: rgba(62, 139, 255, 0.16);
      --shadow: 0 8px 24px rgba(0, 0, 0, 0.45);
    }

    :root[data-theme="light"] {
      --bg: #f4f4f6;
      --surface: #ffffff;
      --surface-2: #ececf0;
      --surface-hover: #e4e4e9;
      --stroke: rgba(0, 0, 0, 0.07);
      --text: #111114;
      --text-2: #666670;
      --blue: #0381fe;
      --blue-soft: rgba(3, 129, 254, 0.12);
      --shadow: 0 6px 20px rgba(0, 0, 0, 0.05);
    }

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: "One UI Sans", "SamsungOne", "Inter", system-ui, -apple-system, sans-serif;
      font-size: 14px;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      transition: background 0.2s ease, color 0.2s ease;
    }

    .ui-btn {
      background: var(--surface);
      border: 1px solid var(--stroke);
      border-radius: 999px;
      color: var(--text);
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: transform 0.14s ease, background 0.14s ease, color 0.14s ease;
    }
    .ui-btn:hover:not(.disabled) { background: var(--surface-hover); }
    .ui-btn:active:not(.disabled) { transform: scale(0.96); }
    .ui-btn.disabled { opacity: 0.32; pointer-events: none; }

    .app-bar {
      padding: 14px 20px 10px;
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }

    .icon-btn { width: 38px; height: 38px; flex-shrink: 0; }
    .pill-btn { height: 38px; padding: 0 15px; flex-shrink: 0; }

    .crumb-strip {
      flex: 1;
      height: 38px;
      background: var(--surface);
      border: 1px solid var(--stroke);
      border-radius: 999px;
      padding: 0 14px;
      display: flex;
      align-items: center;
      gap: 4px;
      overflow-x: auto;
      white-space: nowrap;
      min-width: 100px;
    }
    .crumb-strip::-webkit-scrollbar { display: none; }

    .crumb-item {
      padding: 5px 10px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-2);
      cursor: pointer;
      transition: 0.14s;
    }
    .crumb-item:hover, .crumb-item.current {
      color: var(--text);
      background: var(--surface-2);
    }
    .crumb-arrow { color: var(--text-2); opacity: 0.45; font-size: 12px; }

    .search-field {
      width: 240px;
      height: 38px;
      background: var(--surface);
      border: 1px solid var(--stroke);
      border-radius: 999px;
      padding: 0 14px;
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }
    .search-field:focus-within { border-color: var(--blue); }
    .search-field input {
      background: transparent;
      border: none;
      outline: none;
      color: var(--text);
      font-size: 13.5px;
      width: 100%;
      font-family: inherit;
    }
    .search-field input::placeholder { color: var(--text-2); }

    .workspace {
      flex: 1;
      display: flex;
      gap: 16px;
      padding: 6px 20px 12px;
      overflow: hidden;
      position: relative;
    }

    .side-rail {
      width: 250px;
      background: var(--surface);
      border: 1px solid var(--stroke);
      border-radius: 26px;
      padding: 14px 10px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      overflow-y: auto;
      flex-shrink: 0;
    }
    .side-rail::-webkit-scrollbar { width: 4px; }
    .side-rail::-webkit-scrollbar-thumb { background: var(--stroke); border-radius: 99px; }

    .rail-header {
      font-size: 11.5px;
      font-weight: 700;
      color: var(--text-2);
      padding: 8px 14px 4px;
      letter-spacing: 0.4px;
    }

    .rail-row {
      padding: 11px 14px;
      border-radius: 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      cursor: pointer;
      font-weight: 600;
      font-size: 13px;
      color: var(--text);
      transition: 0.14s ease;
    }
    .rail-row:hover { background: var(--surface-2); }
    .rail-row.active { background: var(--blue-soft); color: var(--blue); }
    .rail-left {
      display: flex;
      align-items: center;
      gap: 10px;
      overflow: hidden;
    }
    .rail-left span {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .rail-meta { font-size: 11.5px; color: var(--text-2); flex-shrink: 0; }

    .content-area {
      flex: 1;
      overflow-y: auto;
      padding-right: 4px;
    }
    .content-area::-webkit-scrollbar { width: 5px; }
    .content-area::-webkit-scrollbar-thumb { background: var(--stroke); border-radius: 99px; }

    .view-hero {
      padding: 10px 6px 18px;
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }
    .hero-title {
      margin: 0;
      font-size: 26px;
      font-weight: 700;
      letter-spacing: -0.5px;
      line-height: 1.2;
    }
    .hero-sub {
      margin-top: 4px;
      font-size: 13px;
      color: var(--text-2);
      font-weight: 500;
    }

    .group-label {
      font-size: 12.5px;
      font-weight: 700;
      color: var(--text-2);
      padding: 4px 6px 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .oneui-group {
      background: var(--surface);
      border: 1px solid var(--stroke);
      border-radius: 26px;
      overflow: hidden;
      margin-bottom: 20px;
      box-shadow: var(--shadow);
    }

    .oneui-row {
      padding: 14px 18px;
      display: flex;
      align-items: center;
      gap: 14px;
      cursor: pointer;
      position: relative;
      transition: background 0.14s ease, transform 0.12s ease;
    }
    .oneui-row:not(:last-child)::after {
      content: "";
      position: absolute;
      left: 72px;
      right: 18px;
      bottom: 0;
      height: 1px;
      background: var(--stroke);
    }
    .oneui-row:hover { background: var(--surface-hover); }
    .oneui-row:active { transform: scale(0.992); }

    .sam-folder {
      width: 42px;
      height: 42px;
      border-radius: 14px;
      background: rgba(255, 184, 0, 0.14);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .sam-video {
      width: 42px;
      height: 42px;
      border-radius: 14px;
      background: var(--blue-soft);
      color: var(--blue);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .row-body { flex: 1; min-width: 0; }
    .row-title {
      font-weight: 600;
      font-size: 14.5px;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .row-details {
      margin-top: 4px;
      font-size: 12px;
      color: var(--text-2);
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .dot-sep { opacity: 0.45; }
    .resume-tag {
      color: var(--blue);
      font-weight: 700;
    }

    .row-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .chip-action {
      height: 32px;
      padding: 0 13px;
      border-radius: 999px;
      background: var(--surface-2);
      color: var(--text);
      font-size: 12px;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      cursor: pointer;
      transition: 0.14s;
    }
    .chip-action:hover { background: var(--blue); color: #fff; }

    .uniform-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 14px;
      margin-bottom: 22px;
    }

    .grid-tile {
      background: var(--surface);
      border: 1px solid var(--stroke);
      border-radius: 24px;
      padding: 16px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      height: 142px;
      box-shadow: var(--shadow);
      transition: transform 0.15s ease, background 0.15s ease;
    }
    .grid-tile:hover { background: var(--surface-hover); transform: translateY(-2px); }
    .grid-tile:active { transform: scale(0.985); }
    .tile-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .tile-badge {
      padding: 4px 10px;
      border-radius: 999px;
      background: var(--surface-2);
      color: var(--text-2);
      font-size: 11px;
      font-weight: 700;
    }
    .tile-name {
      font-weight: 600;
      font-size: 13.5px;
      line-height: 1.35;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      word-break: break-word;
    }
    .tile-sub {
      font-size: 11.5px;
      color: var(--text-2);
      display: flex;
      justify-content: space-between;
    }

    .state-box {
      max-width: 380px;
      margin: 70px auto;
      background: var(--surface);
      border: 1px solid var(--stroke);
      border-radius: 28px;
      padding: 32px 24px;
      text-align: center;
      box-shadow: var(--shadow);
    }
    .state-box h2 { margin: 0 0 8px; font-size: 18px; font-weight: 700; }
    .state-box p { margin: 0 0 20px; color: var(--text-2); font-size: 13.5px; }

    footer {
      padding: 8px 20px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 12px;
      color: var(--text-2);
      flex-shrink: 0;
    }

    /* Fullscreen Customizable Cinema Player */
    .player-screen {
      display: none;
      position: fixed;
      inset: 0;
      background: #000000;
      z-index: 100;
      flex-direction: column;
    }
    .player-screen.open { display: flex; }

    .player-header {
      padding: 12px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      background: rgba(18, 18, 20, 0.94);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      flex-wrap: wrap;
    }
    .player-name {
      font-weight: 700;
      font-size: 14.5px;
      color: #fff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      min-width: 140px;
      flex: 1;
    }
    .player-pills {
      display: flex;
      align-items: center;
      gap: 7px;
      flex-wrap: wrap;
    }
    .p-pill {
      height: 33px;
      padding: 0 13px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.11);
      color: #fff;
      font-size: 12px;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      cursor: pointer;
      transition: 0.14s;
    }
    .p-pill:hover { background: rgba(255, 255, 255, 0.22); }
    .p-pill.blue { background: #0381fe; }

    .video-stage {
      flex: 1;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
      overflow: hidden;
    }
    video {
      width: 100%;
      height: 100%;
      max-height: calc(100dvh - 134px);
      outline: none;
      object-fit: contain;
    }

    video::cue {
      background: rgba(0, 0, 0, 0.72);
      color: #ffffff;
      font-family: "One UI Sans", "Inter", sans-serif;
    }

    .loader-box {
      position: absolute;
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      pointer-events: none;
    }
    .loader-box.show { display: flex; }
    .loader-circle {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: 3px solid rgba(255, 255, 255, 0.16);
      border-top-color: #3e8bff;
      animation: spin 0.75s linear infinite;
    }
    .loader-label {
      padding: 5px 14px;
      border-radius: 999px;
      background: rgba(0, 0, 0, 0.75);
      color: #e4e4e7;
      font-size: 12px;
      font-weight: 600;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .player-controls {
      padding: 10px 18px 14px;
      background: rgba(18, 18, 20, 0.96);
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      flex-direction: column;
      gap: 9px;
    }
    .seek-area {
      height: 18px;
      display: flex;
      align-items: center;
      cursor: pointer;
    }
    .seek-bar {
      width: 100%;
      height: 5px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.18);
      position: relative;
    }
    .seek-area:hover .seek-bar { height: 7px; }
    .seek-progress {
      height: 100%;
      width: 0%;
      border-radius: 999px;
      background: #3e8bff;
      position: relative;
    }
    .seek-knob {
      position: absolute;
      right: -6px;
      top: 50%;
      transform: translateY(-50%);
      width: 13px;
      height: 13px;
      border-radius: 50%;
      background: #fff;
    }

    .ctrl-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-wrap: wrap;
    }
    .ctrl-group {
      display: flex;
      align-items: center;
      gap: 7px;
      flex-wrap: wrap;
    }
    .clock-text {
      font-family: ui-monospace, Consolas, monospace;
      font-size: 12px;
      color: #d4d4d8;
      padding: 0 5px;
    }
    .vol-range {
      width: 78px;
      accent-color: #3e8bff;
      cursor: pointer;
    }

    .toast {
      position: fixed;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%) translateY(14px);
      background: var(--surface-2);
      color: var(--text);
      border: 1px solid var(--stroke);
      padding: 10px 20px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 600;
      box-shadow: var(--shadow);
      opacity: 0;
      pointer-events: none;
      transition: all 0.2s ease;
      z-index: 200;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    .mobile-only { display: none; }

    @media (max-width: 860px) {
      .app-bar { padding: 12px 14px 8px; flex-wrap: wrap; }
      .crumb-strip { order: 3; flex-basis: 100%; height: 36px; }
      .search-field { flex: 1; width: auto; }
      .workspace { padding: 4px 14px 10px; }
      .side-rail {
        position: absolute;
        top: 0; bottom: 10px; left: 14px;
        z-index: 30;
        transform: translateX(-120%);
        transition: transform 0.2s ease;
        box-shadow: 12px 0 32px rgba(0, 0, 0, 0.6);
      }
      .side-rail.open { transform: translateX(0); }
      .mobile-only { display: inline-flex; }
      .uniform-grid { grid-template-columns: repeat(2, 1fr); gap: 10px; }
      .grid-tile { height: 134px; padding: 14px; }
      .hide-sm { display: none; }
      footer { flex-direction: column; gap: 4px; text-align: center; }
    }
  </style>
</head>
<body>

  <header class="app-bar">
    <div class="ui-btn icon-btn mobile-only" role="button" tabindex="0" onclick="toggleRail()" title="Folders">☰</div>
    <div class="ui-btn icon-btn disabled" id="btnBack" role="button" tabindex="0" onclick="goBack()" title="Back">←</div>
    <div class="ui-btn icon-btn disabled" id="btnUp" role="button" tabindex="0" onclick="goUp()" title="Up">↑</div>
    <div class="ui-btn icon-btn" role="button" tabindex="0" onclick="refreshCurrent()" title="Refresh">↻</div>

    <div class="crumb-strip" id="crumbStrip"></div>

    <div class="search-field">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
      <input type="text" id="searchInput" placeholder="Search" oninput="handleSearch(this.value)">
    </div>

    <div class="ui-btn pill-btn" id="btnSort" role="button" tabindex="0" onclick="cycleSort()">Name</div>
    <div class="ui-btn pill-btn" id="btnView" role="button" tabindex="0" onclick="toggleView()">Grid</div>
    <div class="ui-btn icon-btn" id="btnTheme" role="button" tabindex="0" onclick="toggleTheme()" title="Theme">☀</div>
  </header>

  <main class="workspace">
    <aside class="side-rail" id="sideRail">
      <div class="rail-header">Storage</div>
      <div class="rail-row active" id="railRoot" role="button" tabindex="0" onclick="navigateTo('')">
        <div class="rail-left">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="var(--blue)"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
          <span>Internal Storage</span>
        </div>
      </div>
      <div class="rail-header" style="margin-top:8px;">Folders</div>
      <div id="railFolders"></div>
    </aside>

    <section class="content-area" id="contentArea"></section>
  </main>

  <footer>
    <span id="footerStats">0 items</span>
    <span>© 2026 Sanchar Koirala | All rights reserved</span>
  </footer>

  <!-- Fullscreen Customizable Cinema Player -->
  <div class="player-screen" id="playerScreen">
    <div class="player-header">
      <div class="player-name" id="playerName">Video</div>
      <div class="player-pills">
        <div class="p-pill" id="qualityBtn" role="button" tabindex="0" onclick="cycleQuality()">Quality: Auto</div>
        <div class="p-pill" id="audioBtn" role="button" tabindex="0" onclick="cycleAudioTrack()" style="display:none;">Audio: Track 1</div>
        <div class="p-pill" id="subBtn" role="button" tabindex="0" onclick="cycleSubtitle()" style="display:none;">CC: Off</div>
        <div class="p-pill" id="nextEpBtn" role="button" tabindex="0" onclick="playNextEpisode()" style="display:none;">Next Ep</div>
        <div class="p-pill blue" role="button" tabindex="0" onclick="openExternalVLC()">VLC</div>
        <div class="p-pill" role="button" tabindex="0" onclick="closePlayer()">Close</div>
      </div>
    </div>

    <div class="video-stage" onclick="togglePlayPause()">
      <video id="videoEl" playsinline preload="auto" crossorigin="anonymous"></video>
      <div class="loader-box" id="loaderBox">
        <div class="loader-circle"></div>
        <div class="loader-label" id="loaderLabel">Preparing stream...</div>
      </div>
    </div>

    <div class="player-controls">
      <div class="seek-area" id="seekArea" onclick="seekFromBar(event)">
        <div class="seek-bar">
          <div class="seek-progress" id="seekProgress">
            <div class="seek-knob"></div>
          </div>
        </div>
      </div>

      <div class="ctrl-row">
        <div class="ctrl-group">
          <div class="p-pill" id="playBtn" role="button" tabindex="0" onclick="togglePlayPause()">Pause</div>
          <div class="p-pill" role="button" tabindex="0" onclick="skipBy(-10)">-10s</div>
          <div class="p-pill" role="button" tabindex="0" onclick="skipBy(10)">+10s</div>
          <div class="clock-text" id="clockText">00:00 / 00:00</div>
        </div>

        <div class="ctrl-group">
          <div class="p-pill" id="speedBtn" role="button" tabindex="0" onclick="cycleSpeed()">1x</div>
          <div class="p-pill" id="fitBtn" role="button" tabindex="0" onclick="cycleFit()">Fit</div>
          <input type="range" class="vol-range hide-sm" id="volRange" min="0" max="1" step="0.05" value="1" oninput="setVolume(this.value)">
          <div class="p-pill" role="button" tabindex="0" onclick="toggleFullscreen()">Fullscreen</div>
        </div>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyDpCAXfhldRc1nCZDWlWNRbcMFjqAh8uPc",
    authDomain: "cloud-db-studio.firebaseapp.com",
    databaseURL: "https://cloud-db-studio-default-rtdb.firebaseio.com",
    projectId: "cloud-db-studio",
    storageBucket: "cloud-db-studio.firebasestorage.app",
    messagingSenderId: "343326148662",
    appId: "1:343326148662:web:987738ccc8f9d6a8253097"
  };

  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();

  const FOLDER_ICON = `<svg width="22" height="22" viewBox="0 0 24 24" fill="#FFB800"><path d="M10.41 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2h-8l-1.59-2z"/></svg>`;
  const VIDEO_ICON = `<svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>`;

  let API_BASE = '';
  let currentPath = '';
  let historyStack = [''];
  let historyIndex = 0;
  let currentItems = [];
  let sortBy = 'name';
  let sortAsc = true;
  let viewMode = 'list';
  let searchTimer = null;

  let activeIndex = -1;
  let activeMedia = null;
  let activeProbe = { duration: 0, audioTracks: [], subtitleTracks: [] };
  let activeSessionId = '';
  let activeQuality = localStorage.getItem('oneui_stream_quality') || 'auto';
  let activeAudioTrack = 0;
  let activeSubIndex = -1;
  let streamOffsetSec = 0;
  let hlsInstance = null;
  let lastSavedTick = 0;

  const QUALITIES = [
    { id: 'auto', label: 'Auto' },
    { id: '1080p', label: '1080p HD' },
    { id: '720p', label: '720p Smooth' },
    { id: '480p', label: '480p Saver' }
  ];
  const SPEEDS = [1, 1.25, 1.5, 2, 0.75];
  const FITS = [
    { id: 'contain', label: 'Fit' },
    { id: 'cover', label: 'Fill' },
    { id: 'fill', label: 'Stretch' }
  ];
  let speedIdx = 0;
  let fitIdx = 0;

  function applyTheme(theme) {
    document.documentElement.setAttribute('data-theme', theme);
    localStorage.setItem('oneui_files_theme', theme);
    document.getElementById('btnTheme').textContent = theme === 'dark' ? '☀' : '☾';
    document.getElementById('metaThemeColor').setAttribute('content', theme === 'dark' ? '#000000' : '#f4f4f6');
  }

  function toggleTheme() {
    const cur = document.documentElement.getAttribute('data-theme') || 'dark';
    applyTheme(cur === 'dark' ? 'light' : 'dark');
  }

  applyTheme(localStorage.getItem('oneui_files_theme') || 'dark');

  document.addEventListener('keydown', (e) => {
    if (e.target && e.target.getAttribute('role') === 'button' && (e.key === 'Enter' || e.key === ' ')) {
      e.preventDefault();
      e.target.click();
    }
  });

  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(t._timer);
    t._timer = setTimeout(() => t.classList.remove('show'), 2500);
  }

  function setLoader(show, text = 'Preparing stream...') {
    const box = document.getElementById('loaderBox');
    document.getElementById('loaderLabel').textContent = text;
    box.classList.toggle('show', show);
  }

  function renderState(title, msg) {
    document.getElementById('contentArea').innerHTML = `
      <div class="state-box">
        <h2>${escapeHtml(title)}</h2>
        <p>${escapeHtml(msg)}</p>
        <div class="ui-btn pill-btn" role="button" tabindex="0" onclick="refreshCurrent()">Retry</div>
      </div>
    `;
    document.getElementById('footerStats').textContent = 'Offline';
  }

  async function apiFetch(endpoint) {
    if (!API_BASE) throw new Error('Offline');
    const res = await fetch(`${API_BASE}${endpoint}`);
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);
    return data;
  }

  db.ref('server-js/url').on('value', (snap) => {
    const raw = snap.val();
    const clean = raw ? String(raw).trim().replace(/\/+$/, '') : '';
    if (!clean) {
      API_BASE = '';
      renderState('Server Offline', 'Host stream is not active.');
      return;
    }
    if (API_BASE !== clean) {
      API_BASE = clean;
      historyStack = [''];
      historyIndex = 0;
      loadFolder('', false);
    }
  });

  async function loadFolder(path, pushHistory = true) {
    currentPath = path;
    document.getElementById('searchInput').value = '';

    if (pushHistory) {
      historyStack = historyStack.slice(0, historyIndex + 1);
      if (historyStack[historyStack.length - 1] !== path) {
        historyStack.push(path);
        historyIndex = historyStack.length - 1;
      }
    }

    updateNavState();
    renderBreadcrumbs();

    if (!API_BASE) return;

    try {
      const data = await apiFetch(`/api/list?path=${encodeURIComponent(path)}`);
      currentItems = data.items || [];

      if (path === '') {
        renderRailFolders(currentItems.filter(i => i.type === 'folder'));
      }

      document.getElementById('railRoot').classList.toggle('active', path === '');
      document.querySelectorAll('.rail-folder').forEach(el => {
        el.classList.toggle('active', el.dataset.path === path);
      });

      renderContent();
    } catch (e) {
      renderState('Unreachable', 'Cannot connect to host server.');
    }
  }

  function renderRailFolders(folders) {
    const box = document.getElementById('railFolders');
    box.innerHTML = folders.map(f => `
      <div class="rail-row rail-folder" data-path="${escapeHtml(f.path)}" role="button" tabindex="0" onclick="navigateTo('${escapeJs(f.path)}')">
        <div class="rail-left">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="#FFB800"><path d="M10.41 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2h-8l-1.59-2z"/></svg>
          <span title="${escapeHtml(f.name)}">${escapeHtml(f.name)}</span>
        </div>
        <span class="rail-meta">${escapeHtml(f.sizeLabel)}</span>
      </div>
    `).join('');
  }

  function renderBreadcrumbs() {
    const strip = document.getElementById('crumbStrip');
    const parts = currentPath ? currentPath.split('/') : [];
    let html = `<div class="crumb-item ${parts.length === 0 ? 'current' : ''}" role="button" tabindex="0" onclick="navigateTo('')">Internal storage</div>`;
    let acc = '';
    parts.forEach((p, idx) => {
      acc += (idx === 0 ? '' : '/') + p;
      const target = acc;
      const isLast = idx === parts.length - 1;
      html += `<span class="crumb-arrow">›</span><div class="crumb-item ${isLast ? 'current' : ''}" role="button" tabindex="0" onclick="navigateTo('${escapeJs(target)}')">${escapeHtml(p)}</div>`;
    });
    strip.innerHTML = html;
    strip.scrollLeft = strip.scrollWidth;
  }

  function sortList(items) {
    return [...items].sort((a, b) => {
      let cmp = 0;
      if (sortBy === 'name') cmp = a.name.localeCompare(b.name, undefined, { numeric: true });
      else if (sortBy === 'size') cmp = a.size - b.size;
      else if (sortBy === 'mtime') cmp = a.mtime - b.mtime;
      return sortAsc ? cmp : -cmp;
    });
  }

  function cleanTitle(filename) {
    return filename.replace(/\.[^/.]+$/, '').replace(/\./g, ' ');
  }

  function getSavedProgress(path) {
    try {
      return JSON.parse(localStorage.getItem('oneui_prog_' + path) || 'null');
    } catch (e) {
      return null;
    }
  }

  function renderContent() {
    const area = document.getElementById('contentArea');
    const folders = sortList(currentItems.filter(i => i.type === 'folder'));
    const files = sortList(currentItems.filter(i => i.type === 'file'));
    const total = folders.length + files.length;

    const parts = currentPath ? currentPath.split('/') : [];
    const heading = parts.length ? parts[parts.length - 1] : 'Internal storage';
    const totalBytes = [...folders, ...files].reduce((acc, x) => acc + (x.size || 0), 0);

    document.getElementById('footerStats').textContent = `${total} ${total === 1 ? 'item' : 'items'}`;

    if (total === 0) {
      area.innerHTML = `<div class="state-box"><h2>No files</h2><p>This folder contains no playable videos.</p></div>`;
      return;
    }

    let html = `
      <div class="view-hero">
        <div>
          <h1 class="hero-title">${escapeHtml(heading)}</h1>
          <div class="hero-sub">${folders.length} folders · ${files.length} videos · ${formatBytes(totalBytes)}</div>
        </div>
      </div>
    `;

    if (folders.length > 0) {
      html += `<div class="group-label"><span>Folders</span><span>${folders.length}</span></div>`;
      if (viewMode === 'list') {
        html += `<div class="oneui-group">`;
        folders.forEach(f => {
          html += `
            <div class="oneui-row" role="button" tabindex="0" onclick="navigateTo('${escapeJs(f.path)}')">
              <div class="sam-folder">${FOLDER_ICON}</div>
              <div class="row-body">
                <div class="row-title" title="${escapeHtml(f.name)}">${escapeHtml(f.name)}</div>
                <div class="row-details">
                  <span>${escapeHtml(f.typeLabel)}</span>
                  <span class="dot-sep">•</span>
                  <span>${escapeHtml(f.sizeLabel)}</span>
                  <span class="dot-sep hide-sm">•</span>
                  <span class="hide-sm">${escapeHtml(f.modified)}</span>
                </div>
              </div>
              <span style="color:var(--text-2); font-size:16px;">›</span>
            </div>
          `;
        });
        html += `</div>`;
      } else {
        html += `<div class="uniform-grid">`;
        folders.forEach(f => {
          html += `
            <div class="grid-tile" role="button" tabindex="0" onclick="navigateTo('${escapeJs(f.path)}')">
              <div class="tile-top">
                <div class="sam-folder">${FOLDER_ICON}</div>
                <span class="tile-badge">${escapeHtml(f.typeLabel)}</span>
              </div>
              <div class="tile-name" title="${escapeHtml(f.name)}">${escapeHtml(f.name)}</div>
              <div class="tile-sub">
                <span>${escapeHtml(f.sizeLabel)}</span>
                <span>${escapeHtml(f.modified)}</span>
              </div>
            </div>
          `;
        });
        html += `</div>`;
      }
    }

    if (files.length > 0) {
      html += `<div class="group-label"><span>Videos</span><span>${files.length}</span></div>`;
      if (viewMode === 'list') {
        html += `<div class="oneui-group">`;
        files.forEach((m, idx) => {
          const prog = getSavedProgress(m.path);
          const resumeBadge = prog && prog.pos > 15 ? `<span class="dot-sep">•</span><span class="resume-tag">Resume ${formatClock(prog.pos)}</span>` : '';
          html += `
            <div class="oneui-row" role="button" tabindex="0" onclick="openMedia(${idx})">
              <div class="sam-video">${VIDEO_ICON}</div>
              <div class="row-body">
                <div class="row-title" title="${escapeHtml(m.name)}">${escapeHtml(cleanTitle(m.name))}</div>
                <div class="row-details">
                  <span>${escapeHtml(m.ext)}</span>
                  <span class="dot-sep">•</span>
                  <span>${escapeHtml(m.sizeLabel)}</span>
                  <span class="dot-sep hide-sm">•</span>
                  <span class="hide-sm">${escapeHtml(m.modified)}</span>
                  ${resumeBadge}
                </div>
              </div>
              <div class="row-actions" onclick="event.stopPropagation()">
                <div class="chip-action hide-sm" role="button" tabindex="0" onclick="downloadM3U(${idx})">VLC</div>
                <div class="chip-action" role="button" tabindex="0" onclick="openMedia(${idx})">${prog && prog.pos > 15 ? 'Resume' : 'Play'}</div>
              </div>
            </div>
          `;
        });
        html += `</div>`;
      } else {
        html += `<div class="uniform-grid">`;
        files.forEach((m, idx) => {
          html += `
            <div class="grid-tile" role="button" tabindex="0" onclick="openMedia(${idx})">
              <div class="tile-top">
                <div class="sam-video">${VIDEO_ICON}</div>
                <span class="tile-badge">${escapeHtml(m.ext)}</span>
              </div>
              <div class="tile-name" title="${escapeHtml(m.name)}">${escapeHtml(cleanTitle(m.name))}</div>
              <div class="tile-sub">
                <span>${escapeHtml(m.sizeLabel)}</span>
                <span>${escapeHtml(m.modified)}</span>
              </div>
            </div>
          `;
        });
        html += `</div>`;
      }
    }

    window._renderedFiles = files;
    area.innerHTML = html;
  }

  async function openMedia(idx, forceStartZero = false) {
    const item = window._renderedFiles[idx];
    if (!item || !API_BASE) return;

    activeIndex = idx;
    activeMedia = item;
    activeAudioTrack = 0;
    activeSubIndex = -1;

    const saved = !forceStartZero ? getSavedProgress(item.path) : null;
    const initialStart = saved && saved.pos > 15 && (!saved.dur || saved.pos < saved.dur - 30) ? Math.floor(saved.pos) : 0;
    streamOffsetSec = initialStart;

    const screen = document.getElementById('playerScreen');
    const audioBtn = document.getElementById('audioBtn');
    const subBtn = document.getElementById('subBtn');
    const nextBtn = document.getElementById('nextEpBtn');

    const qObj = QUALITIES.find(q => q.id === activeQuality) || QUALITIES[0];
    document.getElementById('qualityBtn').textContent = `Quality: ${qObj.label}`;
    document.getElementById('playerName').textContent = cleanTitle(item.name);
    document.getElementById('seekProgress').style.width = '0%';
    document.getElementById('clockText').textContent = '00:00 / --:--';

    audioBtn.style.display = 'none';
    subBtn.style.display = 'none';
    nextBtn.style.display = idx + 1 < window._renderedFiles.length ? 'inline-flex' : 'none';

    setLoader(true, 'Analyzing media...');
    screen.classList.add('open');

    try {
      activeProbe = await apiFetch(`/api/probe?path=${encodeURIComponent(item.path)}`);
    } catch (e) {
      activeProbe = { duration: 0, audioTracks: [], subtitleTracks: [] };
    }

    if (activeProbe.audioTracks && activeProbe.audioTracks.length > 1) {
      audioBtn.style.display = 'inline-flex';
      audioBtn.textContent = `Audio: ${activeProbe.audioTracks[0].label}`;
    }

    if (activeProbe.subtitleTracks && activeProbe.subtitleTracks.length > 0) {
      subBtn.style.display = 'inline-flex';
      subBtn.textContent = 'CC: Off';
    }

    if (initialStart > 0) {
      showToast(`Resuming at ${formatClock(initialStart)}`);
    }

    await startHlsSession(initialStart);
  }

  async function startHlsSession(startSec) {
    if (!activeMedia || !API_BASE) return;
    setLoader(true, 'Buffering stream...');

    const video = document.getElementById('videoEl');
    if (hlsInstance) {
      hlsInstance.destroy();
      hlsInstance = null;
    }
    video.pause();

    try {
      const qs = new URLSearchParams({
        path: activeMedia.path,
        start: String(Math.max(0, Math.floor(startSec))),
        atrack: String(activeAudioTrack),
        quality: activeQuality,
        prev: activeSessionId || ''
      });

      const sess = await apiFetch(`/api/session?${qs.toString()}`);
      activeSessionId = sess.sessionId;
      streamOffsetSec = Math.max(0, Math.floor(startSec));
      if (sess.duration && !activeProbe.duration) {
        activeProbe.duration = sess.duration;
      }

      const fullPlaylistUrl = `${API_BASE}${sess.playlistUrl}`;

      if (window.Hls && Hls.isSupported()) {
        hlsInstance = new Hls({
          enableWorker: true,
          maxBufferLength: 30,
          maxMaxBufferLength: 60,
          manifestLoadingMaxRetry: 6,
          levelLoadingMaxRetry: 6,
          fragLoadingMaxRetry: 8
        });
        hlsInstance.loadSource(fullPlaylistUrl);
        hlsInstance.attachMedia(video);
        hlsInstance.on(Hls.Events.MANIFEST_PARSED, () => {
          video.playbackRate = SPEEDS[speedIdx];
          video.play().catch(() => {});
        });
        hlsInstance.on(Hls.Events.ERROR, (_, data) => {
          if (data.fatal) {
            if (data.type === Hls.ErrorTypes.NETWORK_ERROR) {
              hlsInstance.startLoad();
            } else if (data.type === Hls.ErrorTypes.MEDIA_ERROR) {
              hlsInstance.recoverMediaError();
            } else {
              setLoader(false);
              showToast('Stream interrupted — try 720p Smooth');
            }
          }
        });
      } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
        video.src = fullPlaylistUrl;
        video.load();
        video.play().catch(() => {});
      }
    } catch (e) {
      setLoader(false);
      showToast(`Stream error: ${e.message}`);
    }
  }

  function cycleQuality() {
    if (!activeMedia) return;
    const video = document.getElementById('videoEl');
    const cur = streamOffsetSec + (video.currentTime || 0);
    const idx = QUALITIES.findIndex(q => q.id === activeQuality);
    const next = QUALITIES[(idx + 1) % QUALITIES.length];
    activeQuality = next.id;
    localStorage.setItem('oneui_stream_quality', activeQuality);
    document.getElementById('qualityBtn').textContent = `Quality: ${next.label}`;
    showToast(`Quality: ${next.label}`);
    startHlsSession(cur);
  }

  function cycleAudioTrack() {
    if (!activeProbe.audioTracks || activeProbe.audioTracks.length <= 1) return;
    const video = document.getElementById('videoEl');
    const cur = streamOffsetSec + (video.currentTime || 0);
    activeAudioTrack = (activeAudioTrack + 1) % activeProbe.audioTracks.length;
    const tr = activeProbe.audioTracks[activeAudioTrack];
    document.getElementById('audioBtn').textContent = `Audio: ${tr.label}`;
    showToast(`Audio: ${tr.label}`);
    startHlsSession(cur);
  }

  function cycleSubtitle() {
    if (!activeProbe.subtitleTracks || activeProbe.subtitleTracks.length === 0) return;
    const video = document.getElementById('videoEl');
    video.querySelectorAll('track').forEach(t => t.remove());

    activeSubIndex++;
    if (activeSubIndex >= activeProbe.subtitleTracks.length) {
      activeSubIndex = -1;
      document.getElementById('subBtn').textContent = 'CC: Off';
      showToast('Subtitles Off');
      return;
    }

    const sub = activeProbe.subtitleTracks[activeSubIndex];
    const track = document.createElement('track');
    track.kind = 'subtitles';
    track.label = sub.label;
    track.default = true;
    track.src = `${API_BASE}/api/subtitle?path=${encodeURIComponent(activeMedia.path)}&strack=${sub.index}`;
    video.appendChild(track);
    if (video.textTracks && video.textTracks[0]) {
      video.textTracks[0].mode = 'showing';
    }
    document.getElementById('subBtn').textContent = `CC: ${sub.label}`;
    showToast(`Subtitles: ${sub.label}`);
  }

  function cycleSpeed() {
    const video = document.getElementById('videoEl');
    speedIdx = (speedIdx + 1) % SPEEDS.length;
    const spd = SPEEDS[speedIdx];
    video.playbackRate = spd;
    document.getElementById('speedBtn').textContent = `${spd}x`;
    showToast(`Speed ${spd}x`);
  }

  function cycleFit() {
    const video = document.getElementById('videoEl');
    fitIdx = (fitIdx + 1) % FITS.length;
    const f = FITS[fitIdx];
    video.style.objectFit = f.id;
    document.getElementById('fitBtn').textContent = f.label;
    showToast(`Screen: ${f.label}`);
  }

  function playNextEpisode() {
    if (activeIndex + 1 < window._renderedFiles.length) {
      openMedia(activeIndex + 1, true);
    }
  }

  const videoEl = document.getElementById('videoEl');

  videoEl.addEventListener('playing', () => {
    setLoader(false);
    document.getElementById('playBtn').textContent = 'Pause';
  });

  videoEl.addEventListener('pause', () => {
    document.getElementById('playBtn').textContent = 'Play';
  });

  videoEl.addEventListener('waiting', () => {
    setLoader(true, 'Buffering...');
  });

  videoEl.addEventListener('timeupdate', () => {
    const total = activeProbe.duration || (isFinite(videoEl.duration) ? streamOffsetSec + videoEl.duration : 0);
    const current = streamOffsetSec + (videoEl.currentTime || 0);
    document.getElementById('clockText').textContent = `${formatClock(current)} / ${total > 0 ? formatClock(total) : '--:--'}`;

    if (total > 0) {
      const pct = Math.min(100, Math.max(0, (current / total) * 100));
      document.getElementById('seekProgress').style.width = `${pct}%`;
    }

    if (activeMedia && Math.abs(current - lastSavedTick) >= 5) {
      lastSavedTick = current;
      localStorage.setItem('oneui_prog_' + activeMedia.path, JSON.stringify({ pos: current, dur: total }));
    }
  });

  function jumpToPosition(targetSec) {
    const relTarget = targetSec - streamOffsetSec;
    if (relTarget >= 0 && videoEl.seekable && videoEl.seekable.length > 0) {
      const bufEnd = videoEl.seekable.end(videoEl.seekable.length - 1);
      if (relTarget <= bufEnd) {
        videoEl.currentTime = relTarget;
        return;
      }
    }
    startHlsSession(targetSec);
  }

  function seekFromBar(e) {
    const total = activeProbe.duration || (isFinite(videoEl.duration) ? streamOffsetSec + videoEl.duration : 0);
    if (!total || total <= 0) return;
    const rect = document.getElementById('seekArea').getBoundingClientRect();
    const ratio = Math.min(1, Math.max(0, (e.clientX - rect.left) / rect.width));
    jumpToPosition(ratio * total);
  }

  function skipBy(delta) {
    const total = activeProbe.duration || 0;
    const current = streamOffsetSec + (videoEl.currentTime || 0);
    const target = Math.max(0, total > 0 ? Math.min(total - 2, current + delta) : current + delta);
    jumpToPosition(target);
  }

  function togglePlayPause() {
    if (videoEl.paused) videoEl.play().catch(() => {});
    else videoEl.pause();
  }

  function setVolume(val) {
    videoEl.volume = Number(val);
    videoEl.muted = Number(val) === 0;
  }

  function toggleFullscreen() {
    const scr = document.getElementById('playerScreen');
    if (document.fullscreenElement) document.exitFullscreen();
    else scr.requestFullscreen().catch(() => {});
  }

  function closePlayer() {
    if (hlsInstance) {
      hlsInstance.destroy();
      hlsInstance = null;
    }
    videoEl.pause();
    videoEl.querySelectorAll('track').forEach(t => t.remove());
    videoEl.removeAttribute('src');
    videoEl.load();

    if (activeSessionId && API_BASE) {
      fetch(`${API_BASE}/api/stop?id=${encodeURIComponent(activeSessionId)}`).catch(() => {});
      activeSessionId = '';
    }

    activeMedia = null;
    setLoader(false);
    document.getElementById('playerScreen').classList.remove('open');
    if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
    renderContent();
  }

  function openExternalVLC() {
    if (!activeMedia || !API_BASE) return;
    window.location.href = `${API_BASE}/api/playlist?path=${encodeURIComponent(activeMedia.path)}`;
    showToast('Playlist downloaded — open with VLC or MX Player');
  }

  function downloadM3U(idx) {
    const item = window._renderedFiles[idx];
    if (!item || !API_BASE) return;
    window.location.href = `${API_BASE}/api/playlist?path=${encodeURIComponent(item.path)}`;
    showToast('Playlist downloaded — open with VLC or MX Player');
  }

  function navigateTo(path) {
    document.getElementById('sideRail').classList.remove('open');
    loadFolder(path, true);
  }

  function goBack() {
    if (historyIndex > 0) {
      historyIndex--;
      loadFolder(historyStack[historyIndex], false);
    }
  }

  function goUp() {
    if (!currentPath) return;
    const parts = currentPath.split('/');
    parts.pop();
    navigateTo(parts.join('/'));
  }

  function refreshCurrent() {
    loadFolder(currentPath, false);
    showToast('Refreshed');
  }

  function updateNavState() {
    document.getElementById('btnBack').classList.toggle('disabled', historyIndex <= 0);
    document.getElementById('btnUp').classList.toggle('disabled', currentPath === '');
  }

  function cycleSort() {
    const modes = [
      { key: 'name', asc: true, label: 'Name' },
      { key: 'size', asc: false, label: 'Size' },
      { key: 'mtime', asc: false, label: 'Date' }
    ];
    const idx = modes.findIndex(m => m.key === sortBy);
    const next = modes[(idx + 1) % modes.length];
    sortBy = next.key;
    sortAsc = next.asc;
    document.getElementById('btnSort').textContent = next.label;
    renderContent();
  }

  function toggleView() {
    viewMode = viewMode === 'list' ? 'grid' : 'list';
    document.getElementById('btnView').textContent = viewMode === 'list' ? 'Grid' : 'List';
    renderContent();
  }

  function toggleRail() {
    document.getElementById('sideRail').classList.toggle('open');
  }

  function handleSearch(val) {
    clearTimeout(searchTimer);
    if (!val.trim()) {
      loadFolder(currentPath, false);
      return;
    }
    searchTimer = setTimeout(async () => {
      try {
        const data = await apiFetch(`/api/search?q=${encodeURIComponent(val)}`);
        currentItems = data.items || [];
        document.getElementById('crumbStrip').innerHTML = `<div class="crumb-item current">Search: ${escapeHtml(val)}</div>`;
        renderContent();
      } catch (e) {}
    }, 220);
  }

  function formatBytes(bytes) {
    if (!bytes) return '0 KB';
    const units = ['B', 'KB', 'MB', 'GB', 'TB'];
    let i = 0;
    let n = bytes;
    while (n >= 1024 && i < units.length - 1) { n /= 1024; i++; }
    return `${n.toFixed(i > 1 ? 2 : 0)} ${units[i]}`;
  }

  function formatClock(sec) {
    const s = Math.floor(sec || 0);
    const h = Math.floor(s / 3600);
    const m = Math.floor((s % 3600) / 60);
    const r = s % 60;
    if (h > 0) return `${h}:${String(m).padStart(2, '0')}:${String(r).padStart(2, '0')}`;
    return `${String(m).padStart(2, '0')}:${String(r).padStart(2, '0')}`;
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
  }

  function escapeJs(s) {
    return String(s).replace(/\\/g, '\\\\').replace(/'/g, "\\'");
  }

  document.addEventListener('keydown', (e) => {
    if (!document.getElementById('playerScreen').classList.contains('open')) return;
    if (e.key === 'Escape') closePlayer();
    else if (e.key === ' ' && document.activeElement.getAttribute('role') !== 'button') {
      e.preventDefault();
      togglePlayPause();
    } else if (e.key === 'ArrowRight') skipBy(10);
    else if (e.key === 'ArrowLeft') skipBy(-10);
    else if (e.key.toLowerCase() === 'f') toggleFullscreen();
  });
</script>
</body>
</html>
