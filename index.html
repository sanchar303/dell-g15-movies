  /* ============================================================
     SMART FILENAME PARSER (EXTRACTS CLEAN TITLE, YEAR, RES, CODEC, AUDIO)
     ============================================================ */
  function parseMediaMetadata(rawFilename, isFolder = false) {
    const extMatch = !isFolder ? rawFilename.match(/\.([a-zA-Z0-9]{2,5})$/) : null;
    const ext = extMatch ? extMatch[1].toUpperCase() : '';
    let base = !isFolder ? rawFilename.replace(/\.[^/.]+$/, '') : rawFilename;

    // Normalize dots, underscores, and bracket noise into spaces for parsing
    let working = base.replace(/[._]+/g, ' ').replace(/\[[^\]]*\]/g, ' ').replace(/\s+/g, ' ').trim();

    // Detect Season/Episode pattern (e.g., S01E04 or 1x04)
    let seasonEp = '';
    const seMatch = working.match(/\bS(\d{1,2})\s*E(\d{1,3})\b/i) || working.match(/\b(\d{1,2})x(\d{2})\b/i);
    if (seMatch) {
      seasonEp = `S${seMatch[1].padStart(2, '0')}·E${seMatch[2].padStart(2, '0')}`;
    }

    // Detect Resolution
    let res = '';
    if (/\b(2160p|4K|UHD)\b/i.test(working)) res = '4K';
    else if (/\b1440p\b/i.test(working)) res = '2K';
    else if (/\b1080p\b/i.test(working)) res = '1080p';
    else if (/\b720p\b/i.test(working)) res = '720p';
    else if (/\b480p\b/i.test(working)) res = '480p';

    // Detect Codec / HDR
    let codec = '';
    if (/\b(HDR10|HDR|DV|Dolby\s*Vision)\b/i.test(working)) codec = 'HDR';
    else if (/\b(HEVC|x265|H\s*265)\b/i.test(working)) codec = 'HEVC';

    // Detect Audio Track Hint
    let audioTag = '';
    if (/\b(Dual\s*Audio|Multi\s*Audio)\b/i.test(working)) audioTag = 'DUAL';
    else if (/\bHindi\b/i.test(working)) audioTag = 'HIN';
    else if (/\bJapanese\b/i.test(working)) audioTag = 'JPN';
    else if (/\bKorean\b/i.test(working)) audioTag = 'KOR';

    // Detect Year (1930 - 2029)
    let year = '';
    const yearMatch = working.match(/\b(19[3-9]\d|20[0-2]\d)\b/);
    if (yearMatch) {
      year = yearMatch[1];
    }

    // Strip technical release tags to get crisp title
    let stripped = working
      .replace(/\b(2160p|1440p|1080p|720p|480p|4K|UHD|WEB-?DL|WEBRip|BluRay|BRRip|BDRip|HDRip|DVDRip|HDTV|CAMRip|CAM|TS|HEVC|x265|x264|H264|H265|10bit|10-bit|8bit|AAC|AC3|DTS|DDP5\s*1|DD5\s*1|Atmos|TrueHD|Dual\s*Audio|Multi\s*Audio|ESub|ESubs|YIFY|RARBG|PSA|EVO|FGT|SPARKS|AMIABLE|EXTENDED|REMASTERED|UNRATED|DIRECTORS\s*CUT)\b/gi, ' ')
      .replace(/\(\s*\)/g, ' ')
      .replace(/\s+/g, ' ')
      .trim();

    if (year) {
      const withoutYear = stripped.replace(new RegExp(`\\(?\\b${year}\\b\\)?`, 'g'), ' ').replace(/\s+/g, ' ').trim();
      if (withoutYear.length >= 2) {
        stripped = withoutYear;
      }
    }

    const cleanName = stripped.length >= 1 ? stripped : working;
    const specs = [year, res, audioTag, codec].filter(Boolean);

    return {
      cleanName,
      year,
      res,
      codec,
      audioTag,
      seasonEp,
      ext,
      specs
    };
  }

  /* ============================================================
     UPGRADED PROCEDURAL POSTERS (SERIES STACKS & MOVIE FRAMES)
     ============================================================ */
  const POSTER_PALETTES = [
    { c1: '#162f4f', c2: '#356a9c', accent: '#90cdf4' },
    { c1: '#10233c', c2: '#2b5b88', accent: '#75b0e6' },
    { c1: '#1b3658', c2: '#42769c', accent: '#bee3f8' },
    { c1: '#132842', c2: '#316085', accent: '#8bbce8' },
    { c1: '#1a2f4b', c2: '#44688e', accent: '#a3cef1' },
    { c1: '#0e2239', c2: '#275580', accent: '#6aa9e3' }
  ];

  function hashString(str) {
    let h = 2166136261;
    for (let i = 0; i < str.length; i++) {
      h ^= str.charCodeAt(i);
      h = Math.imul(h, 16777619);
    }
    return h >>> 0;
  }

  function getMonogram(title) {
    const words = title.replace(/[^a-zA-Z0-9\s]/g, '').trim().split(/\s+/).filter(Boolean);
    if (words.length === 0) return 'G15';
    if (words.length === 1) return words[0].slice(0, 2).toUpperCase();
    return (words[0][0] + words[1][0]).toUpperCase();
  }

  function buildCodedThumbnailSvg(item, epNumber = null) {
    const meta = item.meta || parseMediaMetadata(item.name, item.type === 'folder');
    const seed = hashString(`${meta.cleanName}_${item.serverName}`);
    const pal = POSTER_PALETTES[seed % POSTER_PALETTES.length];
    const patternType = seed % 3;
    const isSeries = item.type === 'folder';
    const mono = epNumber !== null ? `E${String(epNumber).padStart(2, '0')}` : getMonogram(meta.cleanName);

    const topLeftBadge = epNumber !== null
      ? (meta.seasonEp || `EP ${String(epNumber).padStart(2, '0')}`)
      : (isSeries ? `${item.count || 0} EP` : (meta.res || meta.ext || 'HD'));

    const topRightBadge = meta.year || (isSeries ? 'SERIES' : meta.ext);

    // Watch progress bar at bottom of thumbnail
    let progressPct = 0;
    if (item.type === 'file') {
      const prog = getSavedProgress(item.serverId, item.path);
      if (prog && prog.pos > 10 && prog.dur > 0) {
        progressPct = Math.min(100, Math.max(4, Math.round((prog.pos / prog.dur) * 100)));
      }
    }

    let motifSvg = '';
    if (patternType === 0) {
      motifSvg = `
        <circle cx="255" cy="22" r="82" fill="none" stroke="${pal.accent}" stroke-opacity="0.14" stroke-width="14"/>
        <circle cx="255" cy="22" r="46" fill="none" stroke="${pal.accent}" stroke-opacity="0.18" stroke-width="5"/>
      `;
    } else if (patternType === 1) {
      motifSvg = `
        <path d="M-20 142 Q 95 58, 185 118 T 340 68 L 340 200 L -20 200 Z" fill="${pal.accent}" fill-opacity="0.12"/>
        <path d="M-20 166 Q 115 96, 215 144 T 340 104 L 340 200 L -20 200 Z" fill="${pal.accent}" fill-opacity="0.09"/>
      `;
    } else {
      motifSvg = `
        <rect x="200" y="-20" width="122" height="122" rx="28" transform="rotate(22 200 -20)" fill="${pal.accent}" fill-opacity="0.1"/>
        <rect x="225" y="16" width="96" height="96" rx="22" transform="rotate(22 225 16)" fill="none" stroke="${pal.accent}" stroke-opacity="0.2" stroke-width="2"/>
      `;
    }

    // Distinct visual silhouette: Layered iOS/One UI Folder Stack for Series vs Cinema Play Disc for Movies
    const centerArtwork = isSeries
      ? `
        <rect x="128" y="48" width="64" height="14" rx="6" fill="#ffffff" fill-opacity="0.24"/>
        <rect x="122" y="54" width="76" height="16" rx="7" fill="#ffffff" fill-opacity="0.38"/>
        <path d="M116 70 C116 64 120 60 126 60 L145 60 L152 67 L194 67 C200 67 204 71 204 77 L204 112 C204 118 200 122 194 122 L126 122 C120 122 116 118 116 112 Z" fill="#ffffff" fill-opacity="0.94"/>
        <polygon points="154,84 171,94 154,104" fill="${pal.c1}"/>
      `
      : `
        <circle cx="160" cy="88" r="27" fill="#ffffff" fill-opacity="0.18"/>
        <circle cx="160" cy="88" r="20" fill="#ffffff" fill-opacity="0.95"/>
        <polygon points="155,79 170,88 155,97" fill="${pal.c1}"/>
      `;

    const progressBarSvg = progressPct > 0
      ? `
        <rect x="0" y="174" width="320" height="6" fill="#070b14" fill-opacity="0.65"/>
        <rect x="0" y="174" width="${Math.round((progressPct / 100) * 320)}" height="6" fill="#75b0e6"/>
      `
      : '';

    const gradId = `pg_${seed}`;
    return `
      <svg viewBox="0 0 320 180" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="${gradId}" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="${pal.c1}"/>
            <stop offset="100%" stop-color="${pal.c2}"/>
          </linearGradient>
        </defs>
        <rect width="320" height="180" fill="url(#${gradId})"/>
        ${motifSvg}
        <text x="16" y="158" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="44" font-weight="900" fill="#ffffff" fill-opacity="0.12" letter-spacing="-1">${escapeHtml(mono)}</text>
        ${centerArtwork}
        <rect x="13" y="13" width="66" height="23" rx="8" fill="#0c1320" fill-opacity="0.54"/>
        <text x="46" y="28.5" text-anchor="middle" font-family="ui-monospace, Consolas, sans-serif" font-size="11" font-weight="800" fill="#edf2f8">${escapeHtml(topLeftBadge)}</text>
        ${topRightBadge ? `
          <rect x="245" y="13" width="62" height="23" rx="8" fill="#0c1320" fill-opacity="0.42"/>
          <text x="276" y="28.5" text-anchor="middle" font-family="ui-monospace, Consolas, sans-serif" font-size="10.5" font-weight="800" fill="#bee3f8">${escapeHtml(topRightBadge)}</text>
        ` : ''}
        ${progressBarSvg}
      </svg>
    `;
  }

  /* ============================================================
     SIGNAL BARS & BYTE FORMATTING HELPERS
     ============================================================ */
  function renderSignalBarsHtml(latencyMs) {
    let cls = 's3';
    if (typeof latencyMs === 'number') {
      if (latencyMs > 1200) cls = 's1';
      else if (latencyMs > 450) cls = 's2';
    }
    return `<span class="sig-bars ${cls}" title="${latencyMs ? latencyMs + ' ms' : 'Live'}"><i></i><i></i><i></i></span>`;
  }

  function formatCompactBytes(bytes) {
    if (!bytes || bytes <= 0) return '0 B';
    const units = ['B', 'KB', 'MB', 'GB', 'TB'];
    const i = Math.min(units.length - 1, Math.floor(Math.log(bytes) / Math.log(1024)));
    const val = bytes / Math.pow(1024, i);
    return `${val >= 100 || i === 0 ? Math.round(val) : val.toFixed(1)} ${units[i]}`;
  }

  /* ============================================================
     VIEWPORT & ORIENTATION SYNC
     ============================================================ */
  function syncViewportLayout() {
    document.documentElement.style.setProperty('--app-height', `${window.innerHeight}px`);
    if (window.scrollY !== 0 || window.scrollX !== 0) {
      window.scrollTo(0, 0);
    }
    if (isFullscreenMode) {
      updateFullscreenRotationFallback();
    }
  }

  function updateFullscreenRotationFallback() {
    const screenEl = document.getElementById('playerScreen');
    if (!isFullscreenMode) {
      screenEl.classList.remove('fs-rotate-fallback');
      return;
    }
    const isPortraitViewport = window.innerHeight > window.innerWidth;
    screenEl.classList.toggle('fs-rotate-fallback', !orientationLockedByPlayer && isPortraitViewport);
  }

  function unlockMobileOrientation() {
    orientationLockedByPlayer = false;
    try {
      if (screen.orientation && typeof screen.orientation.unlock === 'function') {
        screen.orientation.unlock();
      }
    } catch (e) {}
  }

  let lastAccelAngle = '';
  function handleAccelerometerMotion(e) {
    const acc = e.accelerationIncludingGravity;
    if (!acc || acc.x === null || acc.y === null) return;
    const ax = Math.abs(acc.x);
    const ay = Math.abs(acc.y);
    if (ax < 5.5 && ay < 5.5) return;
    const inferred = ax > ay ? 'landscape' : 'portrait';
    if (inferred !== lastAccelAngle) {
      lastAccelAngle = inferred;
      syncViewportLayout();
    }
  }

  syncViewportLayout();
  window.addEventListener('resize', syncViewportLayout, { passive: true });
  window.addEventListener('orientationchange', () => {
    setTimeout(syncViewportLayout, 60);
    setTimeout(syncViewportLayout, 260);
  }, { passive: true });
  if (screen.orientation && screen.orientation.addEventListener) {
    screen.orientation.addEventListener('change', syncViewportLayout);
  }
  window.addEventListener('devicemotion', handleAccelerometerMotion, { passive: true });

  /* ============================================================
     THEME & KEYBOARD ACCESSIBILITY
     ============================================================ */
  function applyTheme(theme) {
    document.documentElement.setAttribute('data-theme', theme);
    localStorage.setItem('g15_movies_theme', theme);
    document.getElementById('btnTheme').textContent = theme === 'light' ? '☾' : '☀';
    document.getElementById('metaThemeColor').setAttribute('content', theme === 'light' ? '#e3e8ef' : '#0c1320');
  }

  function toggleTheme() {
    const cur = document.documentElement.getAttribute('data-theme') || 'light';
    applyTheme(cur === 'light' ? 'dark' : 'light');
  }

  applyTheme(localStorage.getItem('g15_movies_theme') || 'light');

  document.addEventListener('keydown', (e) => {
    if (e.target && e.target.getAttribute('role') === 'button' && (e.key === 'Enter' || e.key === ' ')) {
      e.preventDefault();
      e.target.click();
    }
  });

  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(t._timer);
    t._timer = setTimeout(() => t.classList.remove('show'), 2300);
  }

  function setLoader(show) {
    document.getElementById('loaderBox').classList.toggle('show', show);
  }

  async function apiFetchFromServer(serverUrl, endpoint) {
    if (!serverUrl) throw new Error('Offline');
    const res = await fetch(`${serverUrl}${endpoint}`);
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);
    return data;
  }

  /* ============================================================
     MULTI-SERVER DISCOVERY & CATALOG AGGREGATION
     ============================================================ */
  db.ref('.info/serverTimeOffset').on('value', (snap) => {
    serverTimeOffsetMs = snap.val() || 0;
  });

  function getServerNowMs() {
    return Date.now() + serverTimeOffsetMs;
  }

  function reconcileServers() {
    const nowSec = Math.floor(getServerNowMs() / 1000);
    const list = [];

    if (latestServersObj && typeof latestServersObj === 'object') {
      Object.entries(latestServersObj).forEach(([key, srv]) => {
        if (!srv || !srv.url) return;
        const cleanUrl = String(srv.url).trim().replace(/\/+$/, '');
        if (!cleanUrl) return;
        const lastSeen = Number(srv.lastSeen || 0);
        if (lastSeen > 0 && (nowSec - lastSeen) > 85) return;
        const existing = onlineServers.find(s => s.id === (srv.id || key));
        list.push({
          id: srv.id || key,
          name: srv.name || key,
          url: cleanUrl,
          latencyMs: existing ? existing.latencyMs : 180
        });
      });
    }

    if (list.length === 0 && latestLegacyObj && latestLegacyObj.url) {
      const cleanLegacy = String(latestLegacyObj.url).trim().replace(/\/+$/, '');
      if (cleanLegacy) {
        const existing = onlineServers.find(s => s.id === 'default-host');
        list.push({
          id: 'default-host',
          name: 'DELL-G15',
          url: cleanLegacy,
          latencyMs: existing ? existing.latencyMs : 180
        });
      }
    }

    list.sort((a, b) => a.name.localeCompare(b.name, undefined, { numeric: true }));

    const prevSignature = onlineServers.map(s => `${s.id}:${s.url}`).join('|');
    const nextSignature = list.map(s => `${s.id}:${s.url}`).join('|');
    onlineServers = list;

    updateDeviceDropdown();
    updateGlobalTelemetry();

    if (onlineServers.length === 0) {
      allRootItems = [];
      renderExplorer();
      return;
    }

    if (prevSignature !== nextSignature) {
      fetchAllCatalog();
    }
  }

  function updateGlobalTelemetry() {
    const el = document.getElementById('globalTelemetry');
    if (onlineServers.length === 0) {
      el.innerHTML = `<span class="status-dot off"></span><span class="mono">0 HOST</span>`;
      return;
    }
    const avgLatency = Math.round(onlineServers.reduce((sum, s) => sum + (s.latencyMs || 200), 0) / onlineServers.length);
    const label = onlineServers.length === 1 ? onlineServers[0].name : `${onlineServers.length} HOSTS`;
    el.innerHTML = `
      <span class="status-dot"></span>
      <span>${escapeHtml(label)}</span>
      ${renderSignalBarsHtml(avgLatency)}
    `;
  }

  function updateDeviceDropdown() {
    const sel = document.getElementById('deviceSelect');
    if (hostFilterId !== 'ALL' && !onlineServers.some(s => s.id === hostFilterId)) {
      hostFilterId = 'ALL';
    }
    const opts = [`<option value="ALL">All Devices</option>`].concat(
      onlineServers.map(s => `<option value="${escapeHtml(s.id)}">${escapeHtml(s.name)}</option>`)
    );
    sel.innerHTML = opts.join('');
    sel.value = hostFilterId;
  }

  db.ref('servers').on('value', (snap) => {
    latestServersObj = snap.val() || {};
    reconcileServers();
  });

  db.ref('server-js').on('value', (snap) => {
    latestLegacyObj = snap.val();
    reconcileServers();
  });

  setInterval(reconcileServers, 15000);

  function parseItemBytes(item) {
    if (typeof item.size === 'number' && !isNaN(item.size)) return item.size;
    const lbl = String(item.sizeLabel || '').trim().toUpperCase();
    const m = lbl.match(/^([\d.]+)\s*(B|KB|MB|GB|TB)$/);
    if (!m) return 0;
    const num = parseFloat(m[1]);
    const unit = m[2];
    const mult = { B: 1, KB: 1024, MB: 1024 ** 2, GB: 1024 ** 3, TB: 1024 ** 4 }[unit] || 1;
    return Math.round(num * mult);
  }

  async function fetchAllCatalog() {
    if (onlineServers.length === 0) {
      allRootItems = [];
      renderExplorer();
      return;
    }

    const results = await Promise.all(
      onlineServers.map(async (srv) => {
        try {
          const t0 = performance.now();
          const data = await apiFetchFromServer(srv.url, '/api/list?path=');
          srv.latencyMs = Math.max(25, Math.round(performance.now() - t0));
          return (data.items || []).map(item => {
            const meta = parseMediaMetadata(item.name, item.type === 'folder');
            return {
              ...item,
              meta,
              cleanName: meta.cleanName,
              bytes: parseItemBytes(item),
              serverId: srv.id,
              serverName: srv.name,
              serverUrl: srv.url,
              serverLatency: srv.latencyMs
            };
          });
        } catch (e) {
          srv.latencyMs = 1800;
          return [];
        }
      })
    );

    updateGlobalTelemetry();
    const merged = results.flat();
    merged.sort((a, b) => a.cleanName.localeCompare(b.cleanName, undefined, { numeric: true, sensitivity: 'base' }));
    allRootItems = merged;
    renderExplorer();
  }

  function refreshAllCatalog() {
    if (activeSeriesFolder) {
      openSeriesFolder(activeSeriesFolder, false);
    } else {
      fetchAllCatalog();
    }
    showToast('Refreshed');
  }

  /* ============================================================
     FILTERS & NAVIGATION
     ============================================================ */
  function setTypeFilter(t) {
    typeFilter = t;
    ['ALL', 'MOVIES', 'SERIES'].forEach(key => {
      document.getElementById(`typeTab_${key}`).classList.toggle('active', key === t);
    });
    if (activeSeriesFolder) {
      activeSeriesFolder = null;
      activeSeriesEpisodes = [];
    }
    renderExplorer();
  }

  function setHostFilter(id) {
    hostFilterId = id;
    if (activeSeriesFolder) {
      activeSeriesFolder = null;
      activeSeriesEpisodes = [];
    }
    renderExplorer();
  }

  function setSizeFilter(sz) {
    sizeFilter = sz;
    renderExplorer();
  }

  function toggleViewMode() {
    viewMode = viewMode === 'grid' ? 'list' : 'grid';
    const iconSvg = document.getElementById('viewIconSvg');
    if (viewMode === 'list') {
      iconSvg.innerHTML = `<rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/>`;
    } else {
      iconSvg.innerHTML = `<line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/>`;
    }
    renderExplorer();
  }

  function handleSearchInput(val) {
    searchQuery = val.trim().toLowerCase();
    renderExplorer();
  }

  function matchesSizeFilter(bytes) {
    if (sizeFilter === 'ALL') return true;
    const oneGb = 1024 ** 3;
    const threeGb = 3 * oneGb;
    if (sizeFilter === 'SMALL') return bytes > 0 && bytes < oneGb;
    if (sizeFilter === 'MEDIUM') return bytes >= oneGb && bytes <= threeGb;
    if (sizeFilter === 'LARGE') return bytes > threeGb;
    return true;
  }

  async function openSeriesFolder(seriesItem, scrollTop = true) {
    activeSeriesFolder = seriesItem;
    const container = document.getElementById('explorerScroll');
    container.innerHTML = `<div class="empty-card"><h3>Loading</h3><p>${escapeHtml(seriesItem.cleanName)}</p></div>`;

    try {
      const data = await apiFetchFromServer(seriesItem.serverUrl, `/api/list?path=${encodeURIComponent(seriesItem.path)}`);
      const raw = (data.items || []).filter(i => i.type === 'file');
      raw.sort((a, b) => a.name.localeCompare(b.name, undefined, { numeric: true, sensitivity: 'base' }));

      activeSeriesEpisodes = raw.map(ep => {
        const meta = parseMediaMetadata(ep.name, false);
        return {
          ...ep,
          meta,
          cleanName: meta.cleanName,
          bytes: parseItemBytes(ep),
          serverId: seriesItem.serverId,
          serverName: seriesItem.serverName,
          serverUrl: seriesItem.serverUrl,
          serverLatency: seriesItem.serverLatency
        };
      });

      renderExplorer();
      if (scrollTop) container.scrollTop = 0;
    } catch (e) {
      container.innerHTML = `
        <div class="empty-card">
          <h3>Host Offline</h3>
          <p>${escapeHtml(seriesItem.serverName)}</p>
          <div class="morph-btn" role="button" tabindex="0" onclick="returnToRoot()">Back</div>
        </div>
      `;
    }
  }

  function returnToRoot() {
    activeSeriesFolder = null;
    activeSeriesEpisodes = [];
    renderExplorer();
  }

  /* ============================================================
     RENDER EXPLORER: SEPARATED SERIES & MOVIES + TACTILE INDICATORS
     ============================================================ */
  function progressKey(serverId, path) {
    return `g15_prog_${serverId || 'host'}_${path}`;
  }

  function getSavedProgress(serverId, path) {
    try {
      return JSON.parse(localStorage.getItem(progressKey(serverId, path)) || 'null');
    } catch (e) {
      return null;
    }
  }

  function updateFooterTelemetry(items) {
    const totalBytes = items.reduce((acc, it) => acc + (it.bytes || 0), 0);
    document.getElementById('footerTelemetry').textContent = `${items.length} · ${formatCompactBytes(totalBytes)}`;
    const pct = items.length === 0 ? 0 : Math.min(100, Math.max(12, Math.round((totalBytes / (50 * (1024 ** 3))) * 100)));
    document.getElementById('storageFillBar').style.width = `${pct}%`;
  }

  function renderItemCollection(items, clickFnName, isEpisodeList = false) {
    if (viewMode === 'grid') {
      return `
        <div class="files-grid">
          ${items.map((item, idx) => {
            const epNum = isEpisodeList ? (activeSeriesEpisodes.indexOf(item) + 1) : null;
            const meta = item.meta || parseMediaMetadata(item.name, item.type === 'folder');
            const specPills = meta.specs.slice(0, 3).map(sp => `<span class="spec-pill mono">${escapeHtml(sp)}</span>`).join('');
            const fileBadge = item.type === 'folder'
              ? `${item.count || 0} EP · ${item.sizeLabel}`
              : `${meta.ext || 'VID'} · ${item.sizeLabel}`;

            return `
              <div class="file-tile" role="button" tabindex="0" onclick="${clickFnName}(${idx})">
                <div class="thumb-frame">
                  ${buildCodedThumbnailSvg(item, epNum)}
                </div>
                <div class="tile-body">
                  <div class="tile-name" title="${escapeHtml(item.name)}">${escapeHtml(item.cleanName)}</div>
                  ${specPills ? `<div class="tile-tags">${specPills}</div>` : ''}
                  <div class="tile-meta">
                    <span class="host-tag">${renderSignalBarsHtml(item.serverLatency)}<span>${escapeHtml(item.serverName)}</span></span>
                    <span class="mono">${escapeHtml(fileBadge)}</span>
                  </div>
                </div>
              </div>
            `;
          }).join('')}
        </div>
      `;
    }

    return `
      <div class="oneui-list-card">
        ${items.map((item, idx) => {
          const epNum = isEpisodeList ? (activeSeriesEpisodes.indexOf(item) + 1) : null;
          const meta = item.meta || parseMediaMetadata(item.name, item.type === 'folder');
          const specPills = meta.specs.slice(0, 3).map(sp => `<span class="spec-pill mono">${escapeHtml(sp)}</span>`).join('');
          const fileBadge = item.type === 'folder'
            ? `${item.count || 0} EP · ${item.sizeLabel}`
            : `${meta.ext || 'VID'} · ${item.sizeLabel}`;

          return `
            <div class="oneui-row" role="button" tabindex="0" onclick="${clickFnName}(${idx})">
              <div class="row-thumb">
                ${buildCodedThumbnailSvg(item, epNum)}
              </div>
              <div class="row-info">
                <div class="row-name" title="${escapeHtml(item.name)}">${escapeHtml(item.cleanName)}</div>
                <div class="row-sub">
                  <span class="host-tag">${renderSignalBarsHtml(item.serverLatency)}<span>${escapeHtml(item.serverName)}</span></span>
                  ${specPills}
                  <span class="mono">${escapeHtml(fileBadge)}</span>
                </div>
              </div>
              <div class="row-chevron">${item.type === 'folder' ? '›' : '▶'}</div>
            </div>
          `;
        }).join('')}
      </div>
    `;
  }

  function renderExplorer() {
    const container = document.getElementById('explorerScroll');
    const filterBar = document.getElementById('filterBar');

    if (onlineServers.length === 0) {
      filterBar.style.display = 'none';
      updateFooterTelemetry([]);
      container.innerHTML = `
        <div class="empty-card">
          <h3>No Hosts Online</h3>
          <p>Run MyFilesServer.exe on Windows to share movies and series here.</p>
          <div class="morph-btn" role="button" tabindex="0" onclick="refreshAllCatalog()">Retry</div>
        </div>
      `;
      return;
    }

    filterBar.style.display = 'flex';

    // 1. Inside a Series Folder
    if (activeSeriesFolder) {
      const s = activeSeriesFolder;
      const filteredEps = activeSeriesEpisodes.filter(ep => {
        if (searchQuery && !ep.cleanName.toLowerCase().includes(searchQuery) && !ep.name.toLowerCase().includes(searchQuery)) return false;
        if (!matchesSizeFilter(ep.bytes)) return false;
        return true;
      });
      window._visibleEpisodes = filteredEps;
      updateFooterTelemetry(filteredEps);

      let html = `
        <div class="series-head-card">
          <div class="series-head-left">
            <div class="morph-btn icon-sq" role="button" tabindex="0" onclick="returnToRoot()" title="Back">←</div>
            <div class="series-head-thumb">${buildCodedThumbnailSvg(s)}</div>
            <div style="min-width:0;">
              <div class="section-heading" style="font-size:16px;">${escapeHtml(s.cleanName)}</div>
              <div class="row-sub" style="margin-top:5px;">
                <span class="host-tag">${renderSignalBarsHtml(s.serverLatency)}<span>${escapeHtml(s.serverName)}</span></span>
                <span class="mono">${activeSeriesEpisodes.length} EP · ${escapeHtml(s.sizeLabel)}</span>
              </div>
            </div>
          </div>
          ${activeSeriesEpisodes.length > 0 ? `
            <div class="morph-btn accent" role="button" tabindex="0" onclick="launchSeriesEpisodeByRealIndex(0)">▶ Play</div>
          ` : ''}
        </div>
      `;

      if (filteredEps.length === 0) {
        html += `<div class="empty-card"><h3>Empty</h3><p>No matching episodes.</p></div>`;
      } else {
        html += renderItemCollection(filteredEps, 'handleVisibleEpisodeClick', true);
      }
      container.innerHTML = html;
      return;
    }

    // 2. Root Explorer: Separated Series & Movies across all devices
    const matching = allRootItems.filter(item => {
      if (hostFilterId !== 'ALL' && item.serverId !== hostFilterId) return false;
      if (searchQuery && !item.cleanName.toLowerCase().includes(searchQuery) && !item.name.toLowerCase().includes(searchQuery) && !item.serverName.toLowerCase().includes(searchQuery)) return false;
      if (!matchesSizeFilter(item.bytes)) return false;
      return true;
    });

    const seriesList = matching.filter(i => i.type === 'folder');
    const moviesList = matching.filter(i => i.type === 'file');

    window._visibleSeries = seriesList;
    window._visibleMovies = moviesList;

    const showSeries = (typeFilter === 'ALL' || typeFilter === 'SERIES');
    const showMovies = (typeFilter === 'ALL' || typeFilter === 'MOVIES');

    const visibleItems = [
      ...(showSeries ? seriesList : []),
      ...(showMovies ? moviesList : [])
    ];
    updateFooterTelemetry(visibleItems);

    if (visibleItems.length === 0) {
      container.innerHTML = `<div class="empty-card"><h3>No Matches</h3><p>Adjust search or filter selection.</p></div>`;
      return;
    }

    let html = '';

    if (showSeries && seriesList.length > 0) {
      html += `
        <section class="category-section">
          <div class="section-header">
            <div class="section-title-group">
              <span class="section-heading">Series</span>
              <span class="count-badge mono">${seriesList.length}</span>
            </div>
          </div>
          ${renderItemCollection(seriesList, 'handleSeriesClick', false)}
        </section>
      `;
    }

    if (showMovies && moviesList.length > 0) {
      html += `
        <section class="category-section">
          <div class="section-header">
            <div class="section-title-group">
              <span class="section-heading">Movies</span>
              <span class="count-badge mono">${moviesList.length}</span>
            </div>
          </div>
          ${renderItemCollection(moviesList, 'handleMovieClick', false)}
        </section>
      `;
    }

    container.innerHTML = html;
  }

  function handleSeriesClick(idx) {
    const series = window._visibleSeries[idx];
    if (series) openSeriesFolder(series, true);
  }

  function handleMovieClick(idx) {
    const movie = window._visibleMovies[idx];
    if (!movie) return;
    activePlayerList = [movie];
    openMediaAtIndex(0, false, false);
  }

  function handleVisibleEpisodeClick(idx) {
    const ep = window._visibleEpisodes[idx];
    if (!ep) return;
    const realIdx = activeSeriesEpisodes.indexOf(ep);
    launchSeriesEpisodeByRealIndex(realIdx >= 0 ? realIdx : 0);
  }

  function launchSeriesEpisodeByRealIndex(realIdx) {
    if (!activeSeriesEpisodes.length) return;
    activePlayerList = activeSeriesEpisodes;
    openMediaAtIndex(realIdx, true, false);
  }

  /* ============================================================
     SELF-CLEANING SYNCHRONIZED WATCH PARTY ROOMS (FIREBASE RTDB)
     ============================================================ */
  function generateRoomCode() {
    const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
    let code = '';
    for (let i = 0; i < 4; i++) {
      code += chars[Math.floor(Math.random() * chars.length)];
    }
    return code;
  }

  function updatePartyBadgesUI() {
    const active = Boolean(partyRoomCode);
    const topBtn = document.getElementById('btnPartyTop');
    const topLbl = document.getElementById('partyTopLabel');
    const playerPill = document.getElementById('playerPartyPill');
    const playerCode = document.getElementById('playerPartyCode');

    topBtn.classList.toggle('party-live', active);
    topLbl.textContent = active ? `${partyRoomCode} (${Math.max(1, partyMembersCount)})` : 'Party';

    playerPill.classList.toggle('show', active);
    if (active) {
      playerCode.textContent = `${partyRoomCode} · ${Math.max(1, partyMembersCount)}`;
    }
  }

  async function createWatchParty() {
    if (partyRoomCode) await leaveWatchParty(true);
    const code = generateRoomCode();
    await connectToWatchParty(code, true);
    showToast(`Party ${code} created`);
    openWatchPartyModal();
  }

  async function joinWatchPartyFromInput() {
    const inp = document.getElementById('partyCodeInput');
    if (!inp) return;
    const code = inp.value.trim().toUpperCase().replace(/[^A-Z0-9]/g, '');
    if (code.length < 3) {
      showToast('Enter room code');
      return;
    }
    if (partyRoomCode === code) {
      openWatchPartyModal();
      return;
    }
    if (partyRoomCode) await leaveWatchParty(true);

    const snap = await db.ref(`watch-parties/${code}`).once('value');
    if (!snap.exists()) {
      showToast('Room not found');
      return;
    }
    await connectToWatchParty(code, false);
    closeModal();
    showToast(`Joined ${code}`);
  }

  async function connectToWatchParty(code, isCreator) {
    partyRoomCode = code;
    partyLastSeq = 0;
    partyRoomRef = db.ref(`watch-parties/${code}`);
    partyMemberRef = partyRoomRef.child(`members/${myPeerId}`);

    // Guarantee server-side removal of this member on tab close or network drop
    await partyMemberRef.onDisconnect().remove();
    await partyMemberRef.set({
      joinedAt: firebase.database.ServerValue.TIMESTAMP,
      creator: isCreator
    });

    if (isCreator) {
      await partyRoomRef.child('createdAt').set(firebase.database.ServerValue.TIMESTAMP);
      // If creator is alone in the room, server-side onDisconnect deletes the entire room
      await partyRoomRef.onDisconnect().remove();
      if (activeMedia) {
        broadcastPartyState(true);
      }
    }

    // Monitor room membership to dynamically arm/disarm full-room onDisconnect cleanup
    partyRoomRef.child('members').on('value', (snap) => {
      if (!partyRoomCode || partyRoomCode !== code) return;
      const members = snap.val() || {};
      const ids = Object.keys(members);
      partyMembersCount = ids.length;
      updatePartyBadgesUI();

      if (partyMembersCount === 0) {
        partyRoomRef.remove().catch(() => {});
        return;
      }

      if (partyMembersCount === 1 && ids[0] === myPeerId) {
        // Sole remaining member -> arm room-level onDisconnect so room vanishes when they leave
        partyRoomRef.onDisconnect().remove().catch(() => {});
      } else {
        // Multiple members active -> cancel room-level onDisconnect so one person leaving doesn't kill the room
        partyRoomRef.onDisconnect().cancel().catch(() => {});
      }
    });

    // Listen to synchronized playback state changes
    partyRoomRef.child('state').on('value', (snap) => {
      if (!partyRoomCode || partyRoomCode !== code) return;
      const st = snap.val();
      if (!st || !st.path) return;
      if (st.updatedBy === myPeerId) return;
      if (st.seq && st.seq <= partyLastSeq) return;
      partyLastSeq = st.seq || (partyLastSeq + 1);
      applyRemotePartyState(st);
    });

    // Listen to transient live reactions
    partyRoomRef.child('reaction').on('value', (snap) => {
      const rx = snap.val();
      if (!rx || !rx.emoji || rx.by === myPeerId) return;
      spawnFloatingReaction(rx.emoji);
    });

    // Periodic drift check (every 4s) for guests
    clearInterval(partyDriftTimer);
    partyDriftTimer = setInterval(checkPartyDrift, 4000);
    updatePartyBadgesUI();
  }

  async function leaveWatchParty(silent = false) {
    clearInterval(partyDriftTimer);
    partyDriftTimer = null;

    if (partyRoomRef) {
      const refToClean = partyRoomRef;
      const memToClean = partyMemberRef;
      const wasLast = partyMembersCount <= 1;

      refToClean.child('members').off();
      refToClean.child('state').off();
      refToClean.child('reaction').off();

      try {
        await refToClean.onDisconnect().cancel();
        if (memToClean) {
          await memToClean.onDisconnect().cancel();
          await memToClean.remove();
        }
        if (wasLast) {
          await refToClean.remove();
        }
      } catch (e) {}
    }

    partyRoomCode = null;
    partyRoomRef = null;
    partyMemberRef = null;
    partyMembersCount = 0;
    partyLastSeq = 0;
    updatePartyBadgesUI();
    if (!silent) {
      closeModal();
      showToast('Left party');
    }
  }

  function broadcastPartyState(forceImmediate = false) {
    if (!partyRoomCode || !partyRoomRef || !activeMedia || suppressPartyBroadcast) return;
    const now = getServerNowMs();
    const curPos = streamOffsetSec + (videoEl.currentTime || 0);
    const nextSeq = (partyLastSeq || 0) + 1;
    partyLastSeq = nextSeq;

    partyRoomRef.child('state').set({
      serverId: activeMedia.serverId,
      serverName: activeMedia.serverName,
      path: activeMedia.path,
      name: activeMedia.name,
      cleanName: activeMedia.cleanName,
      ext: activeMedia.ext || '',
      sizeLabel: activeMedia.sizeLabel || '',
      type: 'file',
      playing: !videoEl.paused,
      position: Number(curPos.toFixed(2)),
      updatedAt: now,
      updatedBy: myPeerId,
      seq: nextSeq
    }).catch(() => {});
  }

  async function applyRemotePartyState(st) {
    const srv = onlineServers.find(s => s.id === st.serverId) || onlineServers.find(s => s.name === st.serverName);
    if (!srv) {
      showToast(`Host ${st.serverName || ''} offline`);
      return;
    }

    const elapsedSec = st.playing ? Math.max(0, (getServerNowMs() - (st.updatedAt || getServerNowMs())) / 1000) : 0;
    const targetPos = Math.max(0, (st.position || 0) + elapsedSec);

    const isSameVideo = activeMedia && activeMedia.path === st.path && activeMedia.serverId === srv.id;

    suppressPartyBroadcast = true;
    try {
      if (!isSameVideo) {
        const meta = parseMediaMetadata(st.name || st.cleanName, false);
        const mediaObj = {
          name: st.name || st.cleanName,
          cleanName: st.cleanName || meta.cleanName,
          meta,
          path: st.path,
          ext: st.ext || meta.ext,
          sizeLabel: st.sizeLabel || '',
          type: 'file',
          serverId: srv.id,
          serverName: srv.name,
          serverUrl: srv.url,
          serverLatency: srv.latencyMs
        };
        activePlayerList = [mediaObj];
        await openMediaAtIndex(0, false, true, Math.floor(targetPos));
        if (!st.playing) {
          videoEl.pause();
        }
      } else {
        const localPos = streamOffsetSec + (videoEl.currentTime || 0);
        if (Math.abs(localPos - targetPos) > 2.5) {
          jumpToPosition(targetPos);
        }
        if (st.playing && videoEl.paused) {
          videoEl.play().catch(() => {});
        } else if (!st.playing && !videoEl.paused) {
          videoEl.pause();
        }
      }
    } finally {
      setTimeout(() => { suppressPartyBroadcast = false; }, 450);
    }
  }

  function checkPartyDrift() {
    if (!partyRoomCode || !partyRoomRef || !activeMedia || suppressPartyBroadcast) return;
    partyRoomRef.child('state').once('value', (snap) => {
      const st = snap.val();
      if (!st || st.updatedBy === myPeerId || st.path !== activeMedia.path) return;
      if (!st.playing || videoEl.paused) return;
      const elapsed = Math.max(0, (getServerNowMs() - (st.updatedAt || getServerNowMs())) / 1000);
      const expected = (st.position || 0) + elapsed;
      const actual = streamOffsetSec + (videoEl.currentTime || 0);
      if (Math.abs(actual - expected) > 3.8) {
        suppressPartyBroadcast = true;
        jumpToPosition(expected);
        setTimeout(() => { suppressPartyBroadcast = false; }, 600);
      }
    });
  }

  function sendPartyReaction(emoji) {
    spawnFloatingReaction(emoji);
    if (!partyRoomCode || !partyRoomRef) return;
    const rxRef = partyRoomRef.child('reaction');
    rxRef.onDisconnect().remove().catch(() => {});
    rxRef.set({
      emoji,
      by: myPeerId,
      ts: getServerNowMs()
    }).catch(() => {});
  }

  function spawnFloatingReaction(emoji) {
    const layer = document.getElementById('reactionLayer');
    if (!layer) return;
    const el = document.createElement('div');
    el.className = 'float-emoji';
    el.textContent = emoji;
    el.style.left = `${18 + Math.random() * 64}%`;
    layer.appendChild(el);
    setTimeout(() => el.remove(), 2150);
  }

  function copyPartyLink() {
    if (!partyRoomCode) return;
    const url = `${window.location.origin}${window.location.pathname}?party=${partyRoomCode}`;
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(url).then(() => showToast('Link copied')).catch(() => showToast(`Code: ${partyRoomCode}`));
    } else {
      showToast(`Code: ${partyRoomCode}`);
    }
  }

  function openWatchPartyModal() {
    document.getElementById('modalTitle').textContent = 'Watch Party';
    const list = document.getElementById('modalList');

    if (partyRoomCode) {
      list.innerHTML = `
        <div class="party-code-box">
          <div class="opt-sub" style="margin-bottom:4px;">ROOM CODE · ${Math.max(1, partyMembersCount)} CONNECTED</div>
          <div class="party-code-val">${escapeHtml(partyRoomCode)}</div>
        </div>
        <div class="reaction-bar">
          ${['🔥', '😂', '😮', '👏', '❤️'].map(em => `
            <div class="react-btn" role="button" tabindex="0" onclick="sendPartyReaction('${em}')">${em}</div>
          `).join('')}
        </div>
        <div class="modal-option" role="button" tabindex="0" onclick="copyPartyLink()">
          <div class="opt-main">
            <div class="opt-title">Copy Invite Link</div>
            <div class="opt-sub">Auto-cleans when everyone leaves</div>
          </div>
          <span class="mono" style="color:#8bbce8; font-weight:800;">↗</span>
        </div>
        <div class="modal-option" role="button" tabindex="0" onclick="leaveWatchParty(false)">
          <div class="opt-main">
            <div class="opt-title" style="color:#f59e0b;">Leave Party</div>
          </div>
        </div>
      `;
    } else {
      list.innerHTML = `
        <div class="modal-option selected" role="button" tabindex="0" onclick="createWatchParty()">
          <div class="opt-main">
            <div class="opt-title">Create Watch Party</div>
            <div class="opt-sub">Sync playback live with friends</div>
          </div>
          <span class="mono" style="color:#8bbce8; font-weight:800;">+</span>
        </div>
        <div class="party-input-row">
          <input type="text" class="party-input" id="partyCodeInput" maxlength="6" placeholder="CODE" onkeydown="if(event.key==='Enter') joinWatchPartyFromInput()">
          <div class="p-pill steel-pill" style="height:40px; padding:0 16px;" role="button" tabindex="0" onclick="joinWatchPartyFromInput()">Join</div>
        </div>
      `;
    }

    document.getElementById('modalBackdrop').classList.add('open');
  }

  // Auto-join Watch Party if opened via ?party=CODE
  window.addEventListener('DOMContentLoaded', () => {
    const params = new URLSearchParams(window.location.search);
    const joinCode = (params.get('party') || '').trim().toUpperCase();
    if (joinCode) {
      setTimeout(async () => {
        const snap = await db.ref(`watch-parties/${joinCode}`).once('value');
        if (snap.exists()) {
          await connectToWatchParty(joinCode, false);
          showToast(`Joined ${joinCode}`);
        }
      }, 900);
    }
  });

  window.addEventListener('beforeunload', () => {
    if (partyRoomRef && partyMembersCount <= 1) {
      try { partyRoomRef.remove(); } catch (e) {}
    }
  });

  /* ============================================================
     SERIES EPISODE NAVIGATION (SHOWN ONLY FOR MULTI-EPISODE SERIES)
     ============================================================ */
  function isPlayingSeriesFolder() {
    return activeSeriesFolder !== null && Array.isArray(activePlayerList) && activePlayerList.length > 1;
  }

  function updateEpisodeNavigationUI() {
    const showSeriesUI = isPlayingSeriesFolder();
    const prevBtn = document.getElementById('prevEpBtn');
    const nextBtn = document.getElementById('nextEpBtn');
    const epPane = document.getElementById('episodePane');
    const workspace = document.getElementById('playerWorkspace');

    if (!showSeriesUI) {
      prevBtn.style.display = 'none';
      nextBtn.style.display = 'none';
      epPane.classList.remove('show');
      workspace.classList.add('no-episodes');
      return;
    }

    prevBtn.style.display = 'inline-flex';
    nextBtn.style.display = 'inline-flex';
    prevBtn.classList.toggle('disabled', activeIndex <= 0);
    nextBtn.classList.toggle('disabled', activeIndex >= activePlayerList.length - 1);

    epPane.classList.add('show');
    workspace.classList.remove('no-episodes');

    document.getElementById('epPaneTitle').textContent = activeSeriesFolder.cleanName;
    document.getElementById('epPaneCount').textContent = `${activeIndex + 1}/${activePlayerList.length}`;

    const listEl = document.getElementById('epList');
    listEl.innerHTML = activePlayerList.map((f, i) => {
      const isCur = i === activeIndex;
      const meta = f.meta || parseMediaMetadata(f.name, false);
      return `
        <div class="ep-card ${isCur ? 'active' : ''}" id="epCard_${i}" role="button" tabindex="0" onclick="selectEpisode(${i})">
          <div class="ep-num mono">${String(i + 1).padStart(2, '0')}</div>
          <div class="ep-info">
            <div class="ep-name" title="${escapeHtml(f.name)}">${escapeHtml(f.cleanName)}</div>
            <div class="ep-meta mono">
              <span>${escapeHtml(meta.res || meta.ext || 'VID')}</span>
              <span>•</span>
              <span>${escapeHtml(f.sizeLabel)}</span>
            </div>
          </div>
        </div>
      `;
    }).join('');

    requestAnimationFrame(() => {
      const activeCard = document.getElementById(`epCard_${activeIndex}`);
      if (activeCard) {
        activeCard.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
      }
    });
  }

  function selectEpisode(idx) {
    if (idx === activeIndex) return;
    openMediaAtIndex(idx, true, false);
  }

  function playPrevEpisode() {
    if (!isPlayingSeriesFolder() || activeIndex <= 0) return;
    openMediaAtIndex(activeIndex - 1, true, false);
  }

  function playNextEpisode() {
    if (!isPlayingSeriesFolder() || activeIndex >= activePlayerList.length - 1) return;
    openMediaAtIndex(activeIndex + 1, true, false);
  }

  /* ============================================================
     EXCLUSIVE FULLSCREEN MODE (EXITS BOTH PLAYER & BROWSER FULLSCREEN)
     ============================================================ */
  function enterFullscreenMode() {
    if (!activeMedia) return;
    isFullscreenMode = true;
    fsButtonVisible = true;

    const screenEl = document.getElementById('playerScreen');
    const exitBtn = document.getElementById('fsExitBtn');
    screenEl.classList.add('fs-active');
    exitBtn.classList.remove('fs-hidden');

    const reqFs = screenEl.requestFullscreen || screenEl.webkitRequestFullscreen || screenEl.msRequestFullscreen;
    if (typeof reqFs === 'function') {
      try {
        const promise = reqFs.call(screenEl);
        if (promise && typeof promise.catch === 'function') {
          promise.catch(() => {});
        }
      } catch (e) {}
    }

    if (screen.orientation && typeof screen.orientation.lock === 'function') {
      screen.orientation.lock('landscape')
        .then(() => {
          orientationLockedByPlayer = true;
          updateFullscreenRotationFallback();
        })
        .catch(() => {
          orientationLockedByPlayer = false;
          updateFullscreenRotationFallback();
        });
    } else {
      orientationLockedByPlayer = false;
      updateFullscreenRotationFallback();
    }
  }

  function handleExitFullscreenClick(e) {
    if (e && typeof e.stopPropagation === 'function') {
      e.stopPropagation();
    }
    exitFullscreenMode(false);
  }

  function exitFullscreenMode(triggeredByNativeEvent = false) {
    isFullscreenMode = false;
    fsButtonVisible = true;

    const screenEl = document.getElementById('playerScreen');
    const exitBtn = document.getElementById('fsExitBtn');
    screenEl.classList.remove('fs-active', 'fs-rotate-fallback');
    exitBtn.classList.remove('fs-hidden');

    const nativeFsEl = document.fullscreenElement || document.webkitFullscreenElement || document.msFullscreenElement;
    if (nativeFsEl && !triggeredByNativeEvent) {
      const exitFn = document.exitFullscreen || document.webkitExitFullscreen || document.msExitFullscreen;
      if (typeof exitFn === 'function') {
        try {
          const p = exitFn.call(document);
          if (p && typeof p.catch === 'function') p.catch(() => {});
        } catch (e) {}
      }
    }

    unlockMobileOrientation();
    setTimeout(syncViewportLayout, 60);
  }

  function handleVideoStageTap(e) {
    // Only toggles the Exit Fullscreen button when in Fullscreen Mode; does nothing in normal mode
    if (!isFullscreenMode) return;
    if (e.target && e.target.closest('#fsExitBtn')) return;

    fsButtonVisible = !fsButtonVisible;
    document.getElementById('fsExitBtn').classList.toggle('fs-hidden', !fsButtonVisible);
  }

  function handleNativeFullscreenChange() {
    const nativeFsEl = document.fullscreenElement || document.webkitFullscreenElement || document.msFullscreenElement;
    if (!nativeFsEl && isFullscreenMode) {
      exitFullscreenMode(true);
    }
  }

  document.addEventListener('fullscreenchange', handleNativeFullscreenChange);
  document.addEventListener('webkitfullscreenchange', handleNativeFullscreenChange);

  /* ============================================================
     CINEMA PLAYER CORE
     ============================================================ */
  function updateQualityBadge(label) {
    document.getElementById('qualityBadge').textContent = label || 'HD';
  }

  async function openMediaAtIndex(idx, isSeries, forceStartZero = false, explicitStartSec = null) {
    const item = activePlayerList[idx];
    if (!item || !item.serverUrl) return;

    unlockMobileOrientation();
    syncViewportLayout();

    activeIndex = idx;
    activeMedia = item;
    activeAudioTrack = 0;

    let initialStart = 0;
    if (typeof explicitStartSec === 'number') {
      initialStart = Math.max(0, Math.floor(explicitStartSec));
    } else if (!forceStartZero) {
      const saved = getSavedProgress(item.serverId, item.path);
      initialStart = saved && saved.pos > 15 && (!saved.dur || saved.pos < saved.dur - 30) ? Math.floor(saved.pos) : 0;
    }
    streamOffsetSec = initialStart;

    const screenEl = document.getElementById('playerScreen');
    const audioBtn = document.getElementById('audioBtn');

    isFullscreenMode = false;
    screenEl.classList.remove('fs-active', 'fs-rotate-fallback');

    document.getElementById('playerName').textContent = item.cleanName;
    document.getElementById('seekProgress').style.width = '0%';
    document.getElementById('clockText').textContent = '00:00 / --:--';
    updateQualityBadge((item.meta && item.meta.res) || 'HD');
    audioBtn.style.display = 'none';

    updateEpisodeNavigationUI();
    updatePartyBadgesUI();
    setLoader(true);
    screenEl.classList.add('open');

    if (partyRoomCode && !suppressPartyBroadcast) {
      broadcastPartyState(true);
    }

    try {
      activeProbe = await apiFetchFromServer(item.serverUrl, `/api/probe?path=${encodeURIComponent(item.path)}`);
    } catch (e) {
      activeProbe = { duration: 0, resolutionLabel: 'HD', audioTracks: [] };
    }

    updateQualityBadge(activeProbe.resolutionLabel || (item.meta && item.meta.res) || 'HD');

    if (activeProbe.audioTracks && activeProbe.audioTracks.length > 0) {
      audioBtn.style.display = 'inline-flex';
      document.getElementById('audioBtnLabel').textContent = activeProbe.audioTracks[0].shortLabel;
    }

    await startHlsSession(initialStart);
  }

  async function startHlsSession(startSec) {
    if (!activeMedia || !activeMedia.serverUrl) return;
    setLoader(true);

    const video = document.getElementById('videoEl');
    if (hlsInstance) {
      hlsInstance.destroy();
      hlsInstance = null;
    }
    video.pause();

    try {
      const qs = new URLSearchParams({
        path: activeMedia.path,
        start: String(Math.max(0, Math.floor(startSec))),
        atrack: String(activeAudioTrack),
        prev: activeSessionId || ''
      });

      const sess = await apiFetchFromServer(activeMedia.serverUrl, `/api/session?${qs.toString()}`);
      activeSessionId = sess.sessionId;
      streamOffsetSec = Math.max(0, Math.floor(startSec));
      if (sess.duration && !activeProbe.duration) {
        activeProbe.duration = sess.duration;
      }
      if (sess.resolutionLabel) {
        updateQualityBadge(sess.resolutionLabel);
      }

      const fullPlaylistUrl = `${activeMedia.serverUrl}${sess.playlistUrl}`;

      if (window.Hls && Hls.isSupported()) {
        hlsInstance = new Hls({
          enableWorker: true,
          maxBufferLength: 30,
          maxMaxBufferLength: 60,
          manifestLoadingMaxRetry: 6,
          levelLoadingMaxRetry: 6,
          fragLoadingMaxRetry: 8
        });
        hlsInstance.loadSource(fullPlaylistUrl);
        hlsInstance.attachMedia(video);
        hlsInstance.on(Hls.Events.MANIFEST_PARSED, () => {
          video.playbackRate = activeSpeed;
          video.play().catch(() => {});
        });
        hlsInstance.on(Hls.Events.ERROR, (_, data) => {
          if (data.fatal) {
            if (data.type === Hls.ErrorTypes.NETWORK_ERROR) {
              hlsInstance.startLoad();
            } else if (data.type === Hls.ErrorTypes.MEDIA_ERROR) {
              hlsInstance.recoverMediaError();
            } else {
              setLoader(false);
              showToast('Stream interrupted');
            }
          }
        });
      } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
        video.src = fullPlaylistUrl;
        video.load();
        video.playbackRate = activeSpeed;
        video.play().catch(() => {});
      }
    } catch (e) {
      setLoader(false);
      showToast(`Error: ${e.message}`);
    }
  }

  /* ============================================================
     DECLUTTERED OVERFLOW MENU & POPUP SHEETS
     ============================================================ */
  function openPlayerOverflowMenu() {
    document.getElementById('modalTitle').textContent = 'Options';
    const list = document.getElementById('modalList');
    list.innerHTML = `
      <div class="modal-option ${partyRoomCode ? 'selected' : ''}" role="button" tabindex="0" onclick="openWatchPartyModal()">
        <div class="opt-main">
          <div class="opt-title">${partyRoomCode ? `Watch Party (${partyRoomCode})` : 'Start Watch Party'}</div>
          <div class="opt-sub">${partyRoomCode ? `${Math.max(1, partyMembersCount)} connected · Auto-cleans on exit` : 'Watch in sync with friends'}</div>
        </div>
        <span class="mono" style="color:#8bbce8; font-weight:800;">›</span>
      </div>
      <div class="modal-option" role="button" tabindex="0" onclick="restartFromZero()">
        <div class="opt-main">
          <div class="opt-title">Restart</div>
          <div class="opt-sub">Play from 00:00</div>
        </div>
        <span class="mono" style="color:#8bbce8; font-weight:800;">↺</span>
      </div>
      <div class="modal-option" role="button" tabindex="0" onclick="openExternalVLC()">
        <div class="opt-main">
          <div class="opt-title">Open in VLC</div>
          <div class="opt-sub">Download .m3u stream playlist</div>
        </div>
        <span class="mono" style="color:#8bbce8; font-weight:800;">↗</span>
      </div>
    `;
    document.getElementById('modalBackdrop').classList.add('open');
  }

  function restartFromZero() {
    closeModal();
    jumpToPosition(0);
    if (partyRoomCode && !suppressPartyBroadcast) broadcastPartyState(true);
  }

  function openAudioPopup() {
    const tracks = activeProbe.audioTracks || [];
    if (tracks.length === 0) return;

    document.getElementById('modalTitle').textContent = 'Audio';
    const list = document.getElementById('modalList');
    list.innerHTML = tracks.map(tr => `
      <div class="modal-option ${tr.index === activeAudioTrack ? 'selected' : ''}" role="button" tabindex="0" onclick="selectAudioTrack(${tr.index})">
        <div class="opt-main">
          <div class="opt-title">${escapeHtml(tr.title)}</div>
          <div class="opt-sub">${escapeHtml(tr.meta)}</div>
        </div>
        <div class="opt-check">✓</div>
      </div>
    `).join('');
    document.getElementById('modalBackdrop').classList.add('open');
  }

  function selectAudioTrack(trackIdx) {
    closeModal();
    if (trackIdx === activeAudioTrack) return;
    const tracks = activeProbe.audioTracks || [];
    const chosen = tracks.find(t => t.index === trackIdx);
    if (!chosen) return;

    activeAudioTrack = trackIdx;
    document.getElementById('audioBtnLabel').textContent = chosen.shortLabel;

    const cur = streamOffsetSec + (document.getElementById('videoEl').currentTime || 0);
    startHlsSession(cur);
  }

  function openSpeedPopup() {
    document.getElementById('modalTitle').textContent = 'Speed';
    const list = document.getElementById('modalList');
    list.innerHTML = SPEED_OPTIONS.map(opt => `
      <div class="modal-option ${opt.value === activeSpeed ? 'selected' : ''}" role="button" tabindex="0" onclick="selectPlaybackSpeed(${opt.value})">
        <div class="opt-main">
          <div class="opt-title">${escapeHtml(opt.label)}</div>
          <div class="opt-sub">${escapeHtml(opt.sub)}</div>
        </div>
        <div class="opt-check">✓</div>
      </div>
    `).join('');
    document.getElementById('modalBackdrop').classList.add('open');
  }

  function selectPlaybackSpeed(val) {
    closeModal();
    activeSpeed = val;
    const video = document.getElementById('videoEl');
    video.playbackRate = val;
    document.getElementById('speedBtn').textContent = `${val}x`;
  }

  function closeModal() {
    document.getElementById('modalBackdrop').classList.remove('open');
  }

  /* ============================================================
     PLAYBACK CONTROLS & TIMELINE
     ============================================================ */
  const videoEl = document.getElementById('videoEl');

  videoEl.addEventListener('loadedmetadata', () => {
    if (videoEl.videoHeight > 0) {
      const h = videoEl.videoHeight;
      const label = h >= 2160 ? '4K' : (h >= 1440 ? '2K' : (h >= 1080 ? '1080p' : (h >= 720 ? '720p' : (h >= 480 ? '480p' : `${h}p`))));
      updateQualityBadge(label);
    }
  });

  videoEl.addEventListener('playing', () => {
    setLoader(false);
    document.getElementById('playBtn').textContent = 'Pause';
    if (partyRoomCode && !suppressPartyBroadcast) broadcastPartyState();
  });

  videoEl.addEventListener('pause', () => {
    document.getElementById('playBtn').textContent = 'Play';
    if (partyRoomCode && !suppressPartyBroadcast) broadcastPartyState();
  });

  videoEl.addEventListener('waiting', () => {
    setLoader(true);
  });

  videoEl.addEventListener('ended', () => {
    if (isPlayingSeriesFolder() && activeIndex < activePlayerList.length - 1) {
      playNextEpisode();
    }
  });

  videoEl.addEventListener('timeupdate', () => {
    const total = activeProbe.duration || (isFinite(videoEl.duration) ? streamOffsetSec + videoEl.duration : 0);
    const current = streamOffsetSec + (videoEl.currentTime || 0);
    document.getElementById('clockText').textContent = `${formatClock(current)} / ${total > 0 ? formatClock(total) : '--:--'}`;

    if (total > 0) {
      const pct = Math.min(100, Math.max(0, (current / total) * 100));
      document.getElementById('seekProgress').style.width = `${pct}%`;
    }

    if (activeMedia && Math.abs(current - lastSavedTick) >= 5) {
      lastSavedTick = current;
      localStorage.setItem(progressKey(activeMedia.serverId, activeMedia.path), JSON.stringify({ pos: current, dur: total }));
    }
  });

  function jumpToPosition(targetSec) {
    const relTarget = targetSec - streamOffsetSec;
    if (relTarget >= 0 && videoEl.seekable && videoEl.seekable.length > 0) {
      const bufEnd = videoEl.seekable.end(videoEl.seekable.length - 1);
      if (relTarget <= bufEnd) {
        videoEl.currentTime = relTarget;
        if (partyRoomCode && !suppressPartyBroadcast) broadcastPartyState();
        return;
      }
    }
    startHlsSession(targetSec).then(() => {
      if (partyRoomCode && !suppressPartyBroadcast) broadcastPartyState();
    });
  }

  function seekFromBar(e) {
    const total = activeProbe.duration || (isFinite(videoEl.duration) ? streamOffsetSec + videoEl.duration : 0);
    if (!total || total <= 0) return;
    const rect = document.getElementById('seekArea').getBoundingClientRect();
    const ratio = Math.min(1, Math.max(0, (e.clientX - rect.left) / rect.width));
    jumpToPosition(ratio * total);
  }

  function skipBy(delta) {
    const total = activeProbe.duration || 0;
    const current = streamOffsetSec + (videoEl.currentTime || 0);
    const target = Math.max(0, total > 0 ? Math.min(total - 2, current + delta) : current + delta);
    jumpToPosition(target);
  }

  function togglePlayPause() {
    if (videoEl.paused) videoEl.play().catch(() => {});
    else videoEl.pause();
  }

  let savedVol = 1;
  function setVolume(val) {
    const num = Number(val);
    videoEl.volume = num;
    videoEl.muted = num === 0;
    if (num > 0) savedVol = num;
    updateVolumeIcon();
  }

  function toggleMute() {
    if (videoEl.muted || videoEl.volume === 0) {
      videoEl.muted = false;
      videoEl.volume = savedVol || 1;
      document.getElementById('volRange').value = String(videoEl.volume);
    } else {
      savedVol = videoEl.volume || 1;
      videoEl.muted = true;
      document.getElementById('volRange').value = '0';
    }
    updateVolumeIcon();
  }

  function updateVolumeIcon() {
    const icon = document.getElementById('volIcon');
    if (videoEl.muted || videoEl.volume === 0) {
      icon.innerHTML = `<polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/>`;
    } else {
      icon.innerHTML = `<polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/>`;
    }
  }

  function closePlayer() {
    exitFullscreenMode(false);
    closeModal();
    if (hlsInstance) {
      hlsInstance.destroy();
      hlsInstance = null;
    }
    videoEl.pause();
    videoEl.removeAttribute('src');
    videoEl.load();

    if (activeSessionId && activeMedia && activeMedia.serverUrl) {
      fetch(`${activeMedia.serverUrl}/api/stop?id=${encodeURIComponent(activeSessionId)}`).catch(() => {});
      activeSessionId = '';
    }

    activeMedia = null;
    setLoader(false);
    document.getElementById('playerScreen').classList.remove('open');
    renderExplorer();
  }

  function openExternalVLC() {
    closeModal();
    if (!activeMedia || !activeMedia.serverUrl) return;
    window.location.href = `${activeMedia.serverUrl}/api/playlist?path=${encodeURIComponent(activeMedia.path)}`;
    showToast('VLC playlist downloaded');
  }

  function formatClock(sec) {
    const s = Math.floor(sec || 0);
    const h = Math.floor(s / 3600);
    const m = Math.floor((s % 3600) / 60);
    const r = s % 60;
    if (h > 0) return `${h}:${String(m).padStart(2, '0')}:${String(r).padStart(2, '0')}`;
    return `${String(m).padStart(2, '0')}:${String(r).padStart(2, '0')}`;
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
  }

  document.addEventListener('keydown', (e) => {
    if (!document.getElementById('playerScreen').classList.contains('open')) return;
    if (e.key === 'Escape') {
      if (document.getElementById('modalBackdrop').classList.contains('open')) closeModal();
      else if (isFullscreenMode) exitFullscreenMode(false);
      else closePlayer();
    } else if (e.key === ' ' && document.activeElement.getAttribute('role') !== 'button' && document.activeElement.tagName !== 'INPUT') {
      e.preventDefault();
      togglePlayPause();
    } else if (e.key === 'ArrowRight') skipBy(10);
    else if (e.key === 'ArrowLeft') skipBy(-10);
  });
</script>
</body>
