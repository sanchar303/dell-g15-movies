<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>CineVault — Host Control</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="author" content="Sanchar Koirala">
  <meta name="theme-color" content="#14171f" id="metaThemeColor">

  <link rel="icon" type="image/png" sizes="32x32" href="favicon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="favicon.png">
  <link rel="shortcut icon" type="image/png" href="favicon.png">
  <link rel="apple-touch-icon" href="favicon.png">

  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>

  <style>
    :root[data-theme="dark"] {
      --bg: #14171f;
      --surface-elevated: linear-gradient(145deg, #1e2330, #141821);
      --surface-inset: #11141b;
      --shadow-light: rgba(255, 255, 255, 0.045);
      --shadow-dark: rgba(0, 0, 0, 0.72);
      --inset-light: rgba(255, 255, 255, 0.035);
      --inset-dark: rgba(0, 0, 0, 0.78);
      --sheen-top: rgba(255, 255, 255, 0.14);
      --sheen-border: rgba(255, 255, 255, 0.06);
      --text: #f1f5f9;
      --muted: #8b95a7;
      --accent: #38bdf8;
      --accent-2: #818cf8;
      --danger: #f87171;
    }

    :root[data-theme="light"] {
      --bg: #e6ebf2;
      --surface-elevated: linear-gradient(145deg, #f3f6fb, #dce2ec);
      --surface-inset: #dde3ec;
      --shadow-light: rgba(255, 255, 255, 0.92);
      --shadow-dark: rgba(163, 177, 198, 0.62);
      --inset-light: rgba(255, 255, 255, 0.9);
      --inset-dark: rgba(163, 177, 198, 0.65);
      --sheen-top: rgba(255, 255, 255, 0.98);
      --sheen-border: rgba(255, 255, 255, 0.7);
      --text: #18202c;
      --muted: #5d6a7e;
      --accent: #0284c7;
      --accent-2: #4f46e5;
      --danger: #dc2626;
    }

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      min-height: 100dvh;
      background: var(--bg);
      color: var(--text);
      font-family: "Inter", "Segoe UI", system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      transition: background 0.25s ease, color 0.25s ease;
    }

    .neu-card {
      background: var(--surface-elevated);
      border: 1px solid var(--sheen-border);
      border-top-color: var(--sheen-top);
      box-shadow: -8px -8px 18px var(--shadow-light), 10px 10px 24px var(--shadow-dark);
    }

    .neu-inset {
      background: var(--surface-inset);
      border: 1px solid var(--sheen-border);
      box-shadow: inset 4px 4px 9px var(--inset-dark), inset -3px -3px 8px var(--inset-light);
    }

    .neu-btn {
      background: var(--surface-elevated);
      border: 1px solid var(--sheen-border);
      border-top-color: var(--sheen-top);
      box-shadow: -4px -4px 10px var(--shadow-light), 5px 5px 12px var(--shadow-dark);
      border-radius: 999px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-weight: 700;
      font-size: 13px;
      color: var(--text);
      transition: transform 0.16s ease, box-shadow 0.16s ease, color 0.16s ease;
    }

    .neu-btn:hover {
      transform: translateY(-1px);
      color: var(--accent);
    }

    .neu-btn:active {
      transform: translateY(0);
      background: var(--surface-inset);
      box-shadow: inset 3px 3px 7px var(--inset-dark), inset -2px -2px 6px var(--inset-light);
    }

    .neu-btn.primary {
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      color: #ffffff;
      border-top-color: rgba(255, 255, 255, 0.45);
    }
    .neu-btn.primary:hover { color: #ffffff; }

    .neu-btn.danger { color: var(--danger); }

    .panel {
      width: 100%;
      max-width: 480px;
      border-radius: 30px;
      padding: 28px;
    }

    .top-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 24px;
      gap: 12px;
    }

    .title-group h1 {
      margin: 0;
      font-size: 19px;
      font-weight: 800;
      letter-spacing: -0.3px;
    }
    .title-group span {
      font-size: 12px;
      color: var(--muted);
      font-weight: 600;
    }

    .top-controls {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .status-pill {
      padding: 7px 14px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
      color: var(--accent);
    }

    .theme-pill {
      width: 36px;
      height: 36px;
    }

    .well {
      border-radius: 20px;
      padding: 15px 18px;
      margin-bottom: 18px;
    }
    .well-head {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.7px;
      color: var(--muted);
      margin-bottom: 6px;
    }
    .well-val {
      font-family: ui-monospace, Consolas, monospace;
      font-size: 13px;
      color: var(--accent);
      word-break: break-all;
    }

    .field-label {
      display: block;
      font-size: 12px;
      font-weight: 700;
      color: var(--muted);
      margin: 0 0 8px 6px;
    }

    .input-pill {
      height: 46px;
      border-radius: 999px;
      padding: 4px 6px 4px 18px;
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 18px;
    }
    .input-pill input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text);
      font-size: 13.5px;
      font-family: inherit;
      min-width: 0;
    }
    .input-pill input::placeholder { color: var(--muted); }

    .mini-btn {
      height: 34px;
      padding: 0 14px;
      font-size: 12px;
    }

    .btn-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    .btn-full {
      grid-column: 1 / -1;
      height: 46px;
    }
    .btn-half {
      height: 42px;
    }

    .cmd-section {
      margin-top: 22px;
      padding-top: 18px;
      border-top: 1px solid var(--sheen-border);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .cmd-row {
      border-radius: 16px;
      padding: 8px 10px 8px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      font-family: ui-monospace, Consolas, monospace;
      font-size: 12px;
      color: var(--muted);
    }

    .gate {
      text-align: center;
      padding: 10px 0;
    }
    .gate h2 {
      margin: 0 0 18px;
      font-size: 18px;
      font-weight: 800;
    }

    footer {
      margin-top: 22px;
      font-size: 12px;
      color: var(--muted);
      text-align: center;
    }

    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(14px);
      background: var(--surface-elevated);
      color: var(--text);
      border: 1px solid var(--sheen-top);
      padding: 10px 20px;
      border-radius: 999px;
      font-size: 12.5px;
      font-weight: 600;
      box-shadow: 0 14px 32px rgba(0, 0, 0, 0.45);
      opacity: 0;
      pointer-events: none;
      transition: all 0.2s ease;
      z-index: 99;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  </style>
</head>
<body>

  <div class="panel neu-card">
    <div class="top-row">
      <div class="title-group">
        <h1>CineVault Host</h1>
        <span>server-js / url</span>
      </div>
      <div class="top-controls">
        <div class="status-pill neu-inset" id="statusBadge">Locked</div>
        <div class="neu-btn theme-pill" id="btnTheme" role="button" tabindex="0" onclick="toggleTheme()" title="Toggle Theme">☀</div>
      </div>
    </div>

    <!-- PIN Unlock Gate -->
    <div id="gateView" class="gate">
      <h2>Host Access</h2>
      <div class="input-pill neu-inset" style="max-width:260px; margin:0 auto;">
        <input type="password" id="pinInput" placeholder="PIN" inputmode="numeric" onkeydown="if(event.key==='Enter') unlock()">
        <div class="neu-btn mini-btn primary" role="button" tabindex="0" onclick="unlock()">Enter</div>
      </div>
    </div>

    <!-- Host Dashboard -->
    <div id="dashView" style="display:none;">
      <div class="well neu-inset">
        <div class="well-head">
          <span>Active Endpoint</span>
          <span id="timeStamp"></span>
        </div>
        <div class="well-val" id="currentEndpoint">Loading...</div>
      </div>

      <label class="field-label" for="urlInput">Tunnel URL</label>
      <div class="input-pill neu-inset">
        <input type="url" id="urlInput" placeholder="https://xxxx.trycloudflare.com" onkeydown="if(event.key==='Enter') publishUrl()">
        <div class="neu-btn mini-btn" role="button" tabindex="0" onclick="pasteUrl()">Paste</div>
      </div>

      <div class="btn-grid">
        <div class="neu-btn btn-full primary" role="button" tabindex="0" onclick="publishUrl()">Publish Endpoint</div>
        <div class="neu-btn btn-half" role="button" tabindex="0" onclick="verifyEndpoint(activeUrl)">Verify Host</div>
        <div class="neu-btn btn-half danger" role="button" tabindex="0" onclick="markOffline()">Set Offline</div>
      </div>

      <div class="cmd-section">
        <div class="cmd-row neu-inset">
          <span>python server.py</span>
          <div class="neu-btn mini-btn" role="button" tabindex="0" onclick="copyCmd('python server.py')">Copy</div>
        </div>
        <div class="cmd-row neu-inset">
          <span>cloudflared tunnel --url http://localhost:8000</span>
          <div class="neu-btn mini-btn" role="button" tabindex="0" onclick="copyCmd('cloudflared tunnel --url http://localhost:8000')">Copy</div>
        </div>
      </div>
    </div>
  </div>

  <footer>© 2026 Sanchar Koirala | All rights reserved</footer>
  <div class="toast" id="toast"></div>

<script>
  const ADMIN_PIN = "3030";

  const firebaseConfig = {
    apiKey: "AIzaSyDpCAXfhldRc1nCZDWlWNRbcMFjqAh8uPc",
    authDomain: "cloud-db-studio.firebaseapp.com",
    databaseURL: "https://cloud-db-studio-default-rtdb.firebaseio.com",
    projectId: "cloud-db-studio",
    storageBucket: "cloud-db-studio.firebasestorage.app",
    messagingSenderId: "343326148662",
    appId: "1:343326148662:web:987738ccc8f9d6a8253097"
  };

  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();
  const nodeRef = db.ref('server-js');

  let activeUrl = '';

  function applyTheme(theme) {
    document.documentElement.setAttribute('data-theme', theme);
    localStorage.setItem('cinevault_theme', theme);
    document.getElementById('btnTheme').textContent = theme === 'dark' ? '☀' : '☾';
    document.getElementById('metaThemeColor').setAttribute('content', theme === 'dark' ? '#14171f' : '#e6ebf2');
  }

  function toggleTheme() {
    const current = document.documentElement.getAttribute('data-theme') || 'dark';
    applyTheme(current === 'dark' ? 'light' : 'dark');
  }

  applyTheme(localStorage.getItem('cinevault_theme') || 'dark');

  document.addEventListener('keydown', (e) => {
    if (e.target && e.target.getAttribute('role') === 'button' && (e.key === 'Enter' || e.key === ' ')) {
      e.preventDefault();
      e.target.click();
    }
  });

  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(t._timer);
    t._timer = setTimeout(() => t.classList.remove('show'), 2400);
  }

  function unlock() {
    if (document.getElementById('pinInput').value.trim() === ADMIN_PIN) {
      localStorage.setItem('cinevault_admin', '1');
      openDash();
    } else {
      showToast('Invalid PIN');
    }
  }

  function openDash() {
    document.getElementById('gateView').style.display = 'none';
    document.getElementById('dashView').style.display = 'block';
    document.getElementById('statusBadge').textContent = 'Syncing';
    bindDatabase();
  }

  if (localStorage.getItem('cinevault_admin') === '1') {
    openDash();
  }

  function bindDatabase() {
    nodeRef.on('value', (snap) => {
      const data = snap.val() || {};
      activeUrl = data.url ? String(data.url).trim() : '';
      document.getElementById('currentEndpoint').textContent = activeUrl || 'Offline';
      document.getElementById('timeStamp').textContent = data.updatedAt || '';

      if (activeUrl) {
        document.getElementById('urlInput').value = activeUrl;
        verifyEndpoint(activeUrl);
      } else {
        document.getElementById('statusBadge').textContent = 'Offline';
      }
    });
  }

  async function verifyEndpoint(url) {
    if (!url) {
      document.getElementById('statusBadge').textContent = 'Offline';
      return;
    }
    document.getElementById('statusBadge').textContent = 'Checking';
    try {
      const res = await fetch(`${url.replace(/\/+$/, '')}/api/ping`, {
        headers: { 'Bypass-Tunnel-Reminder': 'true' }
      });
      if (!res.ok) throw new Error();
      const info = await res.json();
      document.getElementById('statusBadge').textContent = info.ffmpeg ? 'Online · Audio Ready' : 'Online · No FFmpeg';
    } catch (e) {
      document.getElementById('statusBadge').textContent = 'Unreachable';
    }
  }

  async function publishUrl() {
    let raw = document.getElementById('urlInput').value.trim();
    if (!raw) {
      showToast('Enter tunnel URL');
      return;
    }
    if (!/^https?:\/\//i.test(raw)) raw = 'https://' + raw;
    const clean = raw.replace(/\/+$/, '');
    const stamp = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

    await nodeRef.update({ url: clean, updatedAt: stamp });
    showToast('Endpoint published');
  }

  async function markOffline() {
    await nodeRef.update({ url: '', updatedAt: '' });
    document.getElementById('urlInput').value = '';
    showToast('Marked offline');
  }

  async function pasteUrl() {
    try {
      const txt = await navigator.clipboard.readText();
      if (txt) {
        document.getElementById('urlInput').value = txt.trim();
        showToast('Pasted');
      }
    } catch (e) {
      showToast('Paste manually');
    }
  }

  function copyCmd(cmd) {
    navigator.clipboard.writeText(cmd).then(() => showToast('Copied'));
  }
</script>
</body>
</html>
