<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>Admin</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="author" content="Sanchar Koirala">
  <meta name="theme-color" content="#000000" id="metaThemeColor">

  <link rel="icon" type="image/png" sizes="32x32" href="favicon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="favicon.png">
  <link rel="shortcut icon" type="image/png" href="favicon.png">
  <link rel="apple-touch-icon" href="favicon.png">

  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>

  <style>
    :root[data-theme="dark"] {
      --bg: #000000;
      --surface: #17171a;
      --surface-2: #222226;
      --surface-hover: #2a2a2f;
      --stroke: rgba(255, 255, 255, 0.08);
      --text: #fafafa;
      --text-2: #9a9aa2;
      --blue: #3e8bff;
      --danger: #ff5c5c;
      --shadow: 0 12px 32px rgba(0, 0, 0, 0.55);
    }

    :root[data-theme="light"] {
      --bg: #f4f4f6;
      --surface: #ffffff;
      --surface-2: #ececf0;
      --surface-hover: #e4e4e9;
      --stroke: rgba(0, 0, 0, 0.07);
      --text: #111114;
      --text-2: #666670;
      --blue: #0381fe;
      --danger: #dc2626;
      --shadow: 0 8px 24px rgba(0, 0, 0, 0.06);
    }

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      min-height: 100dvh;
      background: var(--bg);
      color: var(--text);
      font-family: "One UI Sans", "SamsungOne", "Inter", system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      transition: background 0.2s ease, color 0.2s ease;
    }

    .card {
      width: 100%;
      max-width: 460px;
      background: var(--surface);
      border: 1px solid var(--stroke);
      border-radius: 28px;
      padding: 26px;
      box-shadow: var(--shadow);
    }

    .head-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 22px;
      gap: 12px;
    }

    .head-title h1 { margin: 0; font-size: 20px; font-weight: 700; letter-spacing: -0.3px; }
    .head-title span { font-size: 12px; color: var(--text-2); font-weight: 500; }

    .head-right { display: flex; align-items: center; gap: 8px; }

    .status-chip {
      padding: 6px 13px;
      border-radius: 999px;
      background: var(--surface-2);
      font-size: 12px;
      font-weight: 600;
      color: var(--blue);
    }

    .ui-btn {
      background: var(--surface-2);
      border: 1px solid var(--stroke);
      border-radius: 999px;
      color: var(--text);
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: transform 0.14s ease, background 0.14s ease;
    }
    .ui-btn:hover { background: var(--surface-hover); }
    .ui-btn:active { transform: scale(0.96); }

    .ui-btn.primary { background: var(--blue); color: #ffffff; border-color: transparent; }
    .ui-btn.primary:hover { filter: brightness(1.08); }
    .ui-btn.danger { color: var(--danger); }

    .icon-btn { width: 36px; height: 36px; }
    .mini-btn { height: 34px; padding: 0 14px; font-size: 12px; }

    .endpoint-box {
      background: var(--surface-2);
      border-radius: 20px;
      padding: 14px 16px;
      margin-bottom: 18px;
    }
    .endpoint-meta {
      display: flex;
      justify-content: space-between;
      font-size: 11.5px;
      font-weight: 600;
      color: var(--text-2);
      margin-bottom: 5px;
    }
    .endpoint-url {
      font-family: ui-monospace, Consolas, monospace;
      font-size: 13px;
      color: var(--blue);
      word-break: break-all;
    }

    .label {
      display: block;
      font-size: 12.5px;
      font-weight: 600;
      color: var(--text-2);
      margin: 0 0 8px 4px;
    }

    .input-wrap {
      height: 46px;
      background: var(--surface-2);
      border: 1px solid var(--stroke);
      border-radius: 999px;
      padding: 4px 6px 4px 16px;
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 16px;
    }
    .input-wrap:focus-within { border-color: var(--blue); }
    .input-wrap input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text);
      font-size: 13.5px;
      font-family: inherit;
      min-width: 0;
    }
    .input-wrap input::placeholder { color: var(--text-2); }

    .grid-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .btn-full { grid-column: 1 / -1; height: 44px; }
    .btn-half { height: 40px; }

    .cmd-list {
      margin-top: 20px;
      padding-top: 16px;
      border-top: 1px solid var(--stroke);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .cmd-item {
      background: var(--surface-2);
      border-radius: 16px;
      padding: 7px 8px 7px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      font-family: ui-monospace, Consolas, monospace;
      font-size: 12px;
      color: var(--text-2);
    }

    .gate { text-align: center; padding: 8px 0; }
    .gate h2 { margin: 0 0 16px; font-size: 17px; font-weight: 700; }

    footer { margin-top: 20px; font-size: 12px; color: var(--text-2); text-align: center; }

    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(14px);
      background: var(--surface-2);
      color: var(--text);
      border: 1px solid var(--stroke);
      padding: 10px 20px;
      border-radius: 999px;
      font-size: 12.5px;
      font-weight: 600;
      box-shadow: var(--shadow);
      opacity: 0;
      pointer-events: none;
      transition: all 0.2s ease;
      z-index: 99;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  </style>
</head>
<body>

  <div class="card">
    <div class="head-row">
      <div class="head-title">
        <h1>Host Control</h1>
        <span>server-js / url</span>
      </div>
      <div class="head-right">
        <div class="status-chip" id="statusChip">Locked</div>
        <div class="ui-btn icon-btn" id="btnTheme" role="button" tabindex="0" onclick="toggleTheme()" title="Theme">☀</div>
      </div>
    </div>

    <div id="gateView" class="gate">
      <h2>Enter PIN</h2>
      <div class="input-wrap" style="max-width:250px; margin:0 auto;">
        <input type="password" id="pinInput" placeholder="PIN" inputmode="numeric" onkeydown="if(event.key==='Enter') unlock()">
        <div class="ui-btn mini-btn primary" role="button" tabindex="0" onclick="unlock()">Unlock</div>
      </div>
    </div>

    <div id="dashView" style="display:none;">
      <div class="endpoint-box">
        <div class="endpoint-meta">
          <span>Active Tunnel</span>
          <span id="timeStamp"></span>
        </div>
        <div class="endpoint-url" id="currentEndpoint">Loading...</div>
      </div>

      <label class="label" for="urlInput">Tunnel URL</label>
      <div class="input-wrap">
        <input type="url" id="urlInput" placeholder="https://xxxx.trycloudflare.com" onkeydown="if(event.key==='Enter') publishUrl()">
        <div class="ui-btn mini-btn" role="button" tabindex="0" onclick="pasteUrl()">Paste</div>
      </div>

      <div class="grid-actions">
        <div class="ui-btn btn-full primary" role="button" tabindex="0" onclick="publishUrl()">Publish URL</div>
        <div class="ui-btn btn-half" role="button" tabindex="0" onclick="verifyEndpoint(activeUrl)">Test Server</div>
        <div class="ui-btn btn-half danger" role="button" tabindex="0" onclick="markOffline()">Set Offline</div>
      </div>

      <div class="cmd-list">
        <div class="cmd-item">
          <span>python server.js</span>
          <div class="ui-btn mini-btn" role="button" tabindex="0" onclick="copyCmd('python server.js')">Copy</div>
        </div>
        <div class="cmd-item">
          <span>cloudflared tunnel --url http://localhost:8000</span>
          <div class="ui-btn mini-btn" role="button" tabindex="0" onclick="copyCmd('cloudflared tunnel --url http://localhost:8000')">Copy</div>
        </div>
      </div>
    </div>
  </div>

  <footer>© 2026 Sanchar Koirala | All rights reserved</footer>
  <div class="toast" id="toast"></div>

<script>
  const ADMIN_HASH = "048801438c526607";

  const firebaseConfig = {
    apiKey: "AIzaSyDpCAXfhldRc1nCZDWlWNRbcMFjqAh8uPc",
    authDomain: "cloud-db-studio.firebaseapp.com",
    databaseURL: "https://cloud-db-studio-default-rtdb.firebaseio.com",
    projectId: "cloud-db-studio",
    storageBucket: "cloud-db-studio.firebasestorage.app",
    messagingSenderId: "343326148662",
    appId: "1:343326148662:web:987738ccc8f9d6a8253097"
  };

  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();
  const nodeRef = db.ref('server-js');

  let activeUrl = '';

  function hashPin(str) {
    let a = 1, b = 0, h = 5381;
    for (let i = 0; i < str.length; i++) {
      const c = str.charCodeAt(i);
      a = (a + c) % 65521;
      b = (b + a) % 65521;
      h = (((h << 5) + h) + c) >>> 0;
    }
    const p1 = (((b << 16) | a) >>> 0).toString(16).padStart(8, '0');
    const p2 = h.toString(16).padStart(8, '0');
    return p1 + p2;
  }

  function applyTheme(theme) {
    document.documentElement.setAttribute('data-theme', theme);
    localStorage.setItem('oneui_files_theme', theme);
    document.getElementById('btnTheme').textContent = theme === 'dark' ? '☀' : '☾';
    document.getElementById('metaThemeColor').setAttribute('content', theme === 'dark' ? '#000000' : '#f4f4f6');
  }

  function toggleTheme() {
    const cur = document.documentElement.getAttribute('data-theme') || 'dark';
    applyTheme(cur === 'dark' ? 'light' : 'dark');
  }

  applyTheme(localStorage.getItem('oneui_files_theme') || 'dark');

  document.addEventListener('keydown', (e) => {
    if (e.target && e.target.getAttribute('role') === 'button' && (e.key === 'Enter' || e.key === ' ')) {
      e.preventDefault();
      e.target.click();
    }
  });

  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(t._timer);
    t._timer = setTimeout(() => t.classList.remove('show'), 2400);
  }

  function unlock() {
    const entered = document.getElementById('pinInput').value.trim();
    if (hashPin(entered) === ADMIN_HASH) {
      localStorage.setItem('oneui_host_auth', ADMIN_HASH);
      openDash();
    } else {
      showToast('Wrong PIN');
    }
  }

  function openDash() {
    document.getElementById('gateView').style.display = 'none';
    document.getElementById('dashView').style.display = 'block';
    document.getElementById('statusChip').textContent = 'Syncing';
    bindDatabase();
  }

  if (localStorage.getItem('oneui_host_auth') === ADMIN_HASH) {
    openDash();
  }

  function bindDatabase() {
    nodeRef.on('value', (snap) => {
      const data = snap.val() || {};
      activeUrl = data.url ? String(data.url).trim() : '';
      document.getElementById('currentEndpoint').textContent = activeUrl || 'Offline';
      document.getElementById('timeStamp').textContent = data.updatedAt || '';

      if (activeUrl) {
        document.getElementById('urlInput').value = activeUrl;
        verifyEndpoint(activeUrl);
      } else {
        document.getElementById('statusChip').textContent = 'Offline';
      }
    });
  }

  async function verifyEndpoint(url) {
    if (!url) {
      document.getElementById('statusChip').textContent = 'Offline';
      return;
    }
    document.getElementById('statusChip').textContent = 'Checking';
    try {
      const res = await fetch(`${url.replace(/\/+$/, '')}/api/ping`);
      if (!res.ok) throw new Error();
      const info = await res.json();
      document.getElementById('statusChip').textContent = info.ffmpeg ? `Online · ${info.encoder}` : 'Online';
    } catch (e) {
      document.getElementById('statusChip').textContent = 'Unreachable';
    }
  }

  async function publishUrl() {
    let raw = document.getElementById('urlInput').value.trim();
    if (!raw) {
      showToast('Enter URL');
      return;
    }
    if (!/^https?:\/\//i.test(raw)) raw = 'https://' + raw;
    const clean = raw.replace(/\/+$/, '');
    const stamp = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

    await nodeRef.update({ url: clean, updatedAt: stamp });
    showToast('Published');
  }

  async function markOffline() {
    await nodeRef.update({ url: '', updatedAt: '' });
    document.getElementById('urlInput').value = '';
    showToast('Offline');
  }

  async function pasteUrl() {
    try {
      const txt = await navigator.clipboard.readText();
      if (txt) {
        document.getElementById('urlInput').value = txt.trim();
        showToast('Pasted');
      }
    } catch (e) {
      showToast('Paste manually');
    }
  }

  function copyCmd(cmd) {
    navigator.clipboard.writeText(cmd).then(() => showToast('Copied'));
  }
</script>
</body>
</html>
